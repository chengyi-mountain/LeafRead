}
function pauseTTS() {
  state.tts.paused = true;
  speechSynthesis.pause();
}
function resumeTTS() {
  state.tts.paused = false;
  speechSynthesis.resume();
}
function nextTTSSentence() {
  if (state.tts.currentIndex < state.tts.sentences.length - 1) {
    speechSynthesis.cancel();
    state.tts.currentIndex++;
    speakSentence();
  }
}
function prevTTSSentence() {
  if (state.tts.currentIndex > 0) {
    speechSynthesis.cancel();
    state.tts.currentIndex--;
    speakSentence();
  }
}

// ===== Word tooltip (dict / translate) =====
let tipHideTimer = null;
function showWordTip(word, x, y) {
  const tip = document.getElementById('wordTip');
  const cleanWord = word.replace(/[^a-zA-Z\u4e00-\u9fff\s'-]/g, '').trim();
  if (!cleanWord) return;
  
  document.getElementById('tipWord').textContent = cleanWord;
  document.getElementById('tipPhonetic').textContent = '';
  document.getElementById('tipDef').textContent = '加载中…';
  
  // Position
  const rect = tip.getBoundingClientRect();
  const px = Math.min(x, window.innerWidth - 320);
  const py = Math.max(10, y - rect.height - 16);
  tip.style.left = px + 'px';
  tip.style.top = py + 'px';
  tip.classList.add('show');
  
  // Fetch definition
  if (/^[a-zA-Z]+$/.test(cleanWord)) {
    fetchDefinition(cleanWord);
  } else {
    document.getElementById('tipDef').textContent = '中文词汇暂不支持在线释义';
  }
  
  clearTimeout(tipHideTimer);
}

function fetchDefinition(word) {
  // Try dictionaryapi.dev (free, no key)
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()))
    .then(r => r.json())
    .then(data => {
      if (Array.isArray(data) && data[0]) {
        const entry = data[0];
        const phon = entry.phonetic || (entry.phonetics && entry.phonetics[0] && entry.phonetics[0].text) || '';
        document.getElementById('tipPhonetic').textContent = phon;
        const meanings = entry.meanings || [];
        const defs = meanings.slice(0,2).map(m => 
          `<b>${m.partOfSpeech}</b> ${m.definitions.slice(0,2).map(d=>d.definition).join('; ')}`
        ).join('<br>');
        document.getElementById('tipDef').innerHTML = defs || '未找到释义';
      } else {
        document.getElementById('tipDef').textContent = '未找到该词的释义';
      }
    })
    .catch(() => { document.getElementById('tipDef').textContent = '网络词典暂不可用'; });
}

function hideWordTip() {
  document.getElementById('wordTip').classList.remove('show');
}

// ===== Highlights (划线) =====
function toggleHighlight(range) {
  const sel = window.getSelection();
  const text = sel.toString().trim();
  if (!text) return;
  const bookId = state.currentBook.id;
  const chIdx = state.currentChapter;
  const key = bookId + ':' + chIdx;
  if (!state.highlights[key]) state.highlights[key] = [];

  // 检查是否已存在完全相同的划线（去重用文本匹配）
  const existing = state.highlights[key].findIndex(h => h.text === text);
  if (existing >= 0) {
    state.highlights[key].splice(existing, 1);
    saveState();
    renderChapter(chIdx, true);
    toast('已取消划线');
    return;
  }

  // 新增划线
  const startContainer = range.startContainer;
  const startOffset = range.startOffset;
  const endContainer = range.endContainer;
  const endOffset = range.endOffset;

  state.highlights[key].push({
    text,
    startXPath: getXPath(startContainer),
    startOffset,
    endXPath: getXPath(endContainer),
    endOffset,
    time: Date.now(),
    chapterTitle: state.currentBook.chapters[chIdx].title || `第 ${chIdx+1} 章`,
  });
  saveState();
  renderChapter(chIdx, true);
  toast('已添加划线');
}

function getXPath(node) {
  if (!node || node.nodeType !== Node.TEXT_NODE) return '';
  const parts = [];
  let n = node.parentNode;
  while (n && n !== document.getElementById('readerInner') && n !== document.getElementById('pageCanvas')) {
    parts.unshift('');
    n = n.parentNode;
  }
  // 简化：返回从 readerInner/pageCanvas 开始的子节点索引路径
  const path = [];
  let cur = node;
  while (cur && cur.parentNode && cur.parentNode !== document.getElementById('readerInner') && cur.parentNode !== document.getElementById('pageCanvas')) {
    let idx = 0;
    let sib = cur;
    while (sib.previousSibling) { sib = sib.previousSibling; idx++; }
    path.unshift(idx);
    cur = cur.parentNode;
  }
  // 顶层元素索引
  let topIdx = 0;
  let sib = cur;
  while (sib.previousSibling) { sib = sib.previousSibling; topIdx++; }
  path.unshift(topIdx);
  return path.join(',');
}

function renderHighlightsForChapter(chIdx) {
  const bookId = state.currentBook ? state.currentBook.id : null;
  if (!bookId) return;
  const key = bookId + ':' + chIdx;
  const hls = state.highlights[key];
  if (!hls || hls.length === 0) return;

  const container = document.getElementById('readerInner');
  hls.forEach(hl => {
    // 尝试通过文本匹配来高亮（更稳健的方式）
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const idx = node.textContent.indexOf(hl.text);
      if (idx >= 0) {
        try {
          const range = document.createRange();
          range.setStart(node, idx);
          range.setEnd(node, idx + hl.text.length);
          const span = document.createElement('span');
          span.className = 'hl';
          span.dataset.hlKey = key;
          span.dataset.hlText = hl.text;
          range.surroundContents(span);
        } catch(e) { /* 交叉范围忽略 */ }
        break;
      }
    }
  });
}

// ===== Selection Popup =====
let lastSelectionRange = null;

function handleTextSelection() {
  // 延迟执行，避免与 click 事件冲突
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !sel.toString().trim()) {
      // 点击其他地方时隐藏弹窗（除非点击的是弹窗本身）
      return;
    }
    const text = sel.toString().trim();
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) return;

    lastSelectionRange = range.cloneRange();

    // 检测该文本是否已被划线
    const bookId = state.currentBook.id;
    const key = bookId + ':' + state.currentChapter;
    const hls = state.highlights[key] || [];
    const isHighlighted = hls.some(h => h.text === text);

    // 更新弹窗按钮状态
    document.getElementById('selHighlight').textContent = isHighlighted ? '已划线' : '划线';
    document.getElementById('selDel').style.display = isHighlighted ? '' : 'none';

    showSelectionPopup(rect);
  }, 10);
}

function showSelectionPopup(rect) {
  const popup = document.getElementById('selPopup');
  const w = 280; // 预估宽度
  let left = rect.left + rect.width / 2 - w / 2;
  let top = rect.top - 44;

  // 边界保护
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  if (top < 50) top = rect.bottom + 12; // 如果上方放不下，放下方

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  popup.classList.add('show');
}

function hideSelectionPopup() {
  document.getElementById('selPopup').classList.remove('show');
}

function speakSelectionOnly() {
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  if (!text) { toast('请先选中要朗读的文字', 'error'); return; }
  hideSelectionPopup();
  hideWordTip();

  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读', 'error'); return; }

  // 停止之前的朗读
  speechSynthesis.cancel();

  // 朗读选中文本
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.currentBook.lang === 'zh' ? 'zh-CN' : 'en-US';
  u.rate = 1.0;
  u.pitch = 1.0;
  u.onend = () => { state.tts.active = false; };
  state.tts.active = true;
  state.tts.utter = u;
  speechSynthesis.speak(u);

  // 显示 TTS 栏
  document.getElementById('ttsBar').classList.add('show');
  document.getElementById('ttsBook').textContent = '指定朗读';
  document.getElementById('ttsChapter').textContent = text.slice(0, 30) + (text.length > 30 ? '…' : '');

  toast('正在朗读选中文字');
}

function shareFromSelection() {
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  if (!text) { toast('请先选中要分享的文字', 'error'); return; }
  hideSelectionPopup();

  const book = state.currentBook;
  const ch = book.chapters[state.currentChapter];
  showShareModal({
    bookTitle: book.title,
    chapterTitle: ch.title || `第 ${state.currentChapter+1} 章`,
    text: text,
  });
}

function addNoteFromSelection() {
  const sel = window.getSelection();
  if (!sel || !sel.toString().trim()) { toast('请先选中文字', 'error'); return; }
  const text = sel.toString().trim();
  const ch = state.currentBook.chapters[state.currentChapter];
  const bookId = state.currentBook.id;
  const key = bookId + ':' + state.currentChapter;
  if (!state.notes[key]) state.notes[key] = [];
  state.notes[key].push({ text, chapterTitle: ch.title || `第 ${state.currentChapter+1} 章`, time: Date.now() });
  saveState();
  updateNotesBadge();
  hideSelectionPopup();
  hideWordTip();
  sel.removeAllRanges();
  toast('笔记已保存', 'success');
}

function showShareModal(data) {
  const preview = document.getElementById('sharePreview');
  preview.innerHTML = `
    <div class="sp-book">${escapeHtml(data.bookTitle)}</div>
    <div class="sp-text">${escapeHtml(data.text)}</div>
    <div class="sp-chapter">—— ${escapeHtml(data.chapterTitle)}</div>
    <div class="sp-footer">
      <span>书库阅读器 · ${new Date().toLocaleDateString('zh-CN')}</span>
      <span class="sp-logo">📚 书库阅读器</span>
    </div>
  `;
  document.getElementById('shareModal').classList.add('show');

  // 存起来供按钮使用
  state._shareData = data;
}

function hideShareModal() {
  document.getElementById('shareModal').classList.remove('show');
}

function doShare() {
  const data = state._shareData;
  if (!data) return;
  const shareText = `"${data.text}"\n—— ${data.bookTitle} · ${data.chapterTitle}\n\n📚 来自书库阅读器`;

  // 尝试 Web Share API（移动端原生分享）
  if (navigator.canShare && navigator.canShare({ text: shareText }) || (navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent))) {
    navigator.share({
      title: data.bookTitle,
      text: shareText,
    }).then(() => toast('分享成功')).catch(() => { /* 用户取消 */ });
  } else {
    // 桌面端：复制到剪贴板
    copyToClipboard(shareText);
    toast('已复制到剪贴板，可粘贴到微信/备忘录');
  }
  hideShareModal();
}

function copyShareText() {
  const data = state._shareData;
  if (!data) return;
  const shareText = `"${data.text}"\n—— ${data.bookTitle} · ${data.chapterTitle}\n\n📚 来自书库阅读器`;
  copyToClipboard(shareText);
  toast('已复制文字');
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

      if (dx < 0) nextPage(); else prevPage();
    }

    if (document.getElementById('viewReader').classList.contains('hidden')) return;

const PROXY_LIST = [
  (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  (u) => 'https://thingproxy.freeboard.io/fetch/' + u,
];

const discoverState = {
  activeTab: 'all',
  query: '',
  status: 'idle',
  books: [],
};

/* ---------- 工具 ---------- */
function showViewDiscover() {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('viewDiscover').classList.remove('hidden');
  document.getElementById('topbar').classList.add('hidden');
  renderDiscover();
}

function buildDiscoverIndex() {
  const all = [];
  DISCOVER_CATALOG.forEach(cat => {
    (cat.books || []).forEach(b => {
      all.push({ ...b, sourceId: cat.id, sourceName: cat.name, sourceIcon: cat.icon, sourceUrl: cat.url, sourceDesc: cat.desc });
    });
  });
  return all;
}

function renderDiscoverTabs() {
  const tabs = document.getElementById('discoverTabs');
  const idx = buildDiscoverIndex();
  const items = [{ id: 'all', name: '全部', count: idx.length }];
  DISCOVER_CATALOG.forEach(c => {
    items.push({ id: c.id, name: c.icon + ' ' + c.name, count: (c.books || []).length });
  });
  tabs.innerHTML = items.map(t =>
    `<button class="discover-tab${discoverState.activeTab === t.id ? ' active' : ''}" data-id="${t.id}">${t.name}<span style="opacity:.6;margin-left:4px">${t.count}</span></button>`
  ).join('');
  tabs.querySelectorAll('.discover-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      discoverState.activeTab = btn.dataset.id;
      renderDiscoverTabs();
      renderDiscoverGrid();
    });
  });
}

function renderDiscoverGrid() {
  const grid = document.getElementById('discoverGrid');
  const status = document.getElementById('discoverStatus');
  let list = buildDiscoverIndex();
  if (discoverState.activeTab !== 'all') {
    list = list.filter(b => b.sourceId === discoverState.activeTab);
  }
  if (discoverState.query.trim()) {
    const q = discoverState.query.trim().toLowerCase();
    list = list.filter(b =>
      b.title.toLowerCase().includes(q) ||
      (b.author || '').toLowerCase().includes(q) ||
      (b.category || '').toLowerCase().includes(q) ||
      (b.note || '').toLowerCase().includes(q) ||
      (b.sourceName || '').toLowerCase().includes(q)
    );
  }
  status.style.display = 'none';

  if (!list.length) {
    grid.innerHTML = `<div class="discover-empty"><div class="icon">📭</div><div>没有匹配的书籍</div><div style="font-size:12px;margin-top:6px">试试其他关键词</div></div>`;
    renderDiscoverTip();
    return;
  }

  const importedIds = new Set((state.books || []).map(b => b.title + '|' + (b.author || '')));
  const colors = ['#5B6ABF','#0F9D58','#C25205','#7B1FA2','#0277BD','#C2185B','#455A64','#2E7D32'];
  grid.innerHTML = list.map((b, i) => {
    const imported = importedIds.has(b.title + '|' + (b.author || ''));
    const importable = b.src && b.src !== 'manual' && b.src !== '导航' && b.src !== '公版资源';
    const c1 = colors[(b.title.charCodeAt(0) + i) % colors.length];
    const c2 = colors[(b.title.charCodeAt(0) + i + 3) % colors.length];
    return `
    <div class="discover-card" data-importable="${importable}" style="--cover-bg:${c1};--cover-bg2:${c2}">
      <div class="discover-cover">
        <span class="discover-cover-badge">${b.tag || b.category}</span>
        <span class="discover-cover-lang">${b.lang === 'en' ? 'EN' : '中'}</span>
        <div class="discover-cover-title">${escapeHtml(b.title)}</div>
      </div>
      <div class="discover-info">
        <div class="discover-info-title">${escapeHtml(b.title)}</div>
        <div class="discover-info-meta">${escapeHtml(b.author || '未知')} · ${escapeHtml(b.category || '')}</div>
        <div class="discover-info-meta">📚 ${escapeHtml(b.sourceName)}</div>
        <div class="discover-info-actions">
          <button class="d-btn-import ${imported ? 'imported' : ''}" data-act="import" ${imported ? 'disabled' : ''}>
            ${imported ? '✓ 已入库' : (importable ? '在线导入' : '手动录入')}
          </button>
          <button class="d-btn-link" data-act="visit" ${!b.sourceUrl ? 'disabled' : ''}>访问源站</button>
        </div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.discover-card').forEach((card, i) => {
    const b = list[i];
    const importable = b.src && b.src !== 'manual' && b.src !== '导航' && b.src !== '公版资源';
    if (importable) {
      card.addEventListener('click', (e) => {
        if (e.target.closest('.discover-info-actions')) return;
        importFromSource(b);
      });
    }
    card.querySelector('.d-btn-import').addEventListener('click', (e) => {
      e.stopPropagation();
      if (b.src === 'manual' || b.src === '导航' || b.src === '公版资源') {
        openManualImport(b);
      } else {
        importFromSource(b);
      }
    });
    card.querySelector('.d-btn-link').addEventListener('click', (e) => {
      e.stopPropagation();
      if (b.sourceUrl) window.open(b.sourceUrl, '_blank', 'noopener');
    });
  });
  renderDiscoverTip();
}

function renderDiscoverTip() {
  const grid = document.getElementById('discoverGrid');
  const cur = DISCOVER_CATALOG.find(c => c.id === discoverState.activeTab) || DISCOVER_CATALOG[0];
  const tip = document.createElement('div');
  tip.className = 'discover-tip';
  tip.innerHTML = `
    <strong>📖 ${escapeHtml(cur.name)}</strong><br>
    ${escapeHtml(cur.desc)}<br>
    ${cur.url ? `<strong>官方入口：</strong><a href="${escapeHtml(cur.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${escapeHtml(cur.url)}</a>` : ''}
    <br><span style="color:var(--text-sub)">💡 提示：静态网页受浏览器跨域（CORS）限制，在线「一键导入」依赖公共代理转发，若代理不可用请使用「手动录入」或「粘贴网址抓取」功能（书架页导入按钮）离线入库。</span>
  `;
  grid.appendChild(tip);
}

function renderDiscover() {
  renderDiscoverTabs();
  renderDiscoverGrid();
  setDiscoverStatus('idle');
}

function setDiscoverStatus(type, msg) {
  const s = document.getElementById('discoverStatus');
  discoverState.status = type;
  if (type === 'idle') { s.style.display = 'none'; s.innerHTML = ''; return; }
  s.style.display = 'block';
  if (type === 'loading') {
    s.className = ''; s.innerHTML = `<span class="spinner"></span>${escapeHtml(msg || '正在抓取…')}`;
  } else if (type === 'error') {
    s.className = 'error'; s.innerHTML = '⚠️ ' + escapeHtml(msg || '抓取失败');
  } else if (type === 'ok') {
    s.className = ''; s.innerHTML = '✅ ' + escapeHtml(msg || '成功');
  }
}

/* ---------- 在线导入 ---------- */
async function importFromSource(book) {
  const importedIds = new Set((state.books || []).map(b => b.title + '|' + (b.author || '')));
  if (importedIds.has(book.title + '|' + (book.author || ''))) {
    showToast('该书已存在于书库');
    return;
  }
  if (!book.sourceUrl) { openManualImport(book); return; }

  setDiscoverStatus('loading', `正在从 ${book.sourceName} 抓取《${book.title}》…`);

  let lastErr = '';
  for (const mk of PROXY_LIST) {
    const proxyUrl = mk(book.sourceUrl);
    try {
      const res = await fetch(proxyUrl, { headers: { 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const extracted = extractArticle(text, book.sourceUrl);
      if (extracted && extracted.length > 200) {
        addDiscoverBook(book, extracted);
        setDiscoverStatus('ok', `《${book.title}》已入库（${extracted.length} 字）`);
        renderDiscoverGrid();
        return;
      }
      throw new Error('未提取到有效正文（' + (extracted ? extracted.length : 0) + ' 字）');
    } catch (e) {
      lastErr = e.message;
      continue;
    }
  }
  setDiscoverStatus('error', `跨域代理不可用：${lastErr}。请改用「手动录入」或书架页的「粘贴网址抓取」。`);
}

function extractArticle(html, url) {
  if (!html) return '';
  let text = html;
  // 去掉 script/style/head/nav/footer/aside
  text = text.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ');
  text = text.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ');
  text = text.replace(/<head\b[^>]*>[\s\S]*?<\/head>/gi, ' ');
  text = text.replace(/<nav\b[^>]*>[\s\S]*?<\/nav>/gi, ' ');
  text = text.replace(/<footer\b[^>]*>[\s\S]*?<\/footer>/gi, ' ');
  text = text.replace(/<aside\b[^>]*>[\s\S]*?<\/aside>/gi, ' ');
  // 尝试找正文容器
  const bodyMatch = text.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  if (bodyMatch) text = bodyMatch[1];
  // 取最长文本块（正文通常是最长的一段）
  const blocks = text.split(/<\/?(?:div|section|article|p|br|td|li)[^>]*>/i)
    .map(b => b.replace(/<[^>]+>/g, ' '))
    .map(b => b.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"'))
    .map(b => b.replace(/\s+/g, ' ').trim());
  blocks.sort((a, b) => b.length - a.length);
  let main = blocks[0] || '';
  if (main.length < 500) {
    // 退化：整体去标签
    main = text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  }
  return main;
}

function addDiscoverBook(book, bodyText) {
  const id = 'disc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const chapters = splitChapters(bodyText);
  const newBook = {
    id,
    title: book.title,
    author: book.author || '未知',
    cover: book.lang === 'en' ? 'dracula' : 'alice',
    category: book.category || guessCategory(book.title, book.author),
    lang: book.lang || 'zh',
    note: book.note || ('来自 ' + book.sourceName),
    format: '在线导入',
    chapters: chapters.length ? chapters : [{ title: '正文', body: bodyText }],
    source: book.sourceUrl,
  };
  if (!Array.isArray(state.books)) state.books = [];
  state.books.push(newBook);
  saveState();
  showToast(`《${book.title}》已加入书库`);
}

        <button class="import-option" data-act="paste">📝 粘贴正文</button>
        <button class="import-option" data-act="url">🔗 从网址导入</button>
        <div style="font-size:12px;line-height:1.7;color:var(--text-sub)">
          选文件这一步完全在本机完成：文件不经过任何服务器，解析结果只存在这台设备上。
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 260); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  const x = ov.querySelector('[data-close]');
  if (x) x.onclick = close;
  ov.querySelectorAll('.import-option').forEach(btn => {
    btn.onclick = () => {
      const act = btn.dataset.act;
      close();
      if (act === 'file') openShelfFilePicker();
      else if (act === 'paste') openPasteDialog(seed);
      else openUrlImport(seed);
    };
  });
}

/* ---------- 本地文件 / 粘贴 / 网址 三个入口 ---------- */
function openShelfFilePicker() {
  const input = document.getElementById('shelfFileInput');
  if (!input) { alert('文件选择器不可用，请刷新页面后重试。'); return; }
  input.value = '';
  input.click();
}

function openPasteDialog(seed) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  const heading = (seed && seed.title) ? ('粘贴《' + escapeHtml(seed.title) + '》正文') : '粘贴正文导入';
  ov.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div style="font-weight:600;font-size:15px">${heading}</div>
        <button class="icon-btn" data-close="1" title="关闭">✕</button>
      </div>
      <div style="padding:14px 18px 18px">
        <textarea class="import-paste-area" id="pasteArea" placeholder="把正文粘贴到这里…首行可写成书名；像「第X章」「Chapter N」这样的行会自动分章"></textarea>
        <div class="import-dialog-actions">
          <button class="import-dialog-btn" data-close="2">取消</button>
          <button class="import-dialog-btn primary" id="pasteConfirm">导入</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 260); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  const area = ov.querySelector('#pasteArea');
  setTimeout(() => area.focus(), 120);
  ov.querySelector('#pasteConfirm').onclick = () => {
    const txt = (area.value || '').replace(/\r/g, '').trim();
    if (txt.length < 200) { toast('正文太短（至少 200 字），请粘贴完整内容', 'error'); return; }
    close();
    importPastedText(txt, seed);
  };
}

async function importPastedText(txt, seed) {
  const firstLine = (txt.split('\n').find(l => l.trim()) || '').trim();
  const title = (seed && seed.title) || (firstLine.length <= 28 ? firstLine : '粘贴导入');
  const body = (seed && seed.title) ? txt : txt.replace(firstLine, '');
  const chapters = splitTextIntoChapters(body);
  const book = {
    id: 'imp_paste_' + Date.now(),
    title: title,
    author: (seed && seed.author) || '佚名',
    cover: 'imported', imported: true,
    format: '粘贴',
    category: guessCategory(title, ''),
    lang: detectLang(txt),
    chapters: chapters.length ? chapters : [{ title: '正文', body: body }],
  };
  const imported = JSON.parse(localStorage.getItem('reader_imported_books_v2') || '[]');
  let storedInIdb = false;
  try { await idbPutBook(book); storedInIdb = true; } catch (e) { console.warn('IndexedDB 存入失败', e); }
  if (storedInIdb) imported.push(bookMetaOnly(book));
  else imported.push(book);
  try {
    localStorage.setItem('reader_imported_books_v2', JSON.stringify(imported));
  } catch (e) {
    toast('浏览器本地存储写不进去，这本书没有保存下来', 'error');
    return;
  }
  saveState();
  initBooks();
  renderBookshelf();
  toast(`《${title}》已导入（${txt.length} 字 / ${book.chapters.length} 章）`, 'success');

  if (seed) {
    setDiscoverStatus('ok', `《${seed.title}》已手动入库（${txt.length} 字）`);
    renderDiscoverGrid();
  }
}

function openUrlImport(seed) {
  const url = prompt('请输入书籍的在线地址：', seed && seed.sourceUrl ? seed.sourceUrl : '');
  if (url === null) return;
  if (!url.trim()) { toast('没有填写网址', 'error'); return; }
  if (typeof handleUrlFetch === 'function') {
    handleUrlFetch(url.trim()).then(txt => {
      if (txt && txt.length > 200) importPastedText(txt, seed);
      else toast('没抓到可用正文（可能被 CORS 拦截），建议改用本地文件导入', 'error');
    }).catch(() => toast('抓取失败：第三方站点不允许跨域读取，请改用本地文件导入', 'error'));
  } else {
    toast('当前版本不支持在线抓取，请改用本地文件导入', 'error');
  }
}

/* ---------- 书架搜索无结果：公开书源外链 ---------- */
function renderShelfExtLinks(q) {
  const el = document.getElementById('shelfExtLinks');
  if (!el) return;
  const query = (q || '').trim();
  const total = (state.books || []).length;
  const enc = encodeURIComponent(query);
  const items = [
    ['📚 古腾堡公版书库', 'https://www.gutenberg.org/ebooks/search/?query=' + enc],
    ['⭐ 豆瓣读书', 'https://search.douban.com/book/subject_search?search_text=' + enc],
    ['📖 微信读书', 'https://weread.qq.com/web/search/books?keyword=' + enc],
    ['🔎 必应搜索', 'https://www.bing.com/search?q=' + enc + ' 电子书 在线阅读'],
  ];
  el.innerHTML = `
    <div class="shelf-ext-hint">
      本页搜索只覆盖<strong>这台设备上的 ${total} 本书</strong>——静态网页没有后端，浏览器也不允许直接抓取第三方站点（CORS），所以做不到「站内全网检索」。<br>
      ${query ? ('要找《' + escapeHtml(query) + '》，点下面任一入口跳过去搜：') : '要找本机书库以外的书，点下面任一入口：'}
    </div>
    <div class="shelf-ext-btns">
      ${items.map(pair => '<a class="shelf-ext-btn" href="' + pair[1] + '" target="_blank" rel="noopener">' + pair[0] + '</a>').join('')}
    </div>`;
}

/* ---------- 绑定 ---------- */
function bindDiscover() {
  const back = document.getElementById('discoverBack');
  if (back) back.onclick = () => {
    document.getElementById('viewDiscover').classList.add('hidden');
    document.getElementById('viewBookshelf').classList.remove('hidden');
    renderBookshelf();
  };
  const btn = document.getElementById('btnDiscover');
  if (btn) btn.onclick = showViewDiscover;

  // 书架页本地文件导入
  const sImport = document.getElementById('btnShelfImport');
  const sPaste = document.getElementById('btnShelfPaste');
  const sInput = document.getElementById('shelfFileInput');
  const sProg = document.getElementById('shelfImportProgress');
  const sProgText = document.getElementById('shelfImportProgressText');
  if (sImport) sImport.onclick = openShelfFilePicker;
  if (sPaste) sPaste.onclick = function () { openPasteDialog(null); };
  if (sInput) sInput.addEventListener('change', function (e) {
    const files = e.target.files;
    if (files && files.length) handleFiles(files, sProg, sProgText);
    e.target.value = '';
  });
  const input = document.getElementById('discoverSearchInput');
  const clear = document.getElementById('discoverSearchClear');
  if (input) {
    let timer = null;
    input.addEventListener('input', () => {
      clear.style.display = input.value ? 'block' : 'none';
      clearTimeout(timer);
      timer = setTimeout(() => { discoverState.query = input.value; renderDiscoverGrid(); }, 200);
    });
  }
  if (clear) clear.onclick = () => { input.value = ''; discoverState.query = ''; clear.style.display = 'none'; renderDiscoverGrid(); };
}
</script>
