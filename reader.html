<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f0e8">
<title>书库阅读器</title>
<style>
:root {
  --bg: #f5f0e8;
  --bg-elev: #ffffff;
  --bg-overlay: rgba(255,255,255,0.92);
  --text: #2c2c2c;
  --text-sub: #6b6b6b;
  --text-muted: #9a9a9a;
  --accent: #8b6f47;
  --accent-light: #b89b72;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --vh: 100vh;
  --font-serif: "Source Han Serif SC", "Noto Serif CJK SC", Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
  --radius: 14px;
  --radius-sm: 8px;
  --transition: cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --bg-elev: #242424;
  --bg-overlay: rgba(36,36,36,0.95);
  --text: #e8e8e8;
  --text-sub: #a0a0a0;
  --text-muted: #666;
  --accent: #c9a876;
  --accent-light: #8b6f47;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
}
[data-theme="eye"] {
  --bg: #c8e6c0;
  --bg-elev: #d5ecd0;
  --bg-overlay: rgba(213,236,208,0.94);
  --text: #2d3b2a;
  --text-sub: #5a6b52;
  --text-muted: #8a9b82;
  --accent: #4a7c3f;
  --accent-light: #6a9c5f;
  --border: rgba(74,124,63,0.12);
  --border-strong: rgba(74,124,63,0.24);
}
[data-theme="forest"] {
  --bg: #eef3ec;
  --bg-elev: #ffffff;
  --bg-overlay: rgba(255,255,255,0.93);
  --text: #2a3327;
  --text-sub: #5c6b52;
  --text-muted: #8a9a7a;
  --accent: #3d6b4f;
  --accent-light: #5a8c6a;
  --border: rgba(61,107,79,0.1);
  --border-strong: rgba(61,107,79,0.2);
}
[data-theme="ocean"] {
  --bg: #e8f0f5;
  --bg-elev: #ffffff;
  --bg-overlay: rgba(255,255,255,0.93);
  --text: #1e2d38;
  --text-sub: #4a6070;
  --text-muted: #7a90a0;
  --accent: #2a6b8a;
  --accent-light: #4a8cb0;
  --border: rgba(42,107,138,0.1);
  --border-strong: rgba(42,107,138,0.2);
}
/* ===== E-ink 水墨屏：灰绿纸底 + 墨色字 + 微颗粒纸纹，刻意压低对比，不发光 ===== */
[data-theme="eink"] {
  --bg: #e0e2d7;
  --bg-elev: #e6e8dd;
  --bg-overlay: rgba(230,232,221,0.96);
  --text: #33372f;
  --text-sub: #565a4d;
  --text-muted: #868b7c;
  --accent: #4a5044;
  --accent-light: #6b7161;
  --border: rgba(50,55,46,0.16);
  --border-strong: rgba(50,55,46,0.34);
  --shadow: none;
  --shadow-lg: none;
}
/* 纸纹：细颗粒噪点（SVG 湍流，内联无外链）+ 顶部柔光、底部轻微压暗，模拟反射光的纸面 */
[data-theme="eink"] body {
  background-color: #e0e2d7;
  background-image:
    radial-gradient(140% 80% at 50% -12%, rgba(255,255,255,0.16), rgba(255,255,255,0) 58%),
    radial-gradient(130% 70% at 50% 112%, rgba(48,52,44,0.12), rgba(48,52,44,0) 62%),
    url("data:image/svg+xml;charset=utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23g)' opacity='0.05'/></svg>");
  background-repeat: no-repeat, no-repeat, repeat;
  background-size: cover, cover, 180px 180px;
}
/* 阅读区就是纸面本身，不叠白色卡片 */
[data-theme="eink"] .reader-content,
[data-theme="eink"] .reader-inner,
[data-theme="eink"] .page-canvas { background: transparent; }
/* 墨字：略灰、笔画不刺眼 */
[data-theme="eink"] .reader-inner,
[data-theme="eink"] .page-canvas { color: #33372f; }
[data-theme="eink"] .reader-inner h2.chapter-title {
  color: #2c3028;
  letter-spacing: 0.04em;
  font-weight: 600;
}
[data-theme="eink"] .reader-inner .chapter-title::after {
  content: "";
  display: block; width: 46px; height: 1px; margin: 12px auto 0;
  background: rgba(50,55,46,0.35);
}
/* 水墨屏只有灰阶：封面褪成灰绿但保留可读性 */
[data-theme="eink"] .book-cover,
[data-theme="eink"] .comic-page img,
[data-theme="eink"] .reader-inner img { filter: grayscale(1) contrast(0.9) brightness(1.22); }
[data-theme="eink"] .book-cover { box-shadow: 0 2px 8px rgba(40,44,36,0.10); }
[data-theme="eink"] .book-cover .cover-title,
[data-theme="eink"] .book-cover .cover-author,
[data-theme="eink"] .book-cover .cover-top { color: #f2f3ea !important; }
[data-theme="eink"] .book-cover .cover-title { text-shadow: 0 1px 1px rgba(0,0,0,0.35); }
/* 侧栏、卡片：细线代替投影 */
[data-theme="eink"] .sidebar,
[data-theme="eink"] .book-grid.list-view .book-card,
[data-theme="eink"] .shelf-ext-btn,
[data-theme="eink"] .import-option {
  box-shadow: none !important;
  border: 1px solid var(--border);
}
[data-theme="eink"] .sidebar { border-left: 1px solid var(--border-strong); }
[data-theme="eink"] .topbar { border-bottom: 1px solid var(--border); }
/* 选中态用石墨色描边，不用发光 */
[data-theme="eink"] .swatch.active { box-shadow: 0 0 0 2px #e0e2d7, 0 0 0 3.5px #4a5044; }
[data-theme="eink"] .mode-tab.active,
[data-theme="eink"] .font-opt.active { background: #3f4539; color: #eceee4; }
[data-theme="eink"] .reset-btn {
  background: #dcdfd3; border: 1px solid var(--border-strong);
  outline: none; box-shadow: none;
}
[data-theme="eink"] .reset-btn:focus { outline: none; }

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  transition: background .4s var(--transition), color .4s var(--transition);
  -webkit-font-smoothing: antialiased;
}
button { border:none; background:none; color:inherit; font:inherit; cursor:pointer; }
input, textarea, select { font:inherit; color:inherit; }
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:2px; }

/* ===== Layout ===== */
#app { display:flex; flex-direction:column; height:100%; height:100dvh; }
.topbar {
  display:flex; align-items:center; gap:8px;
  padding: 10px 14px; padding-top: max(10px, var(--safe-top));
  background: var(--bg-overlay);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index:100; flex-shrink:0;
  transition: transform .35s var(--transition), opacity .35s var(--transition);
}
.topbar.hidden { transform:translateY(-110%); opacity:0; pointer-events:none; }
.topbar .title-group { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar .title-group .book-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .title-group .chapter-title { font-size:11px; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .actions { display:flex; align-items:center; gap:2px; }

.icon-btn {
  width:38px; height:38px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  color:var(--text); opacity:.75;
  transition: background .2s, opacity .2s, transform .15s;
  position:relative;
}
.icon-btn:hover { background:var(--border); opacity:1; }
.icon-btn:active { transform:scale(.9); opacity:1; }
.icon-btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn .badge { position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--accent); display:none; }
.icon-btn .badge.show { display:block; }

/* ===== Views ===== */
.view { flex:1; overflow:hidden; position:relative; }
.view.hidden { display:none !important; }

/* ===== Bookshelf ===== */
.bookshelf { height:100%; overflow-y:auto; padding: 16px; padding-bottom: max(24px, var(--safe-bottom)); }
.bookshelf-header { text-align:center; padding: 8px 0 20px; }
.bookshelf-header h1 { font-size:22px; font-weight:700; letter-spacing:-.3px; }
.bookshelf-header p { font-size:13px; color:var(--text-sub); margin-top:4px; }

.cover-tag {
  position:absolute; top:6px; right:6px; z-index:2;
  font-size:8px; padding:1px 5px; border-radius:20px;
  background:rgba(0,0,0,.35); color:#fff; backdrop-filter:blur(4px);
  letter-spacing:.3px;
}
.book-grid.list-view .cover-tag { display:none; }

.shelf-search-wrap {
  position:relative; margin: 12px auto 4px; max-width:420px; width:100%;
}
.shelf-search-icon {
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  color:var(--text-muted); pointer-events:none;
}
.shelf-search-input {
  width:100%; box-sizing:border-box;
  padding:10px 34px 10px 36px;
  border-radius:24px; border:1px solid var(--border);
  background:var(--bg-elev); color:var(--text);
  font-size:14px; font-family:inherit; outline:none;
  -webkit-appearance:none; appearance:none;
  transition: border-color .2s, box-shadow .2s;
}
.shelf-search-input::placeholder { color:var(--text-muted); }
.shelf-search-input:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft, rgba(139,111,71,.14));
}
.shelf-search-clear {
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; line-height:20px; text-align:center;
  border-radius:50%; cursor:pointer; color:var(--text-muted);
  background:var(--bg); border:1px solid var(--border); font-size:14px;
}
.shelf-search-clear:active { transform:translateY(-50%) scale(.9); }

.category-bar {
  display:flex; gap:8px; flex-wrap:wrap;
  padding:4px 2px 12px; margin-top:2px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.category-bar::-webkit-scrollbar { display:none; }
.cat-chip {
  flex-shrink:0;
  display:inline-flex; align-items:center; gap:5px;
  padding:7px 14px; border-radius:20px; cursor:pointer;
  font-size:13px; font-family:inherit; font-weight:500;
  border:1px solid var(--border); background:var(--bg-elev);
  color:var(--text-sub);
  transition: all .2s var(--transition);
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.cat-chip:active { transform:scale(.95); }
.cat-chip.active {
  background:var(--cat-color, var(--accent));
  color:#fff; border-color:transparent;
  box-shadow:0 2px 10px -2px var(--cat-color, var(--accent));
}
.cat-count {
  font-size:11px; opacity:.75; font-weight:600;
  padding:0 5px; border-radius:10px; background:rgba(127,127,127,.18);
  min-width:16px; text-align:center;
}
.cat-chip.active .cat-count { background:rgba(255,255,255,.28); color:#fff; }

.shelf-result-info {
  font-size:12px; color:var(--text-muted);
  padding:0 4px 8px; min-height:16px;
}
.book-del {
  position:absolute; top:4px; right:4px; z-index:5; width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:rgba(0,0,0,.42); color:#fff; font-size:15px; line-height:1; border:none;
  opacity:.85; transition:opacity .15s, transform .15s;
}
.book-del:hover { opacity:1; transform:scale(1.08); }
.shelf-import-row { display:flex; gap:10px; justify-content:center; margin:12px 0 4px; flex-wrap:wrap; }
.shelf-import-row .discover-btn { flex:0 1 auto; margin-top:0; }
/* 全站通栏那条 .discover-btn span{display:none} 会把这里的中文压掉，单独覆盖回来 */
.shelf-import-row .discover-btn span { display:inline !important; white-space:nowrap; }
@media (max-width: 430px) {
  .shelf-import-row { gap:8px; }
  .shelf-import-row .discover-btn { padding:9px 12px; font-size:12.5px; }
  #btnDiscover { margin-top:8px; }
}
.shelf-ext-links { margin:18px auto 0; max-width:520px; text-align:left; }
.shelf-ext-hint { font-size:12.5px; line-height:1.7; color:var(--text-sub); margin-bottom:10px; text-align:center; }
.shelf-ext-btns { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.shelf-ext-btn { display:inline-flex; align-items:center; gap:5px; padding:8px 12px; border-radius:10px;
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text); font-size:12.5px;
  text-decoration:none; transition:border-color .18s var(--transition); }
.shelf-ext-btn:hover { border-color:var(--accent); color:var(--accent); }
.import-option { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:13px 14px;
  border-radius:12px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text);
  font-size:14px; line-height:1.4; cursor:pointer; transition:border-color .18s var(--transition); }
.import-option:hover { border-color:var(--accent); }
.import-paste-area { width:100%; min-height:170px; padding:12px; border-radius:12px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.7; resize:vertical; font-family:inherit;
  box-sizing:border-box; }
.import-dialog-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
.import-dialog-btn { padding:9px 16px; border-radius:10px; font-size:13.5px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg-elev); color:var(--text); }
.import-dialog-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }

.shelf-empty {
  text-align:center; padding:48px 20px; color:var(--text-muted);
}
.shelf-empty-icon { font-size:44px; margin-bottom:12px; opacity:.6; }
.shelf-empty-text { font-size:15px; color:var(--text-sub); margin-bottom:6px; }
.shelf-empty-sub { font-size:12px; }

@media (max-width: 640px) {
  .shelf-search-wrap { margin:10px auto 2px; }
  .shelf-search-input { padding:9px 32px 9px 34px; font-size:15px; }
  .cat-chip { padding:6px 12px; font-size:12.5px; }
}
@media (max-width: 420px) {
  .shelf-search-input { border-radius:20px; }
  .cat-count { font-size:10px; padding:0 4px; }
}

.shelf-section-title { font-size:13px; font-weight:600; color:var(--text-sub); margin: 20px 4px 10px; text-transform:uppercase; letter-spacing:.5px; }

.book-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap:16px;
}
.book-grid.list-view {
  grid-template-columns: 1fr;
  gap:8px;
}
.book-card {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; group;
}
.book-grid.list-view .book-card {
  flex-direction:row; align-items:stretch; gap:14px;
  padding:10px; border-radius:var(--radius); background:var(--bg-elev);
  box-shadow:var(--shadow);
}
.book-cover {
  width:100%; aspect-ratio: 2/3;
  border-radius: 8px;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:10px 8px;
  position:relative; overflow:hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.14);
  transition: transform .25s var(--transition), box-shadow .25s var(--transition);
}
.book-card:active .book-cover { transform:scale(.96); }
.book-grid.list-view .book-cover { width:56px; height:84px; flex-shrink:0; border-radius:6px; padding:6px 4px; }
.book-cover .cover-top { font-size:9px; opacity:.8; font-weight:500; }
.book-cover .cover-title { font-size:13px; font-weight:700; line-height:1.25; flex:1; display:flex; align-items:center; text-align:center; justify-content:center; }
.book-grid.list-view .book-cover .cover-title { font-size:10px; }
.book-cover .cover-author { font-size:8px; opacity:.7; text-align:center; }
.book-grid.list-view .book-cover .cover-author { display:none; }
.book-info { text-align:center; width:100%; }
.book-grid.list-view .book-info { text-align:left; display:flex; flex-direction:column; justify-content:center; }
.book-info .book-name { font-size:13px; font-weight:600; line-height:1.3; }
.book-grid.list-view .book-info .book-name { font-size:15px; }
.book-info .book-author { font-size:11px; color:var(--text-sub); margin-top:2px; }
.book-info .book-progress { font-size:10px; color:var(--text-muted); margin-top:3px; }
.book-grid.list-view .book-info .book-progress { margin-top:6px; }

/* Cover colors */
.cover-alice { background: linear-gradient(160deg, #6a5acd, #9370db); color:#fff; }
.cover-lookingglass { background: linear-gradient(160deg, #2d8b7a, #4ecdc4); color:#fff; }
.cover-dracula { background: linear-gradient(160deg, #1a0000, #4a0000); color:#c00; }
.cover-moby { background: linear-gradient(160deg, #0a1628, #1a3a5c); color:#87ceeb; }
.cover-imported { background: linear-gradient(160deg, #555, #888); color:#fff; }

/* ===== Reader ===== */
.reader { height:100%; display:flex; flex-direction:column; position:relative; }
.reader-content {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding: 0 20px;
  padding-top: max(16px, var(--safe-top));
  padding-bottom: max(60px, var(--safe-bottom));
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.reader-content.paged {
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.reader-inner {
  max-width: var(--content-width, 680px);
  margin: 0 auto;
  width:100%;
  font-family: var(--reader-font, var(--font-serif));
  font-size: var(--reader-size, 18px);
  line-height: var(--reader-line, 1.9);
  letter-spacing: var(--reader-space, 0.02em);
  color: var(--text);
  padding: 0 4px;
}
.reader-inner p {
  text-indent: 2em;
  margin-bottom: calc(var(--reader-size, 18px) * var(--reader-line, 1.9) * 0.6);
}
.reader-inner h2.chapter-title {
  font-size: calc(var(--reader-size, 18px) * 1.4);
  font-weight:700; text-align:center;
  margin-bottom: calc(var(--reader-size, 18px) * 1.2);
  letter-spacing:0.01em;
}
.reader-inner .chapter-body { outline:none; }

/* Paged mode */
.page-container {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.page-wrapper {
  width:100%; max-width: var(--content-width, 680px);
  height:100%;
  overflow:hidden; position:relative;
}
.page-canvas {
  position:absolute; top:0; left:0; right:0; bottom:0;
  overflow:hidden;
  font-family: var(--reader-font, var(--font-serif));
  font-size: var(--reader-size, 18px);
  line-height: var(--reader-line, 1.9);
  letter-spacing: var(--reader-space, 0.02em);
  color: var(--text);
  padding: 0 4px;
}
.page-canvas p { text-indent:2em; margin:0; }
.page-canvas h2 { font-size: calc(var(--reader-size, 18px) * 1.4); font-weight:700; text-align:center; margin-bottom: .8em; }
.page-canvas .pb { visibility:hidden; height:0; }
.page-shadow { position:absolute; top:0; bottom:0; width:40px; pointer-events:none; opacity:0; transition:opacity .3s; }
.page-shadow.left { left:0; background:linear-gradient(to right, rgba(0,0,0,.12), transparent); }
.page-shadow.right { right:0; background:linear-gradient(to left, rgba(0,0,0,.12), transparent); }
.page-shadow.show { opacity:1; }
.page-flip-anim { transition: transform .4s ease, opacity .4s ease; }
.page-flip-anim.slide-out-left { transform:translateX(-100%); opacity:0; }
.page-flip-anim.slide-out-right { transform:translateX(100%); opacity:0; }
.page-flip-anim.fade-out { opacity:0; }
.page-flip-anim.slide-in-left { animation: slideInLeft .4s ease forwards; }
.page-flip-anim.slide-in-right { animation: slideInRight .4s ease forwards; }
.page-flip-anim.fade-in { animation: fadeIn .4s ease forwards; }
@keyframes slideInLeft { from{transform:translateX(-30px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes slideInRight { from{transform:translateX(30px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* Click zones for mobile paging */
.click-zones { display:none; }
.reader.paged-mode .click-zones { display:flex; }
.click-zones {
  position:absolute; top:0; left:0; right:0; bottom:0;
  z-index:50; pointer-events:none;
}
.click-zone { flex:1; pointer-events:auto; }

/* Progress bar */
.progress-wrap {
  position:absolute; bottom:0; left:0; right:0;
  height:3px; background:var(--border); z-index:60;
}
.progress-bar { height:100%; background:var(--accent); width:0; transition:width .1s linear; }

/* ===== Sidebar ===== */
.sidebar-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.3); opacity:0; pointer-events:none;
  transition: opacity .3s var(--transition);
}
.sidebar-overlay.show { opacity:1; pointer-events:auto; }
.sidebar {
  position:fixed; top:0; bottom:0; left:0; z-index:210;
  width:300px; max-width:85vw;
  background:var(--bg-elev);
  box-shadow:var(--shadow-lg);
  transform:translateX(-105%);
  transition: transform .35s var(--transition);
  display:flex; flex-direction:column;
  padding-top: max(0px, var(--safe-top));
  padding-bottom: max(0px, var(--safe-bottom));
}
.sidebar.right-side { left:auto; right:0; transform:translateX(105%); }
.sidebar.show { transform:translateX(0); }
.sidebar-header {
  padding:16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.sidebar-header h3 { font-size:15px; font-weight:600; }
.sidebar-body { flex:1; overflow-y:auto; padding:8px; }
.sidebar-footer { padding:12px 16px; border-top:1px solid var(--border); flex-shrink:0; }

/* Chapter list */
.chapter-list { list-style:none; }
.chapter-list li {
  padding:11px 12px; border-radius:var(--radius-sm);
  font-size:13px; color:var(--text-sub);
  cursor:pointer; transition:background .15s, color .15s;
  display:flex; align-items:center; gap:8px;
}
.chapter-list li:hover { background:var(--border); color:var(--text); }
.chapter-list li.active { background:var(--accent); color:#fff; font-weight:500; }
.chapter-list li .ch-num { font-size:11px; opacity:.6; flex-shrink:0; min-width:28px; }
.chapter-list li.active .ch-num { opacity:.8; }
.chapter-list li .ch-text { flex:1; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

/* TOC item with progress */
.toc-item-progress { display:flex; align-items:center; gap:10px; width:100%; }
.toc-item-progress .progress-dot { width:6px; height:6px; border-radius:50%; background:var(--border-strong); flex-shrink:0; }
.toc-item-progress.read .progress-dot { background:var(--accent); }

/* ===== Settings Panel ===== */
.settings-group { margin-bottom:20px; }
.settings-group-title { font-size:12px; font-weight:600; color:var(--text-sub); margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px; }
.setting-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; gap:12px; }
.setting-row label { font-size:14px; flex-shrink:0; }
.setting-control { display:flex; align-items:center; gap:8px; }
.slider { -webkit-appearance:none; appearance:none; width:120px; height:4px; border-radius:2px; background:var(--border-strong); outline:none; cursor:pointer; }
.slider::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid var(--bg-elev); box-shadow:0 1px 4px rgba(0,0,0,.2); }
.value-display { font-size:12px; color:var(--text-sub); min-width:36px; text-align:right; font-variant-numeric:tabular-nums; }

.theme-swatches { display:flex; gap:8px; flex-wrap:wrap; }
.swatch { width:32px; height:32px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .15s, border-color .2s; position:relative; }
.swatch:hover { transform:scale(1.1); }
.swatch.active { border-color:var(--text); }
.swatch::after { content:attr(data-name); position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:9px; white-space:nowrap; color:var(--text-muted); }

.font-options { display:flex; gap:6px; }
.font-opt { padding:6px 10px; border-radius:8px; border:1px solid var(--border); font-size:12px; cursor:pointer; transition:all .2s; background:var(--bg); }
.font-opt.active { border-color:var(--accent); background:var(--accent); color:#fff; }
.font-opt[data-font="serif"] { font-family:var(--font-serif); }
.font-opt[data-font="sans"] { font-family:var(--font-sans); }
.font-opt[data-font="mono"] { font-family:var(--font-mono); }

/* Toggle switch */
.toggle { width:44px; height:24px; border-radius:12px; background:var(--border-strong); position:relative; cursor:pointer; transition:background .25s; flex-shrink:0; }
.toggle.on { background:var(--accent); }
.toggle::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .25s var(--transition); box-shadow:0 1px 3px rgba(0,0,0,.2); }
.toggle.on::after { transform:translateX(20px); }

/* Mode tabs */
.mode-tabs { display:flex; gap:4px; background:var(--border); padding:3px; border-radius:10px; }
.mode-tab { flex:1; padding:7px 0; text-align:center; font-size:12px; border-radius:7px; cursor:pointer; transition:all .2s; color:var(--text-sub); }
.mode-tab.active { background:var(--bg-elev); color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* Segmented control */
.seg-control { display:flex; gap:4px; }
.seg-btn { padding:5px 10px; border-radius:6px; font-size:11px; background:var(--border); color:var(--text-sub); cursor:pointer; transition:all .2s; }
.seg-btn.active { background:var(--accent); color:#fff; }

/* ===== Modal ===== */
.modal-overlay {
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,.4); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center;
  padding:20px; opacity:0; pointer-events:none;
  transition: opacity .3s var(--transition);
}
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal {
  background:var(--bg-elev); border-radius:20px;
  width:100%; max-width:420px; max-height:80vh;
  display:flex; flex-direction:column;
  box-shadow:var(--shadow-lg);
  transform:scale(.95) translateY(10px);
  transition: transform .3s var(--transition);
}
.modal-overlay.show .modal { transform:scale(1) translateY(0); }
.modal-header { padding:18px 20px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
.modal-header h3 { font-size:16px; font-weight:600; }
.modal-body { flex:1; overflow-y:auto; padding:16px 20px; }
.modal-footer { padding:12px 20px 18px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }

/* ===== Notes / Bookmarks ===== */
.note-item, .bookmark-item {
  padding:12px; border-radius:10px; background:var(--border); margin-bottom:8px;
  cursor:pointer; transition:background .15s; position:relative;
}
.note-item:hover, .bookmark-item:hover { background:var(--border-strong); }
.note-item .note-chapter, .bookmark-item .bm-chapter { font-size:11px; color:var(--accent); margin-bottom:4px; }
.note-item .note-text { font-size:13px; line-height:1.6; }
.note-item .note-date { font-size:10px; color:var(--text-muted); margin-top:6px; }
.bookmark-item .bm-text { font-size:13px; line-height:1.6; color:var(--text-sub); }
.bookmark-item .bm-note-input { width:100%; margin-top:8px; padding:8px; border-radius:6px; border:1px solid var(--border-strong); background:var(--bg); font-size:12px; resize:none; min-height:32px; }
.bookmark-item .bm-actions { display:flex; gap:6px; margin-top:8px; }
.reset-btn {
  width:100%; padding:11px 16px; border-radius:10px;
  font-size:13px; font-weight:500;
  background:var(--border); border:1px solid var(--border-strong);
  color:var(--text); transition:all .15s;
}
.reset-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

.mini-btn { padding:4px 10px; border-radius:6px; font-size:11px; background:var(--bg); border:1px solid var(--border-strong); transition:all .15s; }
.mini-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.mini-btn.danger:hover { background:#c0392b; border-color:#c0392b; }

.empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:13px; }
.empty-state svg { width:40px; height:40px; opacity:.3; margin-bottom:10px; }

/* ===== Search ===== */
.search-input-wrap { position:relative; margin-bottom:12px; }
.search-input {
  width:100%; padding:11px 36px 11px 36px; border-radius:10px;
  border:1px solid var(--border-strong); background:var(--bg); font-size:14px;
  outline:none; transition:border-color .2s;
}
.search-input:focus { border-color:var(--accent); }
.search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.4; }
.search-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; opacity:.4; font-size:14px; }
.search-clear:hover { opacity:1; background:var(--border); }
.search-stats { font-size:12px; color:var(--text-sub); margin-bottom:10px; }
.search-result { padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:4px; transition:background .15s; }
.search-result:hover { background:var(--border); }
.search-result .sr-chapter { font-size:11px; color:var(--accent); margin-bottom:3px; }
.search-result .sr-snippet { font-size:12px; color:var(--text-sub); line-height:1.5; }
mark { background:var(--accent); color:#fff; padding:0 2px; border-radius:2px; }

/* ===== TTS Player ===== */
.tts-bar {
  position:fixed; left:0; right:0; bottom:0; z-index:150;
  background:var(--bg-elev); border-top:1px solid var(--border);
  padding:10px 16px; padding-bottom: max(10px, var(--safe-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.08);
  display:flex; align-items:center; gap:12px;
  transform:translateY(120%); transition:transform .35s var(--transition);
}
.tts-bar.show { transform:translateY(0); }
.tts-info { flex:1; min-width:0; }
.tts-info .tts-book { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tts-info .tts-chapter { font-size:11px; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tts-controls { display:flex; align-items:center; gap:4px; }
.tts-btn { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background .15s; }
.tts-btn:hover { background:var(--border); }
.tts-btn.play-btn { background:var(--accent); color:#fff; }
.tts-btn.play-btn:hover { opacity:.9; }
.tts-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ===== Tooltip (dict/translate) ===== */
.word-tip {
  position:fixed; z-index:400; max-width:300px; min-width:200px;
  background:var(--bg-elev); border-radius:12px;
  box-shadow:var(--shadow-lg); padding:12px 14px;
  font-size:13px; line-height:1.6;
  opacity:0; transform:translateY(4px) scale(.97); pointer-events:none;
  transition: opacity .18s var(--transition), transform .18s var(--transition);
  border:1px solid var(--border);
}
.word-tip.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.word-tip .tip-word { font-size:15px; font-weight:700; margin-bottom:6px; }
.word-tip .tip-phonetic { font-size:11px; color:var(--text-sub); margin-bottom:6px; }
.word-tip .tip-def { font-size:12px; color:var(--text-sub); line-height:1.6; margin-bottom:8px; }
.word-tip .tip-actions { display:flex; gap:6px; border-top:1px solid var(--border); padding-top:8px; }
.word-tip .tip-btn { flex:1; padding:5px 0; text-align:center; font-size:11px; border-radius:6px; background:var(--border); transition:background .15s; }
.word-tip .tip-btn:hover { background:var(--accent); color:#fff; }
.word-tip .tip-close { position:absolute; top:6px; right:8px; font-size:14px; opacity:.4; cursor:pointer; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
.word-tip .tip-close:hover { opacity:1; }

/* ===== Selection Popup (划线/笔记/朗读/分享) ===== */
.sel-popup {
  position:fixed; z-index:500; display:none;
  background:var(--bg-elev); border-radius:12px;
  box-shadow:var(--shadow-lg); padding:6px;
  border:1px solid var(--border);
  animation:selPop .16s var(--transition);
}
.sel-popup.show { display:flex; gap:2px; }
@keyframes selPop { from{opacity:0;transform:translateY(6px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
.sel-popup button {
  padding:7px 14px; border-radius:8px; font-size:12px; font-weight:500;
  white-space:nowrap; transition:background .15s; color:var(--text);
}
.sel-popup button:hover { background:var(--accent); color:#fff; }
.sel-popup button.sel-del { color:#c0392b; }
.sel-popup button.sel-del:hover { background:#c0392b; color:#fff; }

/* Highlight in reader */
.hl { background:rgba(255, 200, 50, 0.35); border-radius:2px; cursor:pointer; padding:0 1px; }
[data-theme="dark"] .hl { background:rgba(255, 200, 50, 0.25); }
[data-theme="eink"] .hl { background:rgba(0, 0, 0, 0.12); border-bottom: 1.5px solid #333; }

/* ===== Share Modal ===== */
.share-preview {
  background:var(--bg); border-radius:12px; padding:18px; margin-bottom:14px;
  border:1px solid var(--border);
}
.share-preview .sp-book { font-size:11px; color:var(--accent); margin-bottom:6px; font-weight:600; }
.share-preview .sp-text {
  font-size:15px; line-height:1.8; color:var(--text);
  position:relative; padding-left:12px;
}
.share-preview .sp-text::before {
  content:''; position:absolute; left:0; top:2px; bottom:2px; width:3px;
  background:var(--accent); border-radius:2px;
}
.share-preview .sp-chapter { font-size:11px; color:var(--text-muted); margin-top:10px; }
.share-preview .sp-footer {
  margin-top:14px; padding-top:10px; border-top:1px solid var(--border);
  font-size:10px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;
}
.share-preview .sp-logo { font-weight:700; font-size:11px; color:var(--accent); }

/* ===== Stats ===== */
.stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
.stat-card { padding:14px; border-radius:12px; background:var(--border); text-align:center; }
.stat-card .stat-value { font-size:22px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
.stat-card .stat-label { font-size:11px; color:var(--text-sub); margin-top:4px; }
.streak-calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-top:8px; }
.streak-day { aspect-ratio:1; border-radius:4px; background:var(--border); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--text-muted); position:relative; }
.streak-day.active { background:var(--accent); color:#fff; }
.streak-day.active.level1 { background:var(--accent-light); opacity:.5; }
.streak-day.active.level2 { background:var(--accent-light); opacity:.75; }
.streak-day.active.level3 { background:var(--accent); }
.streak-day.active.level4 { background:var(--accent); box-shadow:0 0 6px var(--accent); }

/* ===== URL Import ===== */
.url-import-wrap { display:flex; gap:8px; margin-bottom:12px; }
.url-input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--border-strong); background:var(--bg); font-size:13px; outline:none; }
.url-input:focus { border-color:var(--accent); }
.url-go-btn { padding:0 16px; border-radius:10px; background:var(--accent); color:#fff; font-size:13px; font-weight:500; white-space:nowrap; }
.url-go-btn:hover { opacity:.9; }
.url-tip { font-size:11px; color:var(--text-sub); margin-bottom:12px; line-height:1.6; }
.file-drop-zone {
  border:2px dashed var(--border-strong); border-radius:14px;
  padding:32px 20px; text-align:center;
  transition: border-color .2s, background .2s;
  cursor:pointer;
}
.file-drop-zone.dragover { border-color:var(--accent); background:var(--border); }
.file-drop-zone svg { width:36px; height:36px; opacity:.3; margin-bottom:8px; }
.file-drop-zone p { font-size:13px; color:var(--text-sub); }
.file-drop-zone .file-types { font-size:11px; color:var(--text-muted); margin-top:6px; }

/* ===== Toast ===== */
.toast-wrap { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast { padding:10px 20px; border-radius:24px; background:rgba(0,0,0,.82); color:#fff; font-size:13px; backdrop-filter:blur(10px); animation:toastIn .3s var(--transition); pointer-events:auto; max-width:80vw; text-align:center; }
.toast.error { background:rgba(192,57,43,.92); }
.toast.success { background:rgba(39,174,96,.92); }
@keyframes toastIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

/* ===== Bottom reader bar ===== */
.reader-bottom-bar {
  position:absolute; bottom:0; left:0; right:0; z-index:70;
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 14px; padding-bottom: max(8px, var(--safe-bottom));
  background:linear-gradient(to top, var(--bg) 40%, transparent);
  pointer-events:none;
}
.reader-bottom-bar .rb-left,
.reader-bottom-bar .rb-right { display:flex; align-items:center; gap:6px; pointer-events:auto; }
.reader-bottom-bar .rb-center { font-size:11px; color:var(--text-muted); pointer-events:auto; }

/* ===== Comic / image pages ===== */
.comic-page { text-align:center; margin: 12px 0; }
.pdf-page-wrap { text-align:center; margin: 8px 0 24px; }
.pdf-page-wrap canvas { max-width:100%; height:auto; display:block; margin:0 auto;
  border-radius:4px; box-shadow:0 4px 18px rgba(0,0,0,.14); background:#fff; }
.pdf-page-status { padding:60px 16px; font-size:14px; color:var(--text-sub); text-align:center; line-height:1.9; }
.pdf-page-next { margin-top:14px; font-size:12px; color:var(--text-muted); letter-spacing:.08em; }
.comic-page img { max-width:100%; height:auto; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.12); display:block; margin:0 auto; }
.comic-page img:active { opacity:.85; }

/* ===== Format badge ===== */
.format-badge { display:inline-block; font-size:9px; padding:2px 6px; border-radius:6px; background:var(--border); color:var(--text-sub); margin-left:6px; vertical-align:middle; text-transform:uppercase; font-weight:600; letter-spacing:.5px; }

/* ===== Color temperature overlay ===== */
.warm-overlay { position:fixed; inset:0; z-index:9999; pointer-events:none; mix-blend-mode:multiply; opacity:0; transition:opacity .3s; }
.warm-overlay.active { opacity:var(--warm-level, 0); }

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:12px; }
  .reader-inner { --content-width: 100%; }
  .sidebar { width:280px; }
}
@media (max-width: 640px) {
  .bookshelf { padding:12px; }
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap:10px; }
  .topbar { padding: 8px 10px; gap:4px; }
  .icon-btn { width:40px; height:40px; }
  .sidebar { width:85vw; }
  .reader-content { padding:0 16px; }
  .reader-inner { font-size:var(--reader-size, 17px); }
  .reader-bottom-bar .rb-center { display:none; }
}
@media (max-width: 420px) {
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap:8px; }
  .book-cover .cover-title { font-size:11px; }
  .modal { max-height:90vh; }
}
@media (min-width: 901px) {
  .sidebar { position:relative; transform:none !important; box-shadow:none; border-right:1px solid var(--border); width:280px; }
  .sidebar-overlay { display:none !important; }
  .sidebar-overlay.show { display:none !important; }
  .reader-layout { display:flex; flex:1; overflow:hidden; }
  .reader-layout .sidebar.right-side { border-right:none; border-left:1px solid var(--border); }
}



/* ===== Online Library ===== */
.online-search-wrap { padding:12px; position:sticky; top:0; background:var(--bg-overlay); z-index:5; backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
.online-search-wrap .shelf-search-wrap { margin-bottom:10px; }
.online-cat-bar { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:none; }
.online-cat-bar::-webkit-scrollbar { display:none; }
.online-cat-chip { flex-shrink:0; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-sub); font-size:13px; white-space:nowrap; cursor:pointer; transition:.2s; }
.online-cat-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.online-cat-chip .cat-ico { margin-right:4px; }
.online-source-info { padding:8px 12px; font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border); }
.online-source-info a { color:var(--accent); text-decoration:none; }
.online-book-list { padding:4px 12px 60px; }
.online-book-item { display:flex; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border); gap:12px; }
.online-book-cover { width:44px; height:62px; border-radius:5px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; text-align:center; color:#fff; }
.online-book-cover .ob-title { font-size:8px; font-weight:700; line-height:1.1; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.online-book-cover .ob-cat { font-size:14px; margin-top:2px; }
.online-book-info { flex:1; min-width:0; }
.online-book-info .ob-name { font-size:14px; font-weight:600; margin-bottom:2px; }
.online-book-info .ob-author { font-size:12px; color:var(--text-sub); margin-bottom:3px; }
.online-book-info .ob-desc { font-size:11px; color:var(--text-muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.online-book-info .ob-meta { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
.online-book-info .ob-tag { font-size:10px; padding:1px 6px; border-radius:3px; background:var(--bg); color:var(--text-sub); }
.online-book-info .ob-tag.lang { background:var(--accent); color:#fff; }
.online-book-action { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
.online-book-action .import-btn { padding:6px 12px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-size:12px; cursor:pointer; white-space:nowrap; }
.online-book-action .import-btn.imported { background:var(--bg); color:var(--text-muted); }
.online-book-action .import-btn:disabled { opacity:.5; cursor:not-allowed; }
.online-book-action .ob-link { font-size:10px; color:var(--text-muted); text-decoration:none; text-align:center; max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.online-empty { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:14px; }
.online-stats { padding:8px 12px; font-size:12px; color:var(--text-sub); border-bottom:1px solid var(--border); }
.spinner { width:18px; height:18px; border:2px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; display:inline-block; }
@keyframes spin { to{transform:rotate(360deg)} }

/* Animations */
@keyframes fadeUp { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
.fade-up { animation:fadeUp .3s var(--transition); }

/* Highlight selection in reader */
.reader-inner ::selection, .page-canvas ::selection { background:var(--accent); color:#fff; }

/* Import progress */
.import-progress { display:none; align-items:center; gap:10px; padding:12px; border-radius:10px; background:var(--border); margin-top:10px; font-size:12px; color:var(--text-sub); }
.import-progress.show { display:flex; }

/* ============ 拓展书库 - 发现页 ============ */
.discover-btn {
  display:inline-flex; align-items:center; gap:6px; margin-top:10px;
  padding:9px 16px; border:1.5px solid var(--border-strong); border-radius:999px;
  background:var(--accent); color:#fff; font-size:13px; font-weight:600; cursor:pointer;
  transition:transform .15s, box-shadow .15s, opacity .15s;
}
.discover-btn:hover { transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.12); }
.discover-btn:active { transform:translateY(0); }

.discover-page { max-width:1000px; margin:0 auto; padding:18px 20px 60px; min-height:100vh; }
.discover-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.discover-back {
  width:40px; height:40px; flex:0 0 auto; border:1px solid var(--border-strong); border-radius:50%;
  background:var(--bg-card); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.discover-back:hover { background:var(--border); }
.discover-search-wrap {
  position:relative; flex:1; display:flex; align-items:center; gap:8px;
  padding:0 14px; height:42px; border:1.5px solid var(--border-strong); border-radius:999px;
  background:var(--bg-card);
}
.discover-search-wrap svg { color:var(--text-sub); flex:0 0 auto; }
.discover-search-input { flex:1; border:none; outline:none; background:transparent; color:var(--text); font-size:14px; }
.discover-search-clear { cursor:pointer; color:var(--text-sub); font-size:18px; line-height:1; padding:2px 4px; }
.discover-search-clear:hover { color:var(--text); }

.discover-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:16px; scrollbar-width:none; }
.discover-tabs::-webkit-scrollbar { display:none; }
.discover-tab {
  flex:0 0 auto; padding:8px 14px; border:1px solid var(--border-strong); border-radius:999px;
  background:var(--bg-card); color:var(--text-sub); font-size:13px; cursor:pointer; white-space:nowrap;
  transition:all .15s;
}
.discover-tab:hover { color:var(--text); border-color:var(--accent); }
.discover-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

.discover-status { text-align:center; color:var(--text-sub); font-size:13px; padding:20px 0; }
.discover-status.error { color:#d33; }
.discover-status .spinner { vertical-align:middle; margin-right:8px; }

.discover-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:16px;
}
.discover-card {
  border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg-card);
  display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s, border-color .15s;
  cursor:default;
}
.discover-card[data-importable="true"] { cursor:pointer; }
.discover-card[data-importable="true"]:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 8px 24px rgba(0,0,0,.1); }
.discover-cover {
  position:relative; aspect-ratio:3/4; display:flex; align-items:flex-end; padding:12px;
  background:linear-gradient(135deg, var(--cover-bg, #6c7a89), var(--cover-bg2, #4a5568));
  color:#fff;
}
.discover-cover-title { font-size:15px; font-weight:700; line-height:1.3; text-shadow:0 1px 3px rgba(0,0,0,.4); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.discover-cover-badge { position:absolute; top:8px; left:8px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.9); color:#333; font-size:10px; font-weight:700; }
.discover-cover-lang { position:absolute; top:8px; right:8px; padding:2px 7px; border-radius:6px; background:rgba(0,0,0,.35); color:#fff; font-size:10px; }
.discover-info { padding:10px 12px; flex:1; display:flex; flex-direction:column; gap:6px; }
.discover-info-title { font-size:13px; font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.discover-info-meta { font-size:11px; color:var(--text-sub); }
.discover-info-actions { display:flex; gap:6px; margin-top:auto; padding-top:4px; }
.discover-info-actions button {
  flex:1; padding:6px 0; border:1px solid var(--border-strong); border-radius:8px; background:var(--bg);
  color:var(--text); font-size:11px; cursor:pointer; transition:all .15s;
}
.discover-info-actions button:hover:not(:disabled) { background:var(--accent); color:#fff; border-color:var(--accent); }
.discover-info-actions button:disabled { opacity:.4; cursor:not-allowed; }
.discover-info-actions button.imported { background:var(--border); color:var(--text-sub); }

.discover-empty { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-sub); }
.discover-empty .icon { font-size:40px; margin-bottom:12px; }
.discover-tip { grid-column:1/-1; margin-top:8px; padding:14px 16px; border-radius:10px; background:var(--bg-card); border:1px dashed var(--border-strong); font-size:12px; color:var(--text-sub); line-height:1.7; }
.discover-tip strong { color:var(--text); }

@media (max-width:640px){
  .discover-page { padding:14px 14px 50px; }
  .discover-grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
  .discover-cover-title { font-size:13px; }
}
@media (max-width:420px){
  .discover-grid { grid-template-columns:repeat(2, 1fr); gap:10px; }
  .discover-btn span { display:none; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header class="topbar hidden" id="topbar">
    <button class="icon-btn" id="btnBack" title="返回书架">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title-group">
      <span class="book-title" id="topbarBook"></span>
      <span class="chapter-title" id="topbarChapter"></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btnTTS" title="朗读">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
      </button>
      <button class="icon-btn" id="btnBookmark" title="添加书签">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        <span class="badge" id="bookmarkBadge"></span>
      </button>
      <button class="icon-btn" id="btnSearch" title="搜索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button class="icon-btn" id="btnNotes" title="笔记">
        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4z"/></svg>
        <span class="badge" id="notesBadge"></span>
      </button>
      <button class="icon-btn" id="btnTOC" title="目录">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h12"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
      <div class="actions-extra" style="display:none">
      <button class="icon-btn" id="btnBookmarks" title="书签">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      </button>
      <button class="icon-btn" id="btnStats" title="阅读统计">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17V9M12 17V7M16 17v-4"/></svg>
      </button>
      <button class="icon-btn" id="btnImport" title="导入">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
      </button>
    </div>
  </header>

  <!-- Views -->
  <main class="view" id="viewBookshelf">
    <div class="bookshelf" id="bookshelf">
      <div class="bookshelf-header">
        <h1>我的书库</h1>
        <p id="bookshelfSubtitle">轻触封面开始阅读</p>
        <div class="shelf-search-wrap">
          <svg class="shelf-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input class="shelf-search-input" id="shelfSearchInput" type="text" placeholder="搜索书名、作者…" autocomplete="off">
          <span class="shelf-search-clear" id="shelfSearchClear" style="display:none">×</span>
        </div>
        <button class="discover-btn" id="btnDiscover" title="拓展书库">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>
          <span>拓展书库</span>
        </button>
      </div>
      <div class="shelf-import-row">
        <button class="discover-btn" id="btnShelfImport" title="导入本地文件">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/></svg>
          <span>导入本地文件</span>
        </button>
        <button class="discover-btn" id="btnShelfPaste" title="粘贴正文">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          <span>粘贴正文</span>
        </button>
      </div>
      <input type="file" id="shelfFileInput" multiple accept=".txt,.epub,.html,.htm,.md,.markdown,.pdf,.pptx,.ppt,.docx,.doc,.xlsx,.xls,.rtf,.cbr,.cbz,.fb2,.azw3,.mobi,.odt,.ods,.odp,.jpg,.jpeg,.png,.gif,.webp,.bmp,.avif" style="display:none">
      <div class="import-progress" id="shelfImportProgress">
        <div class="spinner"></div>
        <span id="shelfImportProgressText">正在处理…</span>
      </div>
      <div class="category-bar" id="categoryBar"></div>
      <div class="shelf-result-info" id="shelfResultInfo"></div>
      <div class="shelf-section-title" id="builtinSectionTitle">内置书籍</div>
      <div class="book-grid" id="builtinGrid"></div>
      <div class="shelf-section-title" id="importedSectionTitle" style="display:none">已导入书籍</div>
      <div class="book-grid" id="importedGrid" style="display:none"></div>
      <div class="shelf-empty" id="shelfEmpty" style="display:none">
        <div class="shelf-empty-icon">📚</div>
        <div class="shelf-empty-text">没有找到匹配的书籍</div>
        <div class="shelf-empty-sub">试试其他关键词，或清除筛选条件</div>
        <div class="shelf-ext-links" id="shelfExtLinks"></div>
      </div>
    </div>
  </main>

  <main class="view hidden" id="viewDiscover">
    <div class="discover-page">
      <div class="discover-header">
        <button class="discover-back" id="discoverBack" title="返回">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="discover-search-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input class="discover-search-input" id="discoverSearchInput" type="text" placeholder="搜索书名、作者、来源…" autocomplete="off">

        </div>
      </div>
      <div class="discover-tabs" id="discoverTabs"></div>
      <div class="discover-body" id="discoverBody">
        <div class="discover-status" id="discoverStatus"></div>
        <div class="discover-grid" id="discoverGrid"></div>
      </div>

  <main class="view hidden" id="viewReader">

      </div>

</div>

<!-- Tooltip -->

</div>

<!-- Toast container -->
