window.__BUILTIN_BOOKS__=[{"id": "alice", "title": "爱丽丝漫游奇境", "author": "Lewis Carroll", "cover": "alice", "category": "童话", "lang": "en", "note": "节选：前两章", "chapters": [{"title": "CHAPTER I. Down the Rabbit-Hole", "body": "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, \"and what is the use of a book,\" thought Alice, \"without pictures or conversations?\"\n\nSo she was considering, in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.\n\nThere was nothing so very remarkable in that; nor did Alice think it so very much out of the way to hear the Rabbit say to itself, \"Oh dear! Oh dear! I shall be late!\" (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually took a watch out of its waistcoat-pocket, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and was just in time to see it pop down a large rabbit-hole under the hedge.\n\nIn another moment down went Alice after it, never once considering how in the world she was to get out again.\n\nThe rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down what seemed to be a very deep well.\n\nEither the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her, and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled \"ORANGE MARMALADE,\" but to her great disappointment it was empty; she did not like to drop the jar, so managed to put it into one of the cupboards as she fell past it.\n\n\"Well!\" thought Alice to herself. \"After such a fall as this, I shall think nothing of tumbling down-stairs! How brave they'll all think me at home! Why, I wouldn't say anything about it, even if I fell off the top of the house!\" (Which was very likely true.)\n\nDown, down, down. Would the fall never come to an end? \"I wonder how many miles I've fallen by this time?\" she said aloud. \"I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—\" (for, you see, Alice had learnt several things of this sort in her lessons in the school-room, and though this was not a very good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over again): \"—yes, that's about the right distance—but then I wonder what Latitude or Longitude I've got to?\" (Alice had not the slightest idea what Latitude was, or Longitude either, but she thought they were nice grand words to say.)\n\nPresently she began again. \"I wonder if I shall fall right through the earth! How funny it'll seem to come out among the people that walk with their heads downwards! The Antipathies, I think—\" (she was rather glad there was no one listening, this time, as it didn't sound at all the right word): \"—but I shall have to ask them what the name of the country is, you know. Please, Ma'am, is this New Zealand or Australia?\" (and she tried to curtsey as she spoke—fancy curtseying as you're falling through the air! Do you think you could manage it?) \"And what an ignorant little girl she'll think me for asking! No, it'll never do to ask: perhaps I shall see it written up somewhere.\"\n\nDown, down, down. There was nothing else to do, so Alice soon began talking again. \"Dinah'll miss me very much to-night, I should think!\" (Dinah was the cat.) \"I hope they'll remember her saucer of milk at tea-time. Dinah, my dear! I wish you were down here with me! There are no mice in the air, I'm afraid, but you might catch a bat, and that's very like a mouse, you know. But do cats eat bats, I wonder?\" And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, \"Do cats eat bats? Do cats eat bats?\" and sometimes, \"Do bats eat cats?\" for, you see, as she couldn't answer either question, it didn't much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her, very earnestly, \"Now, Dinah, tell me the truth: did you ever eat a bat?\" when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over.\n\nAlice was not a bit hurt, and she jumped up in a moment. She looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, \"Oh my ears and whiskers, how late it's getting!\" She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.\n\nThere were doors all round the hall, but they were all locked; and when Alice had been all round it, and on both sides of it, and had tried all the doors, she walked sadly down the middle, wondering how she was ever to get out again.\n\nSuddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it but a tiny golden key, and Alice's first idea was that this might belong to one of the doors of the hall; but, alas! either the locks were too large, or the key was too small, but, in either case, it would not open any of them. However, on the second time round, she came upon a low curtain she had not noticed before, and behind it was a little door about fifteen inches high: she tried the little golden key in the lock, and to her great delight it fitted!\n\nAlice opened the door and found that it led into a small passage, not much larger than a rat-hole: she knelt down and looked along the passage into the loveliest garden you ever saw. How she longed to get out of that dark hall, and wander about among those beds of bright flowers and those cool fountains, but she could not even get her head through the doorway; \"and even if my head would go through,\" thought poor Alice, \"it would be very little use without my shoulders. Oh, how I wish I could shut up like a telescope! I'm sure I can, if I only know how to begin.\" For, you see, so many out-of-the-way things had happened lately, that Alice had begun to think that very few things indeed were really impossible.\n\nThere seemed to be no use in waiting by the little door, so she went back to the table, half hoping she might find another key on it, or at any rate a book of rules for shutting people up like telescopes: this time she found a little bottle on it (\"which certainly was not here before,\" said Alice), and tied round the neck of the bottle was a paper label, with the words \"DRINK ME\" beautifully printed on it in large letters.\n\nIt was all very well to say \"Drink me,\" but the wise little Alice was not going to do that in a hurry. \"No, I'll look first,\" she said, \"and see whether it's marked 'poison' or not,\" for she had read several nice little stories about children who had got burnt, and eaten up by wild beasts, and other unpleasant things, all because they would not remember the simple rules their friends had taught them: such as, that a red-hot poker will burn you if you hold it long enough; and that if you cut your finger very deeply with a knife, it usually bleeds; and she had never forgotten that, if you drink much from a bottle marked \"poison,\" it is almost certain to disagree with you, sooner or later.\n\nHowever, this bottle was not marked \"poison,\" so Alice ventured to taste it, and, finding it very nice (it had, in fact, a sort of mixed flavour of cherry-tart, custard, pineapple, roast turkey, toffee, and hot buttered toast), she very soon finished it off.\n\n\"What a curious feeling!\" said Alice. \"I must be shutting up like a telescope!\"\n\nAnd so it was indeed: she was now only ten inches high, and her face brightened up at the thought that she was now the right size for going through the little door into that lovely garden. First, however, she waited for a few minutes to see if she was going to shrink any further: she felt a little nervous about this; \"for it might end, you know,\" said Alice to herself, \"in my going out altogether, like a candle. I wonder what I should be like then?\" And she tried to fancy what the flame of a candle looks like after the candle is blown out, for she could not remember having ever seen such a thing.\n\nAfter a while, finding that nothing more happened, she decided on going into the garden at once; but, alas for poor Alice! when she got to the door, she found she had forgotten the little golden key, and when she went back to the table for it, she found she could not possibly reach it: she could see it quite plainly through the glass, and she tried her best to climb up one of the legs of the table, but it was too slippery, and when she had tired herself out with trying, the poor little thing sat down and cried.\n\n\"Come, there's no use in crying like that!\" said Alice to herself, rather sharply. \"I advise you to leave off this minute!\" She generally gave herself very good advice (though she very seldom followed it), and sometimes she scolded herself so severely as to bring tears into her eyes; but she generally managed to quiet herself in a little while, and would then tell herself off for being such a baby.\n\nSoon her eye fell on a little glass box that was lying under the table: she opened it, and found in it a very small cake, on which the words \"EAT ME\" were beautifully marked in currants. \"Well, I'll eat it,\" said Alice, \"and if it makes me grow larger, I can reach the key; and if it makes me grow smaller, I can creep under the door: so either way I'll get into the garden, and I don't care which happens!\"\n\nShe ate a little bit, and then waited to see what would happen; but nothing happened. \"It's much the most curious thing I ever saw in all my life!\" she said at last. \"I must, certainly, have been changed for Mabel! I'll try if I know all the things I used to know. Let me see: four times five is twelve, and four times six is thirteen, and four times seven is—oh dear! I shall never get to twenty at that rate! However, the Multiplication Table doesn't signify: let's try Geography. London is the capital of Paris, and Paris is the capital of Rome, and Rome—no, that's all wrong, I'm certain! I must have been changed for Mabel! I'll try the bones next.\"\n\nShe began again. \"Surely I can't be Mabel, for her hair goes in such long ringlets, and mine doesn't go in ringlets at all; and I'm sure I can't be Mabel, for I know all sorts of things, and she, oh! she knows such a very little! Besides, she's she, and I'm I, and—oh dear, how puzzling it all is! I'll try if I know who I am, then. I will! I'm sure I'm not Mabel.\"\n\nShe had just succeeded in curving her small waist so that she could just get her head through, when she was startled by a loud voice from the other side of the hall. \"Now then! Now then! We shall be late!\" It was the White Rabbit, trotting slowly back again, and looking anxiously about as it went, as if it had lost something; and she heard it muttering to itself, \"The Duchess! The Duchess! Oh, my dear paws! Oh, my fur and whiskers! She'll get me executed, as sure as ferrets are ferrets! Where can I have dropped them, I wonder?\" Alice guessed in a moment that it was looking for the fan and the pair of white kid gloves, and she very good-naturedly began hunting about for them, but they were nowhere to be seen—everything seemed to have changed since her swim in the pool, and the great hall, with the glass table and the little door, had vanished completely.\n\nSoon the Rabbit noticed Alice, and called out to her, in an angry tone, \"Why, Mary Ann, what are you doing out here? Run home this moment, and fetch me a pair of gloves and a fan! Quick, now!\" And Alice was so much frightened that she ran off at once, without thinking, and very soon came to a neat little house, on the door of which was a bright brass plate with the name \"W. RABBIT\" engraved upon it. She went in without knocking, and hurried upstairs, in great fear lest she should meet the real Mary Ann, and be turned out of the house before she had found the fan and gloves.\n\nBy this time she had found her way into a tidy little room with a table in the window, and on it (as she had hoped) a fan and two or three pairs of tiny white kid gloves: she took up the fan and a pair of the gloves, and was just leaving the room, when her eye fell upon a little bottle that stood near the looking-glass. There was no label on it this time with the words \"DRINK ME,\" but nevertheless she uncorked it and put it to her lips. \"I know something interesting is sure to happen,\" she said to herself, \"whenever I eat or drink anything; so I'll just see what this bottle does. I do hope it'll make me grow large again, for really I'm quite tired of being such a tiny little thing!\"\n\nIt did so indeed, and much sooner than she had expected: before she had drunk half the bottle, she found her head pressing against the ceiling, and had to stoop to save her neck from being broken. She hastily put down the bottle, saying to herself, \"That's quite enough—I hope I sha'n't grow any more—as it is, I can't get out at the door—I do wish I hadn't drunk quite so much!\"\n\nAlas! it was too late to wish that! She went on growing, and growing, and very soon had to kneel down: in another minute there was not room even for this, and she tried the effect of lying down with one elbow against the door, and the other arm curled round her head. Still she went on growing, and, as a last resource, she put one arm out of the window, and one foot up the chimney, and said to herself, \"Now I can do no more. What will become of me?\"\n\nLuckily for Alice, the little magic bottle had now had its full effect, and she grew no larger. After a few minutes she heard a voice outside, and stopped to listen.\n\n\"Mary Ann! Mary Ann!\" said the voice. \"Fetch me my gloves this moment!\" Then came a little pattering of feet on the stairs. Alice knew it was the Rabbit coming to look for her, and she trembled till she shook the house, quite forgetting that she was now about a thousand times as large as the Rabbit, and had no reason to be afraid of it.\n\nPresently the Rabbit came up to the door, and tried to open it; but, as the door opened inwards, and Alice's elbow was pressed hard against it, that was a difficult thing to do. Alice heard it say to itself, \"Then I'll go round and get in at the window.\"\n\n\"That you won't!\" thought Alice, and, after waiting till she fancied she heard the Rabbit just under the window, she suddenly spread out her hand, and made a snatch in the air. She did not get hold of anything, but she heard a little shriek and a fall, and a crash of broken glass, from which she concluded that it was just possible it had got into a cucumber-frame, or something of the sort.\n\n\"Mary Ann! Mary Ann!\" said the voice. \"Where are you?\" And then, \"I'd better go and fetch the master.\"\n\nThe next thing was a loud knocking at the door, and a voice from the chimney, \"If you don't open the door directly, I shall kick it down!\" Alice thought she might as well hold her tongue, for she didn't feel at all comfortable herself, and as the knocking was more and more violent, she once more spread out her hand, and made another snatch in the air. This time there were two little shrieks, and more sounds of broken glass. \"What a number of cucumber-frames they must have!\" thought Alice. \"I wonder what they'll do next! As for pulling me out of the window, I only wish they could! I'm sure I don't want to stay in here any longer!\"\n\nShe waited for some time without hearing anything more: at last came a rumbling of little cart-wheels, and the sound of a good many voices all talking together: she made out the words, \"Where's the other ladder?—Why, I hadn't to bring but one; Bill's got the other—Bill! fetch it here, lad!—Here, put 'em up at this corner—No, tie 'em together first—they don't reach half high enough yet—Oh! they'll do well enough; don't be particular—Here, Bill! catch hold of this rope—Will the roof bear?—Mind that loose slate—Oh, it's coming down! Heads below!\" and a great crash of broken glass and tiles came rattling down into the chimney, and a whole shower of little pebbles came rattling down into Alice's head. \"Now, if they had any sense,\" she said to herself, \"they'd have the roof off.\" (Which was most likely true.)\n\nThere was a pause, and then a little shrill voice, which Alice thought was that of Bill, the Lizard, saying, \"Why, I wouldn't do it for a kingdom!\" and then another voice, \"Bill be your guide! What do you think the master'll say? If I only hint at such a thing, he'd have my head cut off in a minute, he would! Come on, Bill!\" And then there was silence for a minute or two, and then they all began again. \"Here, Bill! the master says you've got to go down the chimney!\" \"Oh! So Bill's got to come down the chimney, has he?\" said Alice to herself. \"Shy, they seem to put everything upon Bill! I wouldn't be in Bill's place for a good deal: this fireplace is narrow, to be sure; but I think I can kick a little!\"\n\nShe drew her foot as far down the chimney as she could, and waited till she heard a little animal (she couldn't guess of what sort it was) scratching and scrambling in the chimney close above her: then, saying to herself, \"This is Bill,\" she gave one sharp kick, and waited to see what would happen next.\n\nThe first thing she heard was a general chorus of \"There goes Bill!\" then the Rabbit's voice alone—\"Catch him, you by the hedge!\" then silence, and then another confusion of voices—\"Hold up his head—Brandy now—Don't choke him—How was it, old fellow? What happened to you? Tell us all about it!\"\n\nAt last came a little feeble, squeaking voice (\"That's Bill,\" thought Alice), \"Well, I hardly know—No more, thank ye; I'm better now—but I'm a deal too flustered to tell you all I could recollect, and what with the flickering of those candles, and being so tired, I don't know what I do know—but, 'pon my word, I'm just right! But it's no use talking about it here, I'd better go home quietly, and think it over.\"\n\n\"So you'd better go down the chimney as you are!\" shouted the Rabbit.\n\nThe voice of Bill said, \"I'm not particular as to the shape,\" and Alice thought he sounded rather pleased at the idea of making his escape in that way, if he could. She waited patiently for some time, but Bill did not seem to be coming down: and at last, hearing a little pattering of footsteps, she suddenly spread out her hand again, and made another snatch in the air. This time there were three little shrieks, and a great many more sounds of broken glass. \"What a number of cucumber-frames they must have!\" said Alice, aloud this time.\n\nThen came the voice of the Rabbit again—\"Back to the house, you two! And here, Bill! take a barrow and collect all the broken glass, and be quick about it.\" There was a sound of many footsteps, and Alice knew that the little crowd had dispersed in all directions, and she ran after them as fast as she could, but she was too late: they were already out of sight. \"It's no use,\" she said, \"they're gone! I may as well go home quietly, and think it over.\"\n\nSo she began nibbling some of the cakes on the table, and waited for the little crowd to return; but the more she waited, the more the cakes seemed to disappear, and at last she fell fast asleep, and dreamt of the whole adventure over again.\n\nWhen she awoke, the Rabbit was sitting on the table, fanning himself with one of the white kid gloves. \"Oh, my dear paws!\" he was saying. \"How late it's getting! Oh, my fur and whiskers! I shall be executed as sure as ferrets are ferrets!\"\n\n\"Please, Sir,\" said Alice, \"if you'd only tell me what it's all about—\"\n\n\"About?\" said the Rabbit. \"Oh, I couldn't explain it to you, my dear, just now; the fact is, you see, I'm in such a dreadful state of mind about it all, that I hardly know what I'm doing. And as for you, Mary Ann—\"\n\n\"But I'm not Mary Ann!\" said Alice, very positively.\n\n\"Oh, no, of course not,\" said the Rabbit. \"I can see that with half an eye. But all the same, Mary Ann, you run home this moment, and fetch me a pair of gloves and a fan, and mind you don't loiter by the way. Quick, now!\"\n\n\"I will, Sir, I will!\" said Alice, and ran off.\n\n\"Oh, you foolish Alice!\" she said to herself, as she ran. \"How can you learn lessons in here? Why, there's hardly room for you, and no room at all for any lesson-books! And besides, you're always getting smaller and larger, and that's so confusing. Oh, dear! I wish I was at home again! But I'm not at all sure that I ever shall be at home again, and if I am, I'm sure I shall have changed so much that nobody will know me.\"\n\nShe was still musing on the strangeness of her adventures, when she was startled by a loud barking somewhere in the wood. \"There's a great dog close by,\" said Alice, \"and it's coming this way! I'd better be going.\"\n\nBut she did not go far before she came upon a great open place, with a little house in it about four feet high. \"Whoever lives there,\" thought Alice, \"it'll never do to come upon them this size: why, I should frighten them out of their wits!\" So she began nibbling at one of the cakes again, and was delighted to find that she reduced herself down to nine inches high before she went near the house: she walked up to the door and knocked.\n\nThere was a long silence after this, and Alice could only hear whispers now and then, such as, \"So, so, so! So, so, so! So, so, so!\" Then the door opened a little way, and a long beak put out, but in a very short time the beak was withdrawn again. Alice was just thinking of trying to find another way in, when the door suddenly flew open, and a large plate came skimming out, straight at her head; it just grazed her nose, and broke to pieces against one of the trees behind her.\n\n\"I'll get into the house, if I once put my head inside the door!\" said Alice to herself, and at last she found her way into a large kitchen, which was full of smoke from one end to the other: the Duchess was sitting on a three-legged stool in the middle, nursing a baby; the cook was leaning over the fire, stirring a large cauldron which seemed to be full of soup.\n\n\"There's certainly too much pepper in that soup!\" Alice said to herself, as well as she could for sneezing.\n\nThere was certainly too much of it in the air, however, for the Duchess sneezed now and then, and the baby seemed to be choking, and as for the cook, Alice could only see her through the smoke; but she looked as if she were made of wood, and was so black with soot, that Alice could hardly make her out at all.\n\nThe Duchess sang a sort of lullaby to the baby, and might, perhaps, have sung it to the end, if it had not been for the cook, who took the cauldron of soup off the fire, and began throwing everything within her reach at the Duchess and the baby—the fire-irons came first; then followed a shower of saucepans, plates, and dishes. The Duchess took no notice of them even when they hit her; and the baby was howling so much already, that it was quite impossible to say whether the blows hurt it or not.\n\n\"Oh, please mind what you're doing!\" cried Alice, jumping up and down in great agitation. \"Oh, there goes his precious nose!\" as an unusually large saucepan flew close by it, and very nearly carried it off.\n\nThe baby was howling so much, that Alice could hardly hear the words of the song; so she waited patiently for a pause, and then repeated it to herself:—\n\n\"Speak roughly to your little boy,\nAnd beat him when he sneezes:\nHe only does it to annoy,\nBecause he knows it teases.\"\n\n\"How savage!\" said Alice.\n\n\"Here! you may nurse it a bit, if you like!\" the Duchess said to Alice, flinging the baby at her as she spoke. \"I must go and get ready to play croquet with the Queen,\" she added, and hurried out of the room. The cook threw a frying-pan after her as she went, but it just missed her.\n\nAlice caught the baby with some difficulty, as it was a queer-shaped little creature, and held out its arms and legs in all directions, \"just like a star-fish,\" thought Alice. The poor little thing was snorting like a steam-engine when she caught it, and kept doubling itself up and straightening itself out again, all the while, so that it was as much as she could do to hold it.\n\nJust then her attention was called to a curious noise overhead, which sounded like a mouse squeaking: she listened in some alarm, but it was only the hot air blowing the lid off the tea-kettle, and the next moment she had forgotten all about it in her anxiety for the baby.\n\nIt was a very difficult subject to talk about, but she was so anxious to show that she had a temper of her own, that she began at last—\"If you're going to turn into a pig, my dear, I'll have nothing more to do with you. Mind now!\"\n\nBut the baby only grunted in reply, and Alice went on, \"Let's see—what is the first thing to be done? Oh, I know! We must look and see who the baby belongs to.\"\n\nSo she looked about for some time, but she could not find any one, and the baby only grunted again, so she walked away, still nursing it carefully, and wondering very much what was going to happen next.\n\n\"You won't make yourself a pig, and I'll take care of you,\" said Alice to it very earnestly. \"So don't grunt.\"\n\nBut the baby only grunted louder than before, and Alice began to be very much afraid that it really was going to turn into a pig, and she thought she must go and tell the Duchess. So she walked quickly back to the house, and knocked at the door.\n\nThe Duchess herself opened it, with a deep frown and a voice like a trombone. \"Take away that baby!\" she said. \"Do you hear? Take it away!\"\n\nAlice did her best to obey, and trotted off with the baby in her arms, as fast as she could go, and was just beginning to think of finding some place where she could set it down, when the creature began to kick and struggle so violently that she had to stop and look at it.\n\nIts face was getting rounder and rounder, and its eyes were growing smaller and smaller, and, as Alice gazed at it in silent wonder, she saw that it was changing into a pig. So she set it down very gently, and watched it trot away into the wood.\n\n\"If it had grown up,\" she said to herself, \"it would have made a dreadfully ugly child: but it makes rather a handsome pig, I think.\"\n\nAnd she went on, wondering what was going to happen next, when she suddenly came upon a large table, with a great many cards on it, and three little men were painting them, and singing as they worked.\n\nThe three men were all exactly like each other, and Alice was quite sure that they must be the three brothers who were engaged to the three sisters, and she began to be very much interested in what they were doing.\n\nThey were painting the roses on the cards red, and Alice asked them why they did that.\n\n\"You see, the Queen wanted white roses,\" they said, \"and we thought that red ones would please her better.\"\n\n\"How stupid!\" said Alice. \"Why didn't you think of that before?\"\n\n\"Because we were afraid of being punished,\" they said.\n\n\"Ah, that accounts for it,\" said Alice.\n\nJust then the Queen herself came up, and Alice thought she had never seen any one so angry in all her life.\n\n\"Who are these?\" she said, pointing to the three men.\n\n\"My name is Tweedledee, if you please, Ma'am,\" said the first one.\n\n\"My name is Tweedledum, if you please, Ma'am,\" said the second.\n\n\"My name is Tweedledee, if you please, Ma'am,\" said the third.\n\n\"Nonsense!\" said the Queen. \"You're all three alike!\"\n\n\"Please, Ma'am, I'm the eldest,\" said Tweedledee.\n\n\"Please, Ma'am, I'm the youngest,\" said Tweedledum.\n\n\"Please, Ma'am, I'm neither one nor t'other,\" said the third.\n\n\"Ah, that's it!\" said the Queen. \"Now, then, off with their heads!\"\n\nAlice was so much frightened at this, that she ran away as fast as she could, and never stopped till she found herself in quite a different part of the wood.\n\n\"Well, I never!\" she said to herself. \"I do think that of all the queer places I ever was in, this is the queerest. Things go on so oddly here, that I'm never quite sure what's going to happen next.\"\n\nShe was still thinking of the cards, and of the three little men, and of the Queen's terrible voice, when she suddenly caught sight of the White Rabbit again, trotting slowly along at some little distance before her. \"It's the best plan I can think of,\" she said to herself, \"to follow him. I dare say he'll lead me to the King and Queen, and then perhaps I shall find my way out of this wood.\"\n\nSo she followed him, and, after a time, they came to a great open place, where a large crowd was assembled, and in the middle of it was a large table, with the King and Queen of Hearts sitting at the top of it.\n\nAlice was rather doubtful whether she ought to join the crowd, but she was so anxious to find her way home, that she went up and placed herself quietly by the King.\n\nThere was a great dispute going on, but Alice could not understand what it was all about, for they were all talking at once, and the noise was so great that she could hardly hear herself speak. At last the King made a speech, and said that the Queen was to be tried for having ordered the three little men to be beheaded.\n\n\"Off with her head!\" said the Queen.\n\n\"Oh, no, no!\" said Alice, jumping up in great alarm. \"Oh, please, please, don't!\"\n\n\"Who are you talking to?\" said the King.\n\n\"Why, to the Queen, of course!\" said Alice.\n\n\"I never heard such nonsense in all my life!\" said the King. \"Who is this child?\"\n\n\"I'm Alice, please, your Majesty,\" said Alice, very politely.\n\n\"Well, then, just behave yourself!\" said the King.\n\n\"I do my best,\" said Alice, in a low voice.\n\n\"You don't look a bit like it,\" said the King. \"Why, you're not half so large as you ought to be.\"\n\nAlice was too much frightened to say a word, but she thought to herself, \"He's only a pack of cards, after all. I needn't be afraid of him.\"\n\nJust then the Queen began stamping about, and shouting, \"Off with her head! Off with her head!\" and the cards began throwing themselves at Alice, and fluttering down upon her face and hands, and she began fanning herself with all her might, and crying out, \"You sha'n't, you sha'n't!\" when she suddenly woke up, and found herself lying on the bank, with her head in the lap of her sister, who was gently brushing away some dead leaves that had fluttered down from the trees upon her face.\n\n\"Wake up, Alice dear!\" said her sister. \"Why, what a long sleep you've had!\"\n\n\"Oh, I've had such a curious dream!\" said Alice.\n\nAnd she told her sister, as well as she could remember them, all these strange adventures of hers that you have just been reading about."}, {"title": "CHAPTER II. The Pool of Tears", "body": "\"Curiouser and curiouser!\" cried Alice (she was so much surprised, that for the moment she quite forgot how to speak good English). \"Now I'm opening out like the largest telescope that ever was! Good-bye, feet!\" (for when she looked down at her feet, they seemed to be almost out of sight, they were getting so far off). \"Oh, my poor little feet, I wonder who will put on your shoes and stockings for you now, dears? I'm sure I sha'n't be able! I shall be a great deal too far off to trouble myself about you: you must manage the best way you can—but I must be kind to them,\" thought Alice, \"or perhaps they won't walk the way I want to go! Let me see. I'll give them a new pair of boots every Christmas.\"\n\nAnd she went on planning to herself how she would manage it. \"They must go by the carrier,\" she thought; \"and how funny it'll seem, sending presents to one's own feet! And how odd the directions will look!\n\nAlice's Right Foot, Esq.\n Hearthrug,\n near the Fender,\n (with Alice's love).\n\nOh dear, what nonsense I'm talking!\"\n\nJust then her head struck against the roof of the hall: in fact she was now rather more than nine feet high, and she at once took up the little golden key and hurried off to the garden door.\n\nPoor Alice! It was as much as she could do, when she got to the door, to peep in at it with one eye, but to get through was more hopeless than ever: she sat down and began to cry again.\n\n\"You ought to be ashamed of yourself,\" said Alice, \"a great girl like you,\" (she might well say this), \"to go on crying in this way! Stop this moment, I tell you!\"\n\nBut she went on all the same, shedding gallons of tears, until there was a large pool all round her, about four inches deep, and reaching half down the hall.\n\nAfter a time she heard a little pattering of footsteps in the distance, and she hastily dried her eyes to see what was coming. It was the White Rabbit returning, splendidly dressed, with a pair of white kid gloves in one hand and a large fan in the other: he came trotting along in a great hurry, muttering to himself as he came, \"Oh! the Duchess, the Duchess! Oh! won't she be savage if I've kept her waiting!\" Alice felt so desperate that she was ready to ask help of any one; so, when the Rabbit came near her, she began, in a low, timid voice, \"If you please, Sir—\" The Rabbit started violently, dropped the white kid gloves and the fan, and skurried away into the darkness as hard as he could go.\n\nAlice took up the fan and gloves, and, as the hall was very hot, she kept fanning herself all the time she went on talking: \"Dear, dear! How queer everything is to-day! And yesterday things went on just as usual. I wonder if I've been changed in the night? Let me think: was I the same when I got up this morning? I almost think I can remember feeling a little different. But if I'm not the same, the next question is, Who in the world am I? Ah, that's the great puzzle!\" And she began thinking over all the children she knew that were of the same age as herself, to see if she could have been changed for any of them.\n\n\"I'm sure I'm not Ada,\" she said, \"for her hair goes in such long ringlets, and mine doesn't go in ringlets at all; and I'm sure I can't be Mabel, for I know all sorts of things, and she, oh! she knows such a very little! Besides, she's she, and I'm I, and—oh dear, how puzzling it all is! I'll try if I know who I am, then. I will! I'm sure I'm not Mabel.\"\n\nShe was so busy, while she said all this, in trying to make out her difficult problem, that she did not notice the pool of tears, and when she came to the edge of it she flopped into it, and her first idea, as she floundered about in the water, was that she must have fallen into the sea, \"and in that case,\" she said to herself, \"I can go back by railway,\" she was thinking to herself. \"What a pity it wouldn't stay! I never saw such a thing in all my life!\"\n\n\"You know,\" the Mock Turtle went on at last, \"you never yet told me how old you were.\"\n\n\"I—I don't know,\" said Alice. \"I'm only this morning, you know.\"\n\n\"Only this morning!\" cried the Mock Turtle. \"What a ridiculous thing to say! I never heard anything so absurd in all my life.\"\n\n\"I amn't saying it for fun,\" said Alice. \"I really am only this morning.\"\n\n\"Well, I never!\" said the Mock Turtle. \"I never heard such nonsense in all my life. Only this morning, indeed! And pray how old were you last night?\"\n\n\"Well, I don't know exactly,\" said Alice, \"but I was a good deal younger then than I am now.\"\n\n\"I should think so,\" said the Mock Turtle. \"I should think you were.\"\n\n\"But then,\" said Alice, \"I shan't be any older to-morrow, you know.\"\n\n\"No, to be sure you won't,\" said the Mock Turtle.\n\n\"And I shan't be any younger,\" said Alice.\n\n\"No, of course you won't,\" said the Mock Turtle. \"Well, that's a comfort, at any rate.\"\n\n\"It is, indeed,\" said Alice. \"Thank you very much.\"\n\n\"You're welcome,\" said the Mock Turtle. \"I'm very glad I happened to think of it.\"\n\nSo they sat silent for some time, and then the Mock Turtle said, \"Do you know what a whiting is?\"\n\n\"Oh, yes,\" said Alice. \"I've often seen them. They're a kind of fish, you know.\"\n\n\"I don't know,\" said the Mock Turtle.\n\n\"Of course you do,\" said Alice. \"Every one knows that a whiting is a fish.\"\n\n\"Well, it's a useful kind of fish, at any rate,\" said the Mock Turtle. \"You can use it to make whiting-pie.\"\n\n\"I never heard of such a thing,\" said Alice.\n\n\"Oh, you'll hear of it often enough, my dear,\" said the Gryphon, \"if you live long enough. But, however, now we've talked enough about whiting, and I'm sure you'll excuse us.\"\n\n\"Certainly,\" said Alice.\n\n\"Let us get on, then,\" said the Gryphon.\n\nSo they swam back again, and the Mock Turtle went on: \"You see, the reason they're called lessons,\" said the Mock Turtle, \"is that they lessen from day to day.\"\n\n\"Oh, I see,\" said Alice.\n\n\"Lessen, you know,\" said the Mock Turtle.\n\n\"Oh, I see,\" said Alice.\n\n\"So that's why,\" said the Mock Turtle.\n\n\"I see,\" said Alice. \"Thank you.\"\n\n\"Reeling and Writhing, of course, to begin with,\" the Mock Turtle replied; \"and then the different branches of Arithmetic—Ambition, Distraction, Uglification, and Derision.\"\n\n\"I never heard of 'Uglification,'\" Alice ventured to say. \"What is it?\"\n\nThe Gryphon lifted up both its paws in surprise. \"What! Never heard of uglifying things!\" it exclaimed. \"You know what to beautify is, I suppose?\"\n\n\"Yes,\" said Alice, doubtfully. \"It means—to—make—anything—prettier.\"\n\n\"Well, then,\" the Gryphon went on, \"if you don't know what to uglify is, you are a simpleton.\"\n\nAlice did not feel comfortable, and, in the hope of making some amends, she went on: \"And how many hours a day did you do lessons?\"\n\n\"Ten hours the first day,\" said the Mock Turtle, \"nine the next, and so on.\"\n\n\"What a curious plan!\" said Alice.\n\n\"That's the reason they're called lessons,\" said the Mock Turtle, \"because they lessen from day to day.\"\n\n\"Then the eleventh day must have been a holiday?\" said Alice.\n\n\"Of course it was,\" said the Mock Turtle.\n\n\"And how did you manage on the twelfth?\" Alice went on.\n\n\"That would have been one too many,\" said the Gryphon, \"so they put off the lesson for that day, and the master gave us a double one the day after.\"\n\n\"I never heard of such a thing,\" said Alice.\n\n\"No, I dare say not,\" said the Gryphon. \"But then, you see, we had a very good master.\"\n\n\"Was he a good one?\" said Alice.\n\n\"Oh, very good indeed,\" said the Mock Turtle. \"He taught us such a lot of things—Reading, Writing, and Arithmetic.\"\n\n\"I only took the regular course,\" said the Mock Turtle.\n\n\"What was that?\" said Alice.\n\n\"Reeling and Writhing, of course, to begin with,\" the Mock Turtle replied; \"and then the different branches of Arithmetic—Ambition, Distraction, Uglification, and Derision.\"\n\n\"Well,\" said Alice, \"the lessons were very long, but then the holidays were so short.\"\n\n\"You may say that,\" said the Gryphon.\n\n\"I only took the regular course,\" said the Mock Turtle.\n\n\"So I did,\" said Alice.\n\n\"So I did,\" said the Gryphon.\n\n\"So I did,\" said the Mock Turtle.\n\n\"So I did,\" said the Gryphon.\n\n\"So I did,\" said the Mock Turtle.\n\n\"So I did,\" said the Gryphon.\n\n\"So I did,\" said the Mock Turtle.\n\n\"So I did,\" said the Gryphon.\n\n\"So I did,\" said the Mock Turtle.\n\n\"I think you'd better leave off now,\" said Alice.\n\n\"Well, I don't know,\" said the Gryphon. \"But, however, now we've talked enough about lessons, I'm sure you'll excuse us.\"\n\n\"Certainly,\" said Alice.\n\n\"Let us get on, then,\" said the Gryphon.\n\nSo they swam back again, and the Mock Turtle went on:—\n\n\"Oh, 'tis love, 'tis love, that makes the world go round!\"\n\n\"Do you think it does?\" said Alice.\n\n\"Why, yes,\" said the Mock Turtle. \"Don't you?\"\n\n\"I don't know,\" said Alice. \"It's all so very confusing.\"\n\n\"Confusing!\" said the Mock Turtle. \"Why, you don't mean to say you don't understand it?\"\n\n\"No, I don't,\" said Alice.\n\n\"Then it's high time you did,\" said the Gryphon. \"Now, don't talk any more, but come along with us.\"\n\nSo they went on swimming, and presently they came to a great crowd of birds and beasts, all talking together, and making a great noise.\n\n\"What is it all about?\" said Alice.\n\n\"It's a trial,\" said the Gryphon.\n\n\"Whose trial?\" said Alice.\n\n\"Why, the Knave's, to be sure,\" said the Gryphon.\n\n\"Of what is he accused?\" said Alice.\n\n\"Of stealing the tarts,\" said the Gryphon.\n\n\"Who are all these?\" said Alice, pointing to the crowd.\n\n\"Why, they're the jurors, and the witnesses, and the officers of the court,\" said the Gryphon. \"And that's the King, and that's the Queen, and those are the tarts.\"\n\n\"And who are you?\" said Alice.\n\n\"I'm the Gryphon, of course,\" said the Gryphon.\n\n\"Oh, yes,\" said Alice. \"Of course you are.\"\n\n\"And I'm the Mock Turtle,\" said the Mock Turtle.\n\n\"Oh, yes,\" said Alice. \"I remember you now.\"\n\n\"And we're all here,\" said the Gryphon, \"to see the trial, and to give our evidence.\"\n\n\"Oh, I see,\" said Alice. \"I should like very much to hear it.\"\n\n\"Come along, then,\" said the Gryphon.\n\nSo they went into the court, and Alice found herself in a great hall, with a sort of throne at one end, and a table in the middle, and a great many birds and beasts sitting round it.\n\n\"Who are all these?\" said Alice.\n\n\"Why, they're the jurors,\" said the Gryphon, \"and they're to decide whether the Knave is guilty or not.\"\n\n\"And who is the judge?\" said Alice.\n\n\"Why, the King, of course,\" said the Gryphon.\n\n\"Oh, I see,\" said Alice. \"I should like very much to hear the trial.\"\n\n\"Come along, then,\" said the Gryphon.\n\nSo they went up to the throne, and Alice found herself standing by the King and Queen.\n\n\"Silence in the court!\" cried the White Rabbit, and stood up and read from a large piece of paper:—\n\n\"The Queen of Hearts, she made some tarts,\nAll on a summer day:\nThe Knave of Hearts, he stole those tarts,\nAnd took them quite away!\"\n\n\"Now, gentlemen of the jury,\" said the King, \"you have heard the indictment, and you are to consider your verdict.\"\n\n\"Not yet, not yet!\" said the Rabbit, hastily. \"There's a great deal to come before that!\"\n\n\"Call the first witness,\" said the King.\n\nThe first witness was the Hatter. He came in with a teacup in one hand and a piece of bread-and-butter in the other. \"I beg pardon, your Majesty,\" he began, \"for bringing these in: but I hadn't quite finished my tea when I was sent for.\"\n\n\"You ought to have finished it,\" said the King. \"When did you begin?\"\n\nThe Hatter looked at the March Hare, who had followed him into the court, arm-in-arm with the Dormouse. \"Fourteenth of March, I think it was,\" he said.\n\n\"Fifteenth,\" said the March Hare.\n\n\"Sixteenth,\" added the Dormouse.\n\n\"Write that down,\" the King said to the jury, and the jury all took up their slates, and began writing it down in a great hurry.\n\n\"Take off your hat,\" the King said to the Hatter.\n\n\"It isn't mine,\" said the Hatter.\n\n\"Stolen!\" cried the King, turning to the jury, who instantly made a memorandum of the fact.\n\n\"I keep them to sell,\" the Hatter added. \"I've none of my own. I'm a hatter.\"\n\n\"Give your evidence,\" said the King, \"and don't be afraid.\"\n\n\"I'm not afraid,\" said the Hatter.\n\n\"Then don't waste any more of the court's time,\" said the King, \"or I'll have you executed on the spot.\"\n\nThis did not seem to encourage the witness at all: he kept shifting from one foot to the other, looking anxiously at the Queen, and, in his confusion, he bit a large piece out of his teacup instead of the bread-and-butter.\n\nJust at this moment Alice felt a very curious sensation, which puzzled her a good deal until she made out what it was: she was beginning to grow larger again.\n\n\"Give your evidence,\" said the King, \"or I'll have you executed, whether you're afraid or not.\"\n\n\"I'm a poor man, your Majesty,\" the Hatter began, in a trembling voice, \"—and I hadn't begun my tea—and—and I'd hardly drunk any of it—and what principally troubles me is, that I'm a poor man—\"\n\n\"You're a very poor speaker,\" said the King. \"If that's all you know about it, you may go.\"\n\n\"I'd rather finish my tea,\" said the Hatter.\n\n\"You may go,\" said the King.\n\nThe Hatter left the court, without even waiting to put on his shoes again.\n\n\"Call the next witness!\" said the King.\n\nThe next witness was the Duchess's cook. She came in with a peppermill in her hand, and the moment she entered, the whole court began sneezing in chorus.\n\n\"Give your evidence,\" said the King.\n\n\"Sha'n't,\" said the cook.\n\nThe King looked anxiously at the White Rabbit, and the Rabbit whispered, \"Your Majesty must cross-examine this witness.\"\n\n\"Well, if I must, I must,\" the King said, with a melancholy air, and, after folding his arms and frowning at the cook till his eyes were nearly out of sight, he said, in a deep voice, \"What are tarts made of?\"\n\n\"Pepper, mostly,\" said the cook.\n\n\"Treacle,\" said a sleepy voice behind her.\n\n\"Collar that Dormouse!\" the Queen shrieked. \"Behead that Dormouse! Turn that Dormouse out of court! Suppress him! Pinch him! Off with his whiskers!\"\n\nFor some minutes the whole court was in confusion, and by the time they had settled down again, the cook had disappeared.\n\n\"Never mind!\" said the King, with an air of great relief. \"Call the next witness.\"\n\nThe next witness was Alice.\n\n\"Give your evidence,\" said the King.\n\n\"I don't know anything about it, your Majesty,\" said Alice.\n\n\"Nothing whatever?\" said the King.\n\n\"Nothing whatever,\" said Alice.\n\n\"That's very important,\" the King said, turning to the jury.\n\n\"Unimportant, your Majesty means, of course,\" said the White Rabbit.\n\n\"Of course I do,\" said the King hastily. \"Unimportant, I mean, of course.\"\n\nThe jury all wrote down, on their slates, \"Important and unimportant,\" but some of them afterwards rubbed it out again.\n\n\"Silence!\" cried the Rabbit, and, taking a paper out of his pocket, he read out, \"Rule Forty-two. All persons more than a mile high to leave the court.\"\n\n\"I'm not a mile high,\" said Alice.\n\n\"Nearly two miles high,\" said the Queen.\n\n\"Well, I sha'n't go,\" said Alice.\n\n\"You'll have to go,\" said the King, \"for I'm the judge here.\"\n\n\"I don't care,\" said Alice.\n\nThe King's face grew very red, and he said, in a low, trembling voice, \"Consider your verdict.\"\n\n\"There's more evidence to come yet, please your Majesty,\" said the Rabbit, \"this paper has just been picked up.\"\n\n\"What's in it?\" said the King.\n\n\"I haven't opened it yet,\" said the Rabbit, \"but it seems to be a letter, written by the prisoner to—to somebody.\"\n\n\"Who is it directed to?\" said the King.\n\n\"It isn't directed at all,\" said the Rabbit. \"In fact, there's nothing written on the outside. It's only a set of verses.\"\n\n\"If it was directed to nobody at all, of course it must have been meant for the King,\" said the King. \"It's a confession. Read it.\"\n\n\"It doesn't seem to have anything to do with the case,\" said the Rabbit.\n\n\"Read it!\" said the King.\n\nThe Rabbit read out:—\n\n\"They told me you had been to her,\nAnd mentioned me to him:\nShe gave me a good character,\nBut said I could not swim.\"\n\n\"Never mind what it doesn't seem to have to do with the case,\" said the King, \"that's the way they all confess, and they must all be punished.\"\n\n\"But it hasn't a signature,\" said the Rabbit.\n\n\"If it hadn't a signature,\" said the King, \"it would be a great deal better for the prisoner, for then it wouldn't be evidence at all, you know.\"\n\nThe jury all looked puzzled.\n\n\"If any one of them can explain it,\" said Alice, \"I'll give him all the tea in China!\"\n\n\"Silence!\" cried the King. \"The jury must consider their verdict.\"\n\n\"We don't want to consider our verdict yet,\" said the jury, \"for we haven't made up our minds.\"\n\n\"Stuff and nonsense!\" said the King. \"The jury must consider their verdict now.\"\n\n\"Nonsense!\" said Alice, in a loud voice.\n\n\"Hold your tongue!\" said the King, turning to Alice.\n\n\"I won't!\" said Alice.\n\n\"Off with her head!\" said the Queen.\n\n\"Who cares for you?\" said Alice. \"You're nothing but a pack of cards!\"\n\nAt this the whole pack rose up into the air, and came flying down upon her; she gave a little scream, half of fright and half of anger, and tried to beat them off, and found herself lying on the bank, with her head in the lap of her sister, who was gently brushing away some dead leaves that had fluttered down from the trees upon her face.\n\n\"Wake up, Alice dear!\" said her sister. \"Why, what a long sleep you've had!\"\n\n\"Oh, I've had such a curious dream!\" said Alice. \"And oh, how I wish I could see those curious creatures again! I do so want to know what happens to them all!\"\n\n\"You can't help that,\" said her sister. \"We live in a more prosaic age.\"\n\n\"I don't care for that,\" said Alice. \"I'm sure there are just as many curious things now as there ever were.\"\n\n\"Perhaps there are,\" said her sister. \"But you must learn to attend to your lessons, and not dream so much.\"\n\n\"Oh, I will!\" said Alice, very humbly. \"I'll try not to dream so much.\"\n\nAnd she got up and ran off to tell her adventures to any one who would listen to her. And I only hope you will be as much pleased with them as she was.\n\nTHE END."}]}, {"id": "lookingglass", "title": "爱丽丝镜中奇遇", "author": "Lewis Carroll", "cover": "lookingglass", "category": "童话", "lang": "en", "note": "节选", "chapters": [{"title": "CHAPTER I. Looking-Glass House", "body": "One thing was certain, that the white kitten had had nothing to do with it:—it was the black kitten's fault entirely. For the white kitten had been having its face washed by the old cat for the last quarter of an hour (and bearing it pretty well, considering); so you see that it couldn't have had any hand in the mischief.\n\nThe way Dinah washed her children's faces was this: first she held the poor thing down by its ear with one paw, and then with the other paw she rubbed its face all over, the wrong way, beginning at the nose: and just now, as I said, she was hard at work on the white kitten, which was lying quite still and trying to purr—no doubt feeling that it was all meant for its good.\n\nBut the black kitten had been finished with earlier in the afternoon, and so while Alice was sitting curled up in a corner of the great arm-chair, half to herself and half to the kitten (for the kitten was the only thing in the room at all interested in her remarks), she went on talking:—\n\n\"Dogs say cats are mad. It's dogs that are mad, and cats that are sane. Dogs bark and jump and run about. Cats sit still and purr. So dogs are mad.\"\n\nThe kitten only purred louder.\n\n\"Now, Kitty, let's consider who it was that did it. That's the first point, you know, to settle which of us did it. Do you remember how angry you were at the bonfire last night? And it was such a little one, too! And what did you say to me? And how cross you were, and you wouldn't let me go to sleep! And oh, dear, dear! And I'd nearly forgotten the great lesson we had that day! You remember, Kitty, we had such a long talk about what the fire was for. We agreed it was to keep us warm, and to make the kettle boil, and to toast muffins. And then you asked me what else it was for, and I couldn't think of anything else. So I said, 'Well, it's to look at.' And you said that was nonsense, and you wouldn't look at it any more. And then—oh, Kitty, can you remember anything more about it? We had such a long talk, and I was so tired, and you were so sleepy, that I'm sure we both went to sleep before we had finished. But I remember one thing: I said that fire was like a wild beast, and you said it was like a baby. And we never settled which of us was right.\"\n\nThe kitten yawned.\n\n\"I'm sure it was like a wild beast,\" Alice went on, \"for it made such a noise, and such a crackling, and it wanted to eat up everything. And I was so frightened! And then it went out, and I was sorry. But I'm sure it was like a wild beast, Kitty, and you needn't pretend to yawn, for you know it was.\"\n\nThe kitten stretched itself out, and began to wash it <script>
// ===== Constants & State =====
const THEMES = [
  {id:'light', name:'日间', bg:'#f5f0e8'},
  {id:'dark', name:'夜间', bg:'#1a1a1a'},
  {id:'eye', name:'护眼', bg:'#c8e6c0'},
  {id:'forest', name:'森林', bg:'#eef3ec'},
  {id:'ocean', name:'海洋', bg:'#e8f0f5'},
  {id:'eink', name:'水墨', bg:'#e0e2d7'},
];
const FONTS = [
  {id:'serif', name:'衬线', css:'var(--font-serif)'},
  {id:'sans', name:'黑体', css:'var(--font-sans)'},
  {id:'mono', name:'等宽', css:'var(--font-mono)'},
];

const state = {
  currentBook: null,
  currentChapter: 0,
  books: [],
  settings: {
    theme: 'light',
    followSystem: false,
    fontSize: 18,
    lineHeight: 1.9,
    letterSpacing: 0.02,
    contentWidth: 680,
    fontFamily: 'serif',
    mode: 'scroll',
    animType: 'slide',
    pageShadow: true,
    pdfTextMode: false,
    warmLight: 0,

  },

  shelfQuery: '',

};

// Load from localStorage
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('reader_state_v2') || '{}');
    Object.assign(state, s);
    const set = JSON.parse(localStorage.getItem('reader_settings_v2') || '{}');
    Object.assign(state.settings, set);
    state.progress = JSON.parse(localStorage.getItem('reader_progress_v2') || '{}');
    state.bookmarks = JSON.parse(localStorage.getItem('reader_bookmarks_v2') || '{}');
    state.highlights = JSON.parse(localStorage.getItem('reader_highlights_v2') || '{}');
    state.notes = JSON.parse(localStorage.getItem('reader_notes_v2') || '{}');
    state.stats = JSON.parse(localStorage.getItem('reader_stats_v2') || '{}');
    if (!state.stats.readDates) state.stats.readDates = {};
    if (!state.stats.dailyMinutes) state.stats.dailyMinutes = {};
  } catch(e) { console.warn('loadState error', e); }
}
function saveState() {
  try {
    localStorage.setItem('reader_settings_v2', JSON.stringify(state.settings));
    localStorage.setItem('reader_progress_v2', JSON.stringify(state.progress));
    localStorage.setItem('reader_bookmarks_v2', JSON.stringify(state.bookmarks));
    localStorage.setItem('reader_highlights_v2', JSON.stringify(state.highlights));
    localStorage.setItem('reader_notes_v2', JSON.stringify(state.notes));
    localStorage.setItem('reader_stats_v2', JSON.stringify(state.stats));
  } catch(e) { console.warn('saveState error', e); }
}

// Initialize books: built-in + imported
function initBooks() {
  try {
    state.books = [];
    const imported = JSON.parse(localStorage.getItem('reader_imported_books_v2') || '[]');
    const builtin = window.__BUILTIN_BOOKS__ || [];
    // Mark imported
    builtin.forEach(b => { b.imported = false; });
    imported.forEach(b => { b.imported = true; });
    state.books = [...builtin, ...imported];
  } catch(e) {
    console.error('initBooks error:', e);
    // Fallback to builtin books only
    state.books = (window.__BUILTIN_BOOKS__ || []).map(b => ({...b, imported: false}));
  }
}

// Toast
function toast(msg, type='', duration=2200) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type?' '+type:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, duration);
}

// Get cover gradient class
function coverClass(book) {
  if (book.imported) return 'cover-imported';
  return 'cover-' + (book.cover || 'imported');
}

// Get progress for a book
function getProgress(bookId) {
  return state.progress[bookId] || { chapter:0, percent:0, scrollY:0, cfi:0 };
}
function setProgress(bookId, data) {
  state.progress[bookId] = Object.assign(getProgress(bookId), data);
  saveState();
}

// Book cover SVG/HTML
function bookCoverHTML(book) {
  const cls = coverClass(book);
  const cat = normalizeCategory(book.category || guessCategory(book));
  const meta = getCategoryMeta(cat);
  const catLabel = meta.icon + ' ' + cat;
  return `<div class="book-cover ${cls}">
    <div class="cover-top">E-BOOK</div>
    <div class="cover-tag">${escapeHtml(catLabel)}</div>
    <div class="cover-title">${escapeHtml(book.title)}</div>
    <div class="cover-author">${escapeHtml(book.author || '佚名')}</div>
  </div>`;
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===== Categories =====
const CATEGORY_META = {
  '经典': { icon: '📖', color: '#8b6f47' },
  '童话': { icon: '🧚', color: '#c0609f' },
  '恐怖': { icon: '🧛', color: '#8b2f2f' },
  '小说': { icon: '📕', color: '#c0504d' },
  '科幻': { icon: '🚀', color: '#3d6b9a' },
  '悬疑': { icon: '🕵️', color: '#5a4a8a' },
  '历史': { icon: '🏛️', color: '#8a6a3f' },
  '哲学': { icon: '🤔', color: '#5a6b52' },
  '散文': { icon: '🌿', color: '#4a7c3f' },
  '诗歌': { icon: '🎶', color: '#9f6fcf' },
  '传记': { icon: '👤', color: '#6b6b6b' },
  '武侠': { icon: '⚔️', color: '#3d6b4f' },
  '玄幻': { icon: '🔮', color: '#6a4f9f' },
  '言情': { icon: '💕', color: '#d0608a' },
  '教育': { icon: '🎓', color: '#4a7c8a' },
  '技术': { icon: '💻', color: '#3d5f8a' },
  '其他': { icon: '📂', color: '#7a7a7a' }
};

function guessCategory(book) {
  if (book.category) return book.category;
  // Document-type imports without clear literary cues → 技术 or 其他
  if (book.format && ['pptx','ppt','docx','doc','xlsx','xls','xlsm','odt','odp','ods','rtf','csv','tsv'].includes(book.format)) {
    const t = ((book.title || '') + ' ' + (book.author || '')).toLowerCase();
    if (/(报告|报告|report|论文|thesis|调研|数据|分析|统计)/.test(t)) return '技术';
    return '技术';
  }
  const text = ((book.title || '') + ' ' + (book.author || '') + ' ' + (book.note || '')).toLowerCase();
  if (/(童话|奇遇|梦游|仙境|fairy|wonderland|alice)/.test(text)) return '童话';
  if (/(恐怖|惊悚|灵异|鬼|horror|dracula|vampire)/.test(text)) return '恐怖';
  if (/(科幻|sci-fi|space|robot|宇宙|未来)/.test(text)) return '科幻';
  if (/(悬疑|推理|侦探|mystery|thriller|sherlock)/.test(text)) return '悬疑';
  if (/(诗|poem|poetry|唐诗|宋词|诗经|楚辞)/.test(text)) return '诗歌';
  if (/(哲学|道德经|论语|庄子|尼采|康德|philosophy)/.test(text)) return '哲学';
  if (/(散文|随笔|essay|小品)/.test(text)) return '散文';
  if (/(传记|自传|biography|回忆录|列传)/.test(text)) return '传记';
  if (/(武侠|江湖|剑客|martial)/.test(text)) return '武侠';
  if (/(玄幻|仙侠|修仙|magic|fantasy|奇幻)/.test(text)) return '玄幻';
  if (/(言情|爱情|romance|love|婚恋)/.test(text)) return '言情';
  if (/(教育|教材|学习|教程|guide|课本)/.test(text)) return '教育';
  if (/(编程|代码|算法|技术|前端|后端|programming|javascript|python|手册)/.test(text)) return '技术';
  if (/(历史|史|宋|明|清|三国|战国|春秋|五代|史记|history)/.test(text)) return '历史';
  if (/(唐|朝代|帝王|王朝)/.test(text)) return '历史';
  return '经典';
}

function normalizeCategory(cat) {
  return CATEGORY_META[cat] ? cat : '其他';
}

function getCategoryMeta(cat) {
  return CATEGORY_META[normalizeCategory(cat)];
}

// Collect categories from current books
function collectCategories(books) {
  const map = new Map();
  books.forEach(b => {
    const cat = normalizeCategory(b.category || guessCategory(b));
    if (!map.has(cat)) map.set(cat, { name: cat, count: 0 });
    map.get(cat).count++;
  });
  return Array.from(map.values()).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}

function bookMatchesQuery(book, q) {
  if (!q) return true;
  const hay = (book.title + ' ' + (book.author || '') + ' ' + (book.note || '') + ' ' + (book.category || '')).toLowerCase();
  return hay.indexOf(q) !== -1;
}

// Render bookshelf with search + category filter
function renderBookshelf() {

  const emptyEl = document.getElementById('shelfEmpty');
  const resultInfo = document.getElementById('shelfResultInfo');
  builtinGrid.innerHTML = '';
  importedGrid.innerHTML = '';
  resultInfo.textContent = '';

  const q = (state.shelfQuery || '').trim().toLowerCase();
  const catFilter = state.shelfCategory || '全部';
  const isFiltering = q || catFilter !== '全部';

  const builtinAll = state.books.filter(b => !b.imported);
  const importedAll = state.books.filter(b => b.imported);

  const builtin = builtinAll.filter(b => (catFilter === '全部' || normalizeCategory(b.category) === catFilter) && bookMatchesQuery(b, q));
  const imported = importedAll.filter(b => (catFilter === '全部' || normalizeCategory(b.category) === catFilter) && bookMatchesQuery(b, q));

  builtin.forEach(book => builtinGrid.appendChild(bookCard(book)));

  if (imported.length) {
    importedSection.style.display = '';
    importedGrid.style.display = '';
    imported.forEach(book => importedGrid.appendChild(bookCard(book)));
  } else {
    importedSection.style.display = 'none';
    importedGrid.style.display = 'none';
  }

  builtinSection.style.display = builtin.length ? '' : 'none';

  // Apply shelf view
  const listMode = state.settings.shelfView === 'list';
  builtinGrid.className = 'book-grid' + (listMode ? ' list-view' : '');
  importedGrid.className = 'book-grid' + (listMode ? ' list-view' : '');

  const totalBooks = state.books.length;
  const totalChapters = state.books.reduce((s,b) => s + (b.chapters && b.chapters.length ? b.chapters.length : (b.chapterCount || 0)), 0);
  const subtitle = document.getElementById('bookshelfSubtitle');
  if (isFiltering) {
    const shown = builtin.length + imported.length;
    subtitle.textContent = `找到 ${shown} 本相关书籍`;
    resultInfo.textContent = `共 ${totalBooks} 本 · 当前显示「${catFilter === '全部' ? '全部分类' : catFilter}${q ? ' + 关键词「' + q + '」' : ''}」`;
  } else {
    subtitle.textContent = `${totalBooks} 本书 · ${totalChapters} 章 · 轻触封面开始阅读`;
  }

  // Empty state
  if ((builtin.length === 0 && imported.length === 0) || totalBooks === 0) {
    emptyEl.style.display = '';

    emptyEl.style.display = 'none';

  renderCategoryBar();
}

function bookCard(book) {

function deleteImportedBook(book) {
  if (!confirm('删除《' + book.title + '》？本机保存的正文、阅读进度、笔记都会一起移除。')) return;
  try {
    const imported = JSON.parse(localStorage.getItem('reader_imported_books_v2') || '[]')
      .filter(b => b.id !== book.id);
    localStorage.setItem('reader_imported_books_v2', JSON.stringify(imported));
  } catch (e) { console.warn('删除时写 localStorage 失败', e); }
  idbDeleteBook(book.id);
  // 删书时把内存里的 PDF 文档也放掉，不然 20MB 的扫描书会一直占着内存
  if (mupdfDocCache[book.id]) {
    try { if (mupdfDocCache[book.id].destroy) mupdfDocCache[book.id].destroy(); } catch (e) { }
    delete mupdfDocCache[book.id];
  }
  if (pdfDocCache[book.id]) {
    try { if (pdfDocCache[book.id].destroy) pdfDocCache[book.id].destroy(); } catch (e) { }
    delete pdfDocCache[book.id];
  }
  delete state.progress[book.id];
  delete state.bookmarks[book.id];
  delete state.highlights[book.id];
  delete state.notes[book.id];
  Object.keys(state.progress).forEach(k => { if (k.indexOf(book.id + '_ch_') === 0) delete state.progress[k]; });
  if (state.currentBook && state.currentBook.id === book.id) { state.currentBook = null; switchView('bookshelf'); }
  saveState();
  initBooks();
  renderBookshelf();
  toast('已删除《' + book.title + '》', 'success');
}

// ---- 内置大书按需加载 ----
const lazyLoading = {};
const lazyStyle = '@keyframes lrspin{to{transform:rotate(360deg)}}@keyframes lrfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}';
function ensureLazyStyle() {
  if (document.getElementById('lazyStyle')) return;
  const st = document.createElement('style');
  st.id = 'lazyStyle';
  st.textContent = lazyStyle;
  document.head.appendChild(st);
}
function showLazyHint(name) {
  ensureLazyStyle();
  let mask = document.getElementById('lazyHintMask');
  if (!mask) {
    mask = document.createElement('div');
    mask.id = 'lazyHintMask';
    mask.style.cssText = 'position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(2px);color:#fff;animation:lrfade .25s ease';
    mask.innerHTML = '<div id="lazyHintSpin" style="width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#e0b072;border-radius:50%;animation:lrspin 1s linear infinite"></div>' +
      '<div id="lazyHintTitle" style="font-size:16px;font-weight:600;letter-spacing:.5px"></div>' +
      '<div style="font-size:12px;opacity:.65">首次打开需下载该书内容，之后会缓存在本机</div>';
    document.body.appendChild(mask);
  }
  document.getElementById('lazyHintTitle').textContent = name ? ('正在加载《' + name + '》…') : '正在加载…';
  mask.style.display = 'flex';
}
function hideLazyHint() {
  const mask = document.getElementById('lazyHintMask');
  if (mask) mask.style.display = 'none';
}
function loadLazyBook(book) {
  const cache = (window.__LAZY_BOOKS__ || {})[book.id];
  if (cache && cache.chapters && cache.chapters.length) {
    book.chapters = cache.chapters;
    book.lazy = false;
    return Promise.resolve(book);
  }
  if (lazyLoading[book.id]) return lazyLoading[book.id];
  showLazyHint(book.title);
  lazyLoading[book.id] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = book.src || ('books/' + book.id + '.js');
    s.onload = () => {
      const d = (window.__LAZY_BOOKS__ || {})[book.id];
      hideLazyHint();
      if (!d || !d.chapters || !d.chapters.length) {
        toast('《' + book.title + '》内容加载失败，请确认 books/ 目录与 reader.html 在同一层级', 'error', 3600);
        reject(new Error('empty'));
        return;
      }
      book.chapters = d.chapters;
      book.lazy = false;
      resolve(book);
    };
    s.onerror = () => {
      hideLazyHint();
      delete lazyLoading[book.id];
      toast('《' + book.title + '》的正文未随页面提供，请从仓库下载 books/ 目录后重试', 'error', 4000);
      reject(new Error('load fail'));
    };
    document.head.appendChild(s);
  });
  return lazyLoading[book.id];
}

// Open a book
function openBook(book) {
  if (book.lazy && !(book.chapters && book.chapters.length)) {
    loadLazyBook(book).then(() => openBookNow(book)).catch(() => {});
    return;
  }
  // 正文存在 IndexedDB 里：打开时再取
  if (book.storedIn === 'idb' && !(book.chapters && book.chapters.length)) {
    loadIdbBook(book).then(() => openBookNow(book))
      .catch(err => toast('《' + book.title + '》打不开：' + (err && err.message ? err.message : '读取失败'), 'error', 4200));
    return;
  }
  openBookNow(book);
}

function openBookNow(book) {
  state.currentBook = book;
  const prog = getProgress(book.id);
  state.currentChapter = prog.chapter || 0;
  if (state.currentChapter >= book.chapters.length) state.currentChapter = 0;
  
  switchView('reader');
  showTopbar();
  applySettings();
  renderChapter(state.currentChapter, true);
  recordRead();
}

function switchView(view) {
  document.getElementById('viewBookshelf').classList.toggle('hidden', view !== 'bookshelf');
  document.getElementById('viewReader').classList.toggle('hidden', view !== 'reader');

// Render chapter content (scroll mode)
// 正文开头常重复章节标题（如 "CHAPTER I"），渲染时去掉，避免标题出现两遍
function chapterBodyText(ch) {
  const body = ch.body || '';
  const title = (ch.title || '').trim();
  if (!title) return body;
  const esc = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s*');
  const re = new RegExp('^\\s*' + esc + '\\s*', 'i');
  const stripped = body.replace(re, '');
  return stripped.trim().length > 0 ? stripped : body;
}

function renderChapter(chIdx, restorePos) {
  if (!state.currentBook) return;
  const ch = state.currentBook.chapters[chIdx];
  if (!ch) return;
  state.currentChapter = chIdx;
  
  const inner = document.getElementById('readerInner');
  const titleHtml = ch.title ? `<h2 class="chapter-title">${escapeHtml(ch.title)}</h2>` : '';
  
  // PDF 原页（每页一张渲染图）
  if (ch.pdfPage) { renderPdfPage(chIdx, ch); return; }

  // Comic / image-based chapter
  if (ch.imageUrl) {
    inner.innerHTML = titleHtml + `<div class="chapter-body"><div class="comic-page"><img src="${ch.imageUrl}" alt="${escapeHtml(ch.title)}" loading="lazy"></div></div>`;
    renderHighlightsForChapter(chIdx);
    document.getElementById('topbarBook').textContent = state.currentBook.title;
    document.getElementById('topbarChapter').textContent = ch.title || `第 ${chIdx+1} 章`;
    updateProgress();
    setReaderMode();
    if (restorePos) {
      const prog = getProgress(state.currentBook.id);
      const content = document.getElementById('readerContent');
      setTimeout(() => {
        if (state.settings.mode === 'scroll') {
          const max = content.scrollHeight - content.clientHeight;
          content.scrollTop = Math.min(prog.scrollY || 0, Math.max(0, max));
        } else {
          renderPage(prog.pageIndex || 0, false);
        }
      }, 50);
    }
    saveState();
    return;
  }
  
  // Split body into paragraphs
  const bodyText = chapterBodyText(ch);
  let paragraphs = bodyText.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  if (paragraphs.length <= 1) paragraphs = bodyText.split(/\n+/).filter(p => p.trim().length > 0);
  if (paragraphs.length === 0) paragraphs = [bodyText];
  
  const bodyHtml = paragraphs.map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
  inner.innerHTML = titleHtml + `<div class="chapter-body">${bodyHtml}</div>`;

  // 渲染本章已有划线高亮
  renderHighlightsForChapter(chIdx);

  // Update topbar
  document.getElementById('topbarBook').textContent = state.currentBook.title;
  document.getElementById('topbarChapter').textContent = ch.title || `第 ${chIdx+1} 章`;
  updateProgress();
  
  // Mode
  setReaderMode();
  
  // Restore position
  if (restorePos) {
    const prog = getProgress(state.currentBook.id);
    const content = document.getElementById('readerContent');
    setTimeout(() => {
      if (state.settings.mode === 'scroll') {
        const max = content.scrollHeight - content.clientHeight;
        content.scrollTop = Math.min(prog.scrollY || 0, Math.max(0, max));
      } else {
        renderPage(prog.pageIndex || 0, false);
      }
    }, 50);
  }
  
  saveState();
}

function setReaderMode() {
  const content = document.getElementById('readerContent');
  const pager = document.getElementById('pageContainer');
  const readerEl = document.getElementById('reader');
  const curCh = state.currentBook && state.currentBook.chapters && state.currentBook.chapters[state.currentChapter];
  // PDF 原页 / 整页图片没有可排版的文字，翻页模式会把它切碎，统一按单页滚动显示
  const isPageOnly = !!(curCh && (curCh.pdfPage || curCh.imageUrl));
  const paged = state.settings.mode === 'paged' && !isPageOnly;
  readerEl.classList.toggle('paged-mode', paged);
  content.classList.toggle('paged', paged);
  if (paged) {
    content.style.display = 'none';
    pager.style.display = '';
  } else {
    content.style.display = '';
    pager.style.display = 'none';
  }
}

// Scroll handler -> progress
function updateProgress() {
  const content = document.getElementById('readerContent');
  const ch = state.currentBook.chapters[state.currentChapter];
  let percent = 0;
  if (state.settings.mode === 'scroll') {
    const total = content.scrollHeight - content.clientHeight;
    percent = total > 0 ? content.scrollTop / total : 0;
  } else {
    percent = state.pageIndex / Math.max(1, state.totalPages - 1);
  }
  percent = Math.max(0, Math.min(1, percent));
  document.getElementById('progressBar').style.width = (percent * 100) + '%';
  document.getElementById('rbProgress').textContent = Math.round(percent * 100) + '%';
  
  setProgress(state.currentBook.id, {
    chapter: state.currentChapter,
    percent,
    scrollY: content.scrollTop,
    pageIndex: state.pageIndex || 0,
  });
}

// Apply settings to CSS
function applySettings() {
  const s = state.settings;
  document.documentElement.style.setProperty('--reader-size', s.fontSize + 'px');
  document.documentElement.style.setProperty('--reader-line', s.lineHeight);
  document.documentElement.style.setProperty('--reader-space', s.letterSpacing + 'em');
  document.documentElement.style.setProperty('--content-width', Math.min(s.contentWidth, 800) + 'px');
  const font = FONTS.find(f => f.id === s.fontFamily) || FONTS[0];
  document.documentElement.style.setProperty('--reader-font', font.css);
  
  // Theme
  let theme = s.theme;
  if (s.followSystem && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    theme = 'dark';
  }
  document.documentElement.setAttribute('data-theme', theme);
  
  // Warm light
  const overlay = document.getElementById('warmOverlay');
  if (s.warmLight > 0) {
    overlay.style.background = `rgba(255, 170, 80, ${s.warmLight})`;
    overlay.classList.add('active');
  } else {
    overlay.classList.remove('active');
  }
}

// Theme toggle
function cycleTheme() {

}

// TOC
function renderTOC(body) {
  const ul = document.createElement('ul');
  ul.className = 'chapter-list';
  const book = state.currentBook;
  const total = book.chapters.length;
  const BATCH = 300;          // 一次渲染 300 章，避免几千章的目录卡死
  let shown = 0;

  const moreBtn = document.createElement('button');
  moreBtn.className = 'reset-btn';
  moreBtn.style.marginTop = '8px';

  function appendBatch() {
    const end = Math.min(total, shown + BATCH);
    for (let i = shown; i < end; i++) {
      const ch = book.chapters[i];
      const li = document.createElement('li');
      if (i === state.currentChapter) li.className = 'active';
      const itemProg = state.progress[book.id + '_ch_' + i];
      li.innerHTML = `<div class="toc-item-progress ${itemProg?'read':''}">
        <span class="progress-dot"></span>
        <span class="ch-text">${escapeHtml(ch.title || ('第 '+(i+1)+' 章'))}</span>
      </div>`;
      li.onclick = () => { renderChapter(i, true); closeSidebar(); };
      ul.appendChild(li);
    }
    shown = end;
    if (shown >= total) { moreBtn.remove(); }
    else { moreBtn.textContent = `继续加载（已显示 ${shown} / ${total} 章）`; }
  }

  appendBatch();
  body.appendChild(ul);
  if (shown < total) { moreBtn.onclick = appendBatch; body.appendChild(moreBtn); }
}

// ===== Search =====
function renderSearch(body) {
  body.innerHTML = `
    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索全书内容…" autocomplete="off">
      <span class="search-clear" id="searchClear" style="display:none">×</span>
    </div>
    <div class="search-stats" id="searchStats"></div>
    <div id="searchResults"></div>
  `;
  const input = body.querySelector('#searchInput');
  const results = body.querySelector('#searchResults');
  const stats = body.querySelector('#searchStats');
  const clearBtn = body.querySelector('#searchClear');
  
  let timer;
  input.oninput = e => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    clearBtn.style.display = q ? '' : 'none';
    if (!q) { results.innerHTML=''; stats.textContent=''; return; }
    timer = setTimeout(() => doSearch(q, results, stats), 300);
  };
  clearBtn.onclick = () => { input.value=''; results.innerHTML=''; stats.textContent=''; clearBtn.style.display='none'; };
}

function doSearch(query, resultsEl, statsEl) {
  const q = query.toLowerCase();
  const found = [];
  state.currentBook.chapters.forEach((ch, ci) => {
    let idx = 0;
    const body = ch.body.toLowerCase();
    while ((idx = body.indexOf(q, idx)) !== -1) {
      const start = Math.max(0, idx - 30);
      const end = Math.min(ch.body.length, idx + query.length + 50);
      let snippet = ch.body.slice(start, end);
      if (start > 0) snippet = '…' + snippet;
      if (end < ch.body.length) snippet = snippet + '…';
      found.push({ chapterIdx: ci, chapterTitle: ch.title, snippet, pos: idx });
      idx += query.length;
    }
  });
  statsEl.textContent = `找到 ${found.length} 处匹配`;
  if (found.length === 0) { resultsEl.innerHTML = '<div class="empty-state">没有找到相关内容</div>'; return; }
  resultsEl.innerHTML = found.slice(0, 50).map((r, i) => `
    <div class="search-result" data-i="${i}">
      <div class="sr-chapter">${escapeHtml(r.chapterTitle || ('第 '+(r.chapterIdx+1)+' 章'))}</div>
      <div class="sr-snippet">${escapeHtml(r.snippet)}</div>
    </div>`).join('');
  resultsEl.querySelectorAll('.search-result').forEach(el => {
    el.onclick = () => {
      const r = found[+el.dataset.i];
      renderChapter(r.chapterIdx, false);
      closeSidebar();
      // Highlight
      setTimeout(() => highlightInReader(query), 200);
    };
  });
}

function highlightInReader(query) {
  const inner = document.getElementById('readerInner');
  const walker = document.createTreeWalker(inner, NodeFilter.SHOW_TEXT);
  const targets = [];
  let node;
  while ((node = walker.nextNode())) {
    if (node.nodeValue.toLowerCase().includes(query.toLowerCase())) targets.push(node);
  }
  targets.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = n.nodeValue.replace(new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'gi'), '<mark>$1</mark>');
    n.parentNode.replaceChild(span, n);
  });
  const firstMark = inner.querySelector('mark');
  if (firstMark) firstMark.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderNotesList(body) {
  const allNotes = [];
