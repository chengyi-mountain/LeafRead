    const [bookId, chIdx] = key.split(':');
    state.notes[key].forEach(n => allNotes.push({ bookId, chIdx:+chIdx, ...n }));
  });
  allNotes.sort((a,b) => b.time - a.time);
  
  if (allNotes.length === 0) {
    body.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4z"/></svg><br>还没有笔记<br><small>在阅读时长按选中文字即可添加</small></div>';
    return;
  }
  body.innerHTML = allNotes.map((n,i) => {
    const book = state.books.find(b => b.id === n.bookId);
    return `<div class="note-item" data-i="${i}">
      <div class="note-chapter">${escapeHtml(book?book.title:'未知')} · ${escapeHtml(n.chapterTitle||'')}</div>
      <div class="note-text">${escapeHtml(n.text)}</div>
      <div class="note-date">${new Date(n.time).toLocaleString('zh-CN')}</div>
      <div class="note-actions">
        <button class="mini-btn" data-speak-i="${i}">朗读</button>
        <button class="mini-btn" data-share-i="${i}">分享</button>
      </div>
    </div>`;
  }).join('');
  body.querySelectorAll('.note-item').forEach(el => {
    el.onclick = e => {
      // Don't navigate if clicking action button
      if (e.target.dataset && (e.target.dataset.shareI !== undefined || e.target.dataset.speakI !== undefined)) return;
      const n = allNotes[+el.dataset.i];
      const book = state.books.find(b => b.id === n.bookId);
      if (book) { openBook(book); setTimeout(() => renderChapter(n.chIdx, false), 100); closeSidebar(); }
    };
  });
  // Speak button in note items
  body.querySelectorAll('[data-speak-i]').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const n = allNotes[+btn.dataset.speakI];
      speakText(n.text);
    };
  });
  // Share button in note items
  body.querySelectorAll('[data-share-i]').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const n = allNotes[+btn.dataset.shareI];
      const book = state.books.find(b => b.id === n.bookId);
      showShareModal({
        bookTitle: book ? book.title : '未知',
        chapterTitle: n.chapterTitle || '',
        text: n.text,
      });
    };
  });
}

function renderBookmarksList(body) {

    body.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg><br>暂无书签<br><small>点击顶部书签按钮添加</small></div>';

  }
  bms.sort((a,b) => b.time - a.time);
  body.innerHTML = bms.map((bm,i) => `
    <div class="bookmark-item" data-i="${i}">
      <div class="bm-chapter">${escapeHtml(bm.chapterTitle || '')}</div>
      <div class="bm-text">${escapeHtml(bm.context || '')}</div>

      <div class="bm-actions">
        <button class="mini-btn" data-act="goto" data-i="${i}">跳转</button>
        <button class="mini-btn" data-act="speak" data-i="${i}">朗读</button>
        <button class="mini-btn" data-act="share" data-i="${i}">分享</button>
        <button class="mini-btn danger" data-act="del" data-i="${i}">删除</button>
      </div>
    </div>`).join('');
  body.querySelectorAll('.bookmark-item [data-act="goto"]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const bm = bms[+btn.dataset.i];
    renderChapter(bm.chapterIdx, false);
    if (state.settings.mode === 'scroll') {
      setTimeout(() => {
        const content = document.getElementById('readerContent');
        const ratio = bm.ratio || 0;
        content.scrollTop = (content.scrollHeight - content.clientHeight) * ratio;
      }, 150);
    }
    closeSidebar();
  });
  body.querySelectorAll('.bookmark-item [data-act="speak"]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const bm = bms[+btn.dataset.i];
    // 朗读该书签位置附近的内容
    const ch = state.currentBook.chapters[bm.chapterIdx];
    if (ch) {
      const startPos = Math.max(0, Math.floor((bm.ratio || 0) * ch.body.length) - 50);
      const textToSpeak = ch.body.slice(startPos, startPos + 500);
      speakText(textToSpeak);
    }
  });
  body.querySelectorAll('.bookmark-item [data-act="share"]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const bm = bms[+btn.dataset.i];
    showShareModal({
      bookTitle: state.currentBook.title,
      chapterTitle: bm.chapterTitle || '',
      text: bm.context || '',
    });
  });
  body.querySelectorAll('.bookmark-item [data-act="del"]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    bms.splice(+btn.dataset.i, 1);
    state.bookmarks[bookId] = bms;
    saveState();
    renderBookmarksList(body);
    updateBookmarkBadge();
  });
  body.querySelectorAll('.bm-note-input').forEach(ta => ta.onchange = e => {
    bms[+ta.dataset.i].note = ta.value;
    state.bookmarks[bookId] = bms;
    saveState();
  });
}

function updateBookmarkBadge() {
  const badge = document.getElementById('bookmarkBadge');
  if (!state.currentBook) return;
  const bms = state.bookmarks[state.currentBook.id] || [];
  badge.classList.toggle('show', bms.length > 0);
}
function updateNotesBadge() {
  const badge = document.getElementById('notesBadge');
  const count = Object.values(state.notes).flat().length;
  badge.classList.toggle('show', count > 0);
}

function addBookmark() {
  if (!state.currentBook) return;
  const ch = state.currentBook.chapters[state.currentChapter];
  const bookId = state.currentBook.id;
  if (!state.bookmarks[bookId]) state.bookmarks[bookId] = [];

  // 计算当前位置标记（用于去重）
  let context = '';
  let ratio = 0;
  if (state.settings.mode === 'scroll') {
    const content = document.getElementById('readerContent');
    const mid = content.scrollTop + content.clientHeight / 2;
    const paras = document.querySelectorAll('#readerInner p');
    paras.forEach(p => { if (Math.abs(p.offsetTop - mid) < 100) context = p.textContent.slice(0, 80); });
    const total = content.scrollHeight - content.clientHeight;
    ratio = total > 0 ? content.scrollTop / total : 0;
  } else {
    const canvas = document.getElementById('pageCanvas');
    const firstP = canvas.querySelector('p');
    if (firstP) context = firstP.textContent.slice(0, 80);
    ratio = (state.pageIndex || 0) / Math.max(1, state.totalPages - 1);
  }

  // 查找是否已有同一章节、位置相近的书签（容差 5%）
  const existingIdx = state.bookmarks[bookId].findIndex(bm =>
    bm.chapterIdx === state.currentChapter && Math.abs((bm.ratio || 0) - ratio) < 0.05
  );

  if (existingIdx >= 0) {
    // 已存在 → 取消（删除）该书签
    state.bookmarks[bookId].splice(existingIdx, 1);
    saveState();
    updateBookmarkBadge();
    toast('已取消书签');
    return;
  }

  // 新增书签
  state.bookmarks[bookId].push({
    chapterIdx: state.currentChapter,
    chapterTitle: ch.title || `第 ${state.currentChapter+1} 章`,
    context,
    note: '',
    time: Date.now(),
    ratio,
  });
  saveState();
  updateBookmarkBadge();
  toast('已添加书签');
}

// ===== Stats =====
function recordRead() {
  const today = new Date().toISOString().slice(0,10);
  const st = state.stats;
  if (st.lastRead) {
    const last = new Date(st.lastRead);
    const days = Math.floor((Date.now() - last) / 86400000);
    if (days === 1) st.streak = (st.streak || 0) + 1;
    else if (days > 1) st.streak = 1;
  } else {
    st.streak = 1;
  }
  st.lastRead = Date.now();
  st.readDates[today] = (st.readDates[today] || 0) + 1;
  saveState();
}

// Track reading time
let readingTimer = null;
let sessionStart = 0;
function startReadingTimer() {
  stopReadingTimer();
  sessionStart = Date.now();
  readingTimer = setInterval(() => {
    const mins = Math.floor((Date.now() - sessionStart) / 60000);
    if (mins > 0) {
      const today = new Date().toISOString().slice(0,10);
      state.stats.dailyMinutes[today] = (state.stats.dailyMinutes[today] || 0) + mins;
      state.stats.totalTime = (state.stats.totalTime || 0) + mins;
      sessionStart = Date.now();
      saveState();
    }
  }, 60000);
}
function stopReadingTimer() {
  if (readingTimer) { clearInterval(readingTimer); readingTimer = null; }
}

function renderStats(body) {
  const st = state.stats;
  const totalMins = st.totalTime || 0;
  const totalHours = (totalMins / 60).toFixed(1);
  
  // Generate last 28 days calendar
  const days = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = d.toISOString().slice(0,10);
    const count = st.readDates[key] || 0;
    days.push({ date: d, key, count });
  }
  
  const maxCount = Math.max(1, ...days.map(d => d.count));
  
  body.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${totalHours}</div><div class="stat-label">累计阅读(小时)</div></div>
      <div class="stat-card"><div class="stat-value">${(st.streak||0)}</div><div class="stat-label">连续天数</div></div>
      <div class="stat-card"><div class="stat-value">${Object.keys(st.readDates).length}</div><div class="stat-label">阅读天数</div></div>
      <div class="stat-card"><div class="stat-value">${Math.max(...Object.values(st.dailyMinutes||{}),0)}</div><div class="stat-label">单日最高(分)</div></div>
    </div>
    <div class="settings-group-title" style="margin-bottom:8px">近 28 天</div>
    <div class="streak-calendar">
      ${days.map(d => {
        let level = '';
        if (d.count > 0) {
          const ratio = d.count / maxCount;
          level = ratio > 0.75 ? 'level4' : ratio > 0.5 ? 'level3' : ratio > 0.25 ? 'level2' : 'level1';
        }
        return `<div class="streak-day ${d.count>0?'active '+level:''}" title="${d.key}: ${d.count}次">${d.date.getDate()}</div>`;
      }).join('')}
    </div>
  `;
}

    </div>

    </div>
    <input type="file" id="fileInput" multiple accept=".txt,.epub,.html,.htm,.md,.markdown,.pdf,.pptx,.ppt,.docx,.doc,.xlsx,.xls,.rtf,.cbr,.cbz,.fb2,.azw3,.mobi,.odt,.ods,.odp,.jpg,.jpeg,.png,.gif,.webp,.bmp,.avif" style="display:none">
    <input type="file" id="importDataFile" accept=".json" style="display:none">
  `;
  
  const dropZone = body.querySelector('#dropZone');
  const fileInput = body.querySelector('#fileInput');
  const importDataFile = body.querySelector('#importDataFile');
  const progressEl = body.querySelector('#importProgress');
  const progressText = body.querySelector('#importProgressText');
  
  dropZone.onclick = () => fileInput.click();
  fileInput.onchange = e => handleFiles(e.target.files, progressEl, progressText);
  
  // Drag & drop
  ['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
  dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files, progressEl, progressText));
  
  // URL import
  body.querySelector('#urlGo').onclick = () => {
    const url = body.querySelector('#urlInput').value.trim();
    if (!url) { toast('请输入 URL', 'error'); return; }
    fetchUrlContent(url, progressEl, progressText);
  };
  importDataFile.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.books) {
          const imported = JSON.parse(localStorage.getItem('reader_imported_books_v2') || '[]');
          localStorage.setItem('reader_imported_books_v2', JSON.stringify([...imported, ...data.books.map(b => b.category ? b : Object.assign(b, {category: guessCategory(b)}))]));
        }
        if (data.settings) Object.assign(state.settings, data.settings);
        if (data.progress) state.progress = data.progress;
        if (data.bookmarks) state.bookmarks = data.bookmarks;
        if (data.notes) state.notes = data.notes;
        if (data.highlights) state.highlights = data.highlights;
        if (data.stats) state.stats = data.stats;
        saveState(); initBooks();
        toast('备份恢复成功', 'success');
        setTimeout(() => switchView('bookshelf'), 500);
      } catch(err) { toast('备份文件格式错误', 'error'); }
    };
    reader.readAsText(file);
  };
}

async function handleFiles(fileList, progressEl, progressText) {
  // 取快照：调用方可能在异步期间清空 input，FileList 是活动对象，不留快照会漏书
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (progressEl) progressEl.classList.add('show');
  const imported = JSON.parse(localStorage.getItem('reader_imported_books_v2') || '[]');
  let okCount = 0;
  const failed = [];
  const tooBig = [];
  const lowQuality = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (progressText) progressText.textContent = `正在处理: ${file.name} (${i + 1}/${files.length})`;
    try {
      const book = await parseFile(file);
      if (!book) { failed.push(file.name); continue; }
      book.id = 'imp_' + Date.now() + '_' + i;
      book.imported = true;
      if (!book.category) book.category = guessCategory(book);

      // 正文一律先尝试放 IndexedDB（localStorage 只有约 5MB，装不下整本小说）
      let storedInIdb = false;
      try {
        await idbPutBook(book);
        storedInIdb = true;
      } catch (e) {
        console.warn('IndexedDB 存入失败，回退 localStorage', e);
      }

      if (book.textQuality === 'low') {
        lowQuality.push(file.name);
      }
      if (storedInIdb) {
        imported.push(bookMetaOnly(book));
        okCount++;
      } else {
        const payload = JSON.stringify(imported.concat([book]));
        if (payload.length > 4500000) {
          tooBig.push(file.name + '（' + (file.size / 1048576).toFixed(1) + ' MB）');
          continue;
        }
        imported.push(book);
        okCount++;
      }
    } catch (e) {
      console.error('Parse error', e);
      failed.push(file.name);
      toast('解析失败: ' + file.name, 'error');
    }
  }

  try {
    localStorage.setItem('reader_imported_books_v2', JSON.stringify(imported));
  } catch (e) {
    toast('浏览器本地存储写不进去，导入失败', 'error', 4000);
    if (progressEl) progressEl.classList.remove('show');
    return;
  }
  saveState();
  initBooks();
  if (progressEl) progressEl.classList.remove('show');
  if (okCount) {
    toast(`成功导入 ${okCount} 本书` + (failed.length ? `，${failed.length} 个解析失败` : ''), 'success');
  }
  if (tooBig.length) {
    toast('这几个文件太大、浏览器存不下：' + tooBig.join('、') + '。建议先切成小份再导入', 'error', 6000);
  }
  if (lowQuality.length) {
    toast('这几个文件的文字层可能不完整，导入后看着不对就换个源：' + lowQuality.join('、'), '', 6000);
  }
  if (!okCount && !tooBig.length) toast('这些文件都解析失败，请换 TXT / EPUB / DOCX 再试', 'error');
  renderBookshelf();
}


// Simple EPUB text extractor (fallback when JSZip is not available)
async function extractEpubText(buffer) {
  // EPUB is a ZIP file. Without a ZIP library, we can try to find text content
  // by looking for HTML content between ZIP headers. This is a best-effort approach.
  const bytes = new Uint8Array(buffer);
  let text = '';
  // Try to find HTML content by searching for common HTML markers
  const str = String.fromCharCode.apply(null, bytes.subarray(0, Math.min(bytes.length, 500000)));
  // Look for any text content
  const matches = str.match(/<\?xml[^>]*>|<html|<body|<div|<p[^>]*>/gi);
  if (matches) {
    // Extract readable text between tags
    text = str.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
              .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
              .replace(/<[^>]+>/g, '\n')
              .replace(/&nbsp;/g, ' ')
              .replace(/&amp;/g, '&')
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/\n{3,}/g, '\n\n');
  }
  if (!text.trim()) {
    // Last resort: just decode as text
    text = new TextDecoder('utf-8', {fatal:false}).decode(bytes);
    text = text.replace(/<[^>]+>/g, '\n').replace(/\n{3,}/g, '\n\n');
  }
  return text;
}

/* ---------- 文本编码识别（中文 TXT 常见 GBK / UTF-16 / BOM） ---------- */
function decodeTextSmart(buffer) {
  const bytes = new Uint8Array(buffer);
  if (!bytes.length) return '';
  // BOM 优先
  if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
  if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
  if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return new TextDecoder('utf-8').decode(bytes.subarray(3));
  // 无 BOM 的 UTF-16：中文码位高位字节集中在 0x4E–0x9F，
  // 纯中文文本里几乎没有 0x00，所以不能靠空字节判断，要看“高位字节分布”
  const probeLen = Math.min(bytes.length - (bytes.length % 2), 8192);
  let pairs = 0, leCJK = 0, beCJK = 0, zeroEven = 0;
  for (let i = 0; i + 1 < probeLen; i += 2) {
    pairs++;
    if (bytes[i + 1] >= 0x4E && bytes[i + 1] <= 0x9F) leCJK++;   // LE 的高位在奇数位
    if (bytes[i] >= 0x4E && bytes[i] <= 0x9F) beCJK++;           // BE 的高位在偶数位
    if (bytes[i] === 0) zeroEven++;                              // 纯 ASCII 的 UTF-16LE 特征
  }
  if (pairs > 0) {
    const le = leCJK / pairs, be = beCJK / pairs;
    if (le > 0.65 && le > be) return new TextDecoder('utf-16le').decode(bytes);
    if (be > 0.65 && be > le) return new TextDecoder('utf-16be').decode(bytes);
    if (pairs > 8 && zeroEven / pairs > 0.3) return new TextDecoder('utf-16le').decode(bytes);
  }
  // 严格 UTF-8：不合法就说明不是 UTF-8
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch (e) { /* 继续 */ }
  // 回退 GB18030（兼容 GBK / GB2312，覆盖绝大多数中文 TXT）
  try {
    return new TextDecoder('gb18030').decode(bytes);
  } catch (e) { /* 继续 */ }
  return new TextDecoder('utf-8').decode(bytes);
}

function readTextFileSmart(file) {
  return file.arrayBuffer().then(buf => decodeTextSmart(buf));
}

/* ---------- PDF：按需加载仓库内自托管的 pdf.js ---------- */
let pdfJsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfJsPromise) return pdfJsPromise;
  pdfJsPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'pdf/pdf.min.js';
    sc.onload = () => {
      if (!window.pdfjsLib) { reject(new Error('pdf.js 加载后不可用')); return; }
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf/pdf.worker.min.js';
      } catch (e) { /* 老内核没有 worker 配置也继续试 */ }
      resolve(window.pdfjsLib);
    };
    sc.onerror = () => reject(new Error('仓库里缺少 pdf/pdf.min.js，PDF 解析不可用'));
    document.head.appendChild(sc);
  });
  return pdfJsPromise;
}

/* ================= PDF 原样阅读（页图模式） =================
   手机上的 PDF 阅读器是"逐页看原书扫描图"，不是把文字抽出来重排。
   这里按需要页渲染：每页一章，翻到哪页才渲染哪一页，20MB 的扫描书也不炸内存。
   ============================================================= */
const pdfDocCache = {};
const IMAGE_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'avif'];

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(fr.error || new Error('读取图片失败'));
    fr.readAsDataURL(blob);
  });
}

/* ---------- MuPDF(WASM)：中文老 PDF 的字体没有内嵌，pdf.js 会把字画成乱码，
   同一套引擎（PyMuPDF）渲染是正常的，所以原页模式用 MuPDF。只有真要逐页看时才加载。 */
let muPdfPromise = null;
const mupdfDocCache = {};

function loadMuPdf() {
  if (window.__mupdfLib) return Promise.resolve(window.__mupdfLib);
  if (muPdfPromise) return muPdfPromise;
  muPdfPromise = import(new URL('mupdf/mupdf.js', document.baseURI).href).then(async (mod) => {
    const lib = mod;
    if (lib && typeof lib.default === 'object' && lib.default && lib.default.Document) {
      // 兼容 default 导出
      window.__mupdfLib = lib.default;
    } else {
      window.__mupdfLib = lib;
    }
    // Emscripten 模块需要等 wasm 初始化
    if (typeof window.__mupdfLib.setLogLevel === 'undefined' && window.__mupdfLib.mupdf) {
      window.__mupdfLib = window.__mupdfLib.mupdf;
    }
    return window.__mupdfLib;
  }).catch(err => { muPdfPromise = null; throw err; });
  return muPdfPromise;
}

function getMupdfDoc(book) {
  if (mupdfDocCache[book.id]) return Promise.resolve(mupdfDocCache[book.id]);
  if (!book.pdfBlob) return Promise.reject(new Error('这本书的 PDF 原文件不在本机（可能被浏览器清理了），请重新导入一次'));
  return loadMuPdf().then(lib => book.pdfBlob.arrayBuffer().then(buf => {
    const u8 = new Uint8Array(buf);
    const doc = lib.Document.openDocument(u8, 'application/pdf');
    mupdfDocCache[book.id] = doc;
    return doc;
  }));
}

let pdfPageObjectUrl = null;

function pdfDocOptions(buf) {
  return { data: new Uint8Array(buf), cMapUrl: 'pdf/cmaps/', cMapPacked: true, useSystemFonts: true };
}

function getPdfDoc(book) {
  if (pdfDocCache[book.id]) return Promise.resolve(pdfDocCache[book.id]);
  if (!book.pdfBlob) return Promise.reject(new Error('这本书的 PDF 原文件不在本机（可能被浏览器清理了），请重新导入一次'));
  return loadPdfJs()
    .then(lib => book.pdfBlob.arrayBuffer().then(buf => lib.getDocument(pdfDocOptions(buf)).promise))
    .then(doc => { pdfDocCache[book.id] = doc; return doc; });
}

async function parsePdfBook(file) {
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await lib.getDocument(pdfDocOptions(buf)).promise;
  const n = doc.numPages;
  const title = file.name.replace(/\.pdf$/i, '');

  // 抽 4 页看有没有文字层：判断扫描件 / 原生 PDF
  let sample = '';
  const probes = [1, Math.ceil(n / 4), Math.ceil(n / 2), n].filter((v, i, a) => v >= 1 && v <= n && a.indexOf(v) === i);
  for (const p of probes) {
    try {
      const pg = await doc.getPage(p);
      const tc = await pg.getTextContent();
      sample += (tc.items || []).map(it => it.str).join('') + '\n';
    } catch (e) { /* 单页失败不影响整体 */ }
  }
  const hasTextLayer = sample.replace(/[\s\u3000]/g, '').length > 80;

  // 用户主动选了"文字模式"：抽文字重排
  if (state.settings.pdfTextMode) {
    const res = await extractPdfText(file);
    let text = fixPdfGbkText(res.text || '');
    let engine = 'pdf.js';
    // pdf.js 读坏了（乱码 / 大量问号）就换 MuPDF 再抽一次
    if (!text.trim() || textLooksGarbled(text) || replacementRatio(text) > 0.02) {
      const alt = await extractPdfTextMupdf(file).catch(() => '');
      if (alt && !textLooksGarbled(alt) && replacementRatio(alt) < replacementRatio(text || '')) {
        text = alt;
        engine = 'MuPDF';
      }
    }
    if (!text.trim() || textLooksGarbled(text)) {
      throw new Error('这个 PDF 抽不出可用文字（多半是扫描件）。请在设置里关掉「PDF 按文字阅读」，用原页阅读打开。');
    }
    const chapters = splitTextIntoChapters(text);
    return {
      title, author: '佚名', cover: 'imported', format: 'pdf', lang: detectLang(text), chapters,
      note: 'PDF 文字模式 · 共 ' + n + ' 页 · 文字层由 ' + engine + ' 提取' + (res.truncated ? '（仅前 2000 页）' : ''),
    };
  }

  // 默认：原页阅读，每页一章
  const chapters = [];
  for (let i = 1; i <= n; i++) chapters.push({ title: '第 ' + i + ' 页', body: '', pdfPage: i });
  return {
    title, author: '佚名', cover: 'imported', format: 'pdf', lang: 'zh',
    chapters, pdfMode: 'pages', pageCount: n, pdfBlob: file, hasTextLayer,
    note: 'PDF 原样阅读 · 共 ' + n + ' 页' + (hasTextLayer ? '（含文字层，可切文字模式）' : '（扫描版，逐页显示原图）'),
  };
}

async function parseImageBook(file, name) {
  const dataUrl = await blobToDataURL(file);
  return {
    title: name.replace(/[.][^.]+$/, ''), author: '佚名', cover: 'imported', format: 'image', lang: 'other',
    chapters: [{ title: '图片', body: '', imageUrl: dataUrl }],
  };
}

/* 把某一页 PDF 渲染出来放进正文区 */
function renderPdfPage(chIdx, ch) {
  const inner = document.getElementById('readerInner');
  const book = state.currentBook;
  const pageNo = ch.pdfPage;
  inner.innerHTML = '<div class="pdf-page-wrap" id="pdfPageWrap"><div class="pdf-page-status">正在渲染第 ' + pageNo + ' 页…<br>（首次打开要先下载 PDF 排版引擎，稍等一下）</div></div>';
  document.getElementById('topbarBook').textContent = book.title || '';
  document.getElementById('topbarChapter').textContent = ch.title || ('第 ' + pageNo + ' 页');
  renderHighlightsForChapter(chIdx);
  updateProgress();
  setReaderMode();
  saveState();

  const mount = (node, extra) => {
    const wrap = document.getElementById('pdfPageWrap');
    if (!wrap || state.currentChapter !== chIdx) return false;
    wrap.innerHTML = '';
    wrap.appendChild(node);
    if (extra) wrap.appendChild(extra);
    updateProgress();
    saveState();
    return true;
  };

  getMupdfDoc(book).then(doc => {
    if (state.currentChapter !== chIdx) return null;        // 用户已经翻走了
    const page = doc.loadPage(pageNo - 1);
    const b = page.getBounds();
    const pw = b[2] - b[0];
    const content = document.getElementById('readerContent');
    let avail = Math.min((content.clientWidth || 420) - 8, state.settings.contentWidth || 640);
    if (avail < 220) avail = Math.min((window.innerWidth || 420) - 16, 640);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const zoom = (avail / pw) * dpr;
    const lib = window.__mupdfLib;
    const pix = page.toPixmap(lib.mupdf ? lib.mupdf.Matrix.scale(zoom, zoom) : lib.Matrix.scale(zoom, zoom),
      lib.mupdf ? lib.mupdf.ColorSpace.DeviceRGB : lib.ColorSpace.DeviceRGB, false, true);
    const png = pix.asPNG();
    if (pdfPageObjectUrl) { try { URL.revokeObjectURL(pdfPageObjectUrl); } catch (e) { } }
    pdfPageObjectUrl = URL.createObjectURL(new Blob([png], { type: 'image/png' }));
    const img = document.createElement('img');
    img.src = pdfPageObjectUrl;
    img.alt = '第 ' + pageNo + ' 页';
    img.style.width = '100%';
    img.style.height = 'auto';
    const tip = book.chapters[chIdx + 1] ? (() => {
      const d = document.createElement('div');
      d.className = 'pdf-page-next';
      d.textContent = '下滑继续看第 ' + (pageNo + 1) + ' 页';
      return d;
    })() : null;
    mount(img, tip);
    return null;
  }).catch(err => {
    console.warn('MuPDF 渲染失败，退回 pdf.js', err);
    return renderPdfPageFallback(chIdx, ch).catch(e2 => {
      const wrap = document.getElementById('pdfPageWrap');
      if (wrap) wrap.innerHTML = '<div class="pdf-page-status">第 ' + pageNo + ' 页渲染失败：' + escapeHtml((e2 && e2.message) || String(e2)) + '</div>';
    });
  });
}

/* 备用渲染：仓库自带的 pdf.js（扫描件没问题；个别不内嵌中文字体的 PDF 可能显示乱码） */
function renderPdfPageFallback(chIdx, ch) {
  const book = state.currentBook;
  const pageNo = ch.pdfPage;
  return getPdfDoc(book).then(async doc => {
    if (state.currentChapter !== chIdx) return;
    const page = await doc.getPage(pageNo);
    const base = page.getViewport({ scale: 1 });
    const content = document.getElementById('readerContent');
    let avail = Math.min((content.clientWidth || 420) - 8, state.settings.contentWidth || 640);
    if (avail < 220) avail = Math.min((window.innerWidth || 420) - 16, 640);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const vp = page.getViewport({ scale: (avail / base.width) * dpr });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    const wrap = document.getElementById('pdfPageWrap');
    if (!wrap || state.currentChapter !== chIdx) return;
    wrap.innerHTML = '';
    wrap.appendChild(canvas);
  });
}

function textLooksGarbled(text) {
  const sample = String(text || '').slice(0, 3000);
  if (!sample) return true;
  let bad = 0, total = 0;
  for (let i = 0; i < sample.length; i++) {
    const c = sample.charCodeAt(i);
    total++;
    if (c === 0xFFFD || c === 0xFFFE) { bad++; continue; }
    if (c === 9 || c === 10 || c === 13) continue;
    if (c >= 0x20 && c < 0x7F) continue;
    if (c >= 0x4E00 && c <= 0x9FFF) continue;
    if (c >= 0x3000 && c <= 0x303F) continue;   // 中文标点
    if (c >= 0xFF00 && c <= 0xFFEF) continue;   // 全角符号
    if (c >= 0x00A0 && c <= 0x024F) continue;   // 拉丁扩展
    if (c >= 0x2000 && c <= 0x27FF) continue;   // 通用标点 / 符号
    bad++;
  }
  return total ? bad / total > 0.25 : true;
}

/* 老中文 PDF 的文字层常是 GBK 字节被当成 Latin-1 塞进 ToUnicode：
   直接读出来是 "¹ØÓÚ¾ÀÕý" 这种，按 GB18030 还原一次就正常了。*/
function fixPdfGbkText(text) {
  const t = String(text || '');
  if (!t) return t;
  const countCjk = s => {
    let n = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c >= 0x4E00 && c <= 0x9FFF) n++;
    }
    return n;
  };
  // 已经是正常中文就别动
  if (countCjk(t) > t.length * 0.05) return t;
  // 把每个字符当回一个字节，按 GB18030 解一次
  const bytes = new Uint8Array(t.length);
  for (let i = 0; i < t.length; i++) {
    const c = t.charCodeAt(i);
    bytes[i] = c <= 0xFF ? c : 0x3F;
  }
  let decoded = '';
  try { decoded = new TextDecoder('gb18030', { fatal: false }).decode(bytes); } catch (e) { return t; }
  const before = countCjk(t), after = countCjk(decoded);
  // 转码后汉字明显变多才采用，避免把正常文本改坏
  return after > before + 20 ? decoded : t;
}

/* 抽取结果里残留替换符/问号的比例，超过就认为不可靠 */
function replacementRatio(text) {
  const s = String(text || '');
  let bad = 0, total = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c === 32 || c === 9 || c === 10 || c === 13) continue;
    total++;
    if (c === 0xFFFD || c === 0x3F) bad++;
  }
  return total ? bad / total : 1;
}

/* 用 MuPDF 抽文字：中文老 PDF 的文字层被 pdf.js 读坏时靠它兜底 */
async function extractPdfTextMupdf(file) {
  const lib = await loadMuPdf();
  const buf = await file.arrayBuffer();
  const doc = lib.Document.openDocument(new Uint8Array(buf), 'application/pdf');
  const n = doc.countPages();
  let out = '';
  for (let i = 0; i < n; i++) {
    try {
      const page = doc.loadPage(i);
      const st = page.toStructuredText('preserve-whitespace');
      out += st.asText().replace(/\s*\n\s*/g, '\n').trim() + '\n\n';
    } catch (e) { /* 单页失败跳过 */ }
    if (i % 30 === 0) await new Promise(r => setTimeout(r, 0));
  }
  try { if (doc.destroy) doc.destroy(); } catch (e) { }
  return out;
}

function extractPdfText(file) {
  return loadPdfJs().then(lib => file.arrayBuffer().then(buf => {
    const opts = { data: new Uint8Array(buf), cMapPacked: true, useSystemFonts: true };
    // 只有仓库里真放了 cmaps 才传，缺了也不会报错
    opts.cMapUrl = 'pdf/cmaps/';
    return lib.getDocument(opts).promise;
  })).then(async pdf => {
    const total = pdf.numPages;
    const limit = Math.min(total, 2000);   // 超大 PDF 保护
    let fullText = '';
    for (let p = 1; p <= limit; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let pageText = '';
      tc.items.forEach(it => {
        pageText += it.str;
        if (it.hasEOL) pageText += '\n';
      });
      fullText += pageText.trim() + '\n\n';
      if (p % 20 === 0) { /* 让出主线程，避免长 PDF 卡住 UI */ await new Promise(r => setTimeout(r, 0)); }
    }
    return { text: fullText, pages: total, truncated: total > limit };
  });
}

/* ---------- 大书存储：IndexedDB（localStorage 只有 5MB，装不下整本小说） ---------- */
const BOOK_DB_NAME = 'leafread_books_v1';
const BOOK_STORE = 'books';
let bookDBPromise = null;
const bookLoading = {};

function openBookDB() {
  if (!('indexedDB' in window) || !window.indexedDB) return Promise.reject(new Error('本浏览器不支持 IndexedDB'));
  if (bookDBPromise) return bookDBPromise;
  bookDBPromise = new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(BOOK_DB_NAME, 1); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(BOOK_STORE)) db.createObjectStore(BOOK_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB 打开失败'));
    req.onblocked = () => reject(new Error('IndexedDB 被其他标签页占用'));
  });
  return bookDBPromise;
}

function idbPutBook(book) {
  return openBookDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(BOOK_STORE, 'readwrite');
    const st = tx.objectStore(BOOK_STORE);
    const req = st.put({ id: book.id, title: book.title, chapters: book.chapters, pdfBlob: book.pdfBlob || null, savedAt: Date.now() });
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error || new Error('写入失败'));
    tx.onabort = () => reject(tx.error || new Error('写入被中断（可能是空间不足）'));
  }));
}

function idbGetBook(id) {
  return openBookDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(BOOK_STORE, 'readonly');
    const req = tx.objectStore(BOOK_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error('读取失败'));
  }));
}

function idbDeleteBook(id) {
  return openBookDB().then(db => new Promise((resolve) => {
    const tx = db.transaction(BOOK_STORE, 'readwrite');
    const req = tx.objectStore(BOOK_STORE).delete(id);
    req.onsuccess = () => resolve(true);
    req.onerror = () => resolve(false);
  })).catch(() => false);
}

// 只保留元信息，正文交给 IndexedDB
function bookMetaOnly(book) {
  const meta = {};
  Object.keys(book).forEach(k => { if (k !== 'chapters' && k !== 'pdfBlob') meta[k] = book[k]; });
  if (meta.coverData && meta.coverData.length > 200000) delete meta.coverData;
  meta.chapterCount = (book.chapters || []).length;
  meta.storedIn = 'idb';
  return meta;
}

function loadIdbBook(book) {
  if (bookLoading[book.id]) return bookLoading[book.id];
  showLazyHint(book.title);
  bookLoading[book.id] = idbGetBook(book.id).then(d => {
    hideLazyHint();
    if (!d || !d.chapters || !d.chapters.length) {
      throw new Error('本机找不到这本书的正文，可能被浏览器清理了，请重新导入');
    }
    book.chapters = d.chapters;
    if (d.pdfBlob) book.pdfBlob = d.pdfBlob;
    return book;
  }).catch(e => {
    hideLazyHint();
    delete bookLoading[book.id];
    throw e;
  });
  return bookLoading[book.id];
}

function parseFile(file) {
  return new Promise(async (resolve, reject) => {
    const name = file.name;
    const ext = name.split('.').pop().toLowerCase();
    
    if (ext === 'txt') {
      readTextFileSmart(file).then(text => {
        const chapters = splitTextIntoChapters(text);
        resolve({ title: name.replace(/\.txt$/i,''), author: '佚名', cover:'imported', format:'txt', lang: detectLang(text), chapters });
      }).catch(reject);
    } else if (ext === 'epub') {
      // EPUB = ZIP 包，按 OPF spine 顺序读取正文
      try {
        const buf = await file.arrayBuffer();
        const zip = await unzipEntries(buf);
        const info = await extractEpubFromZip(zip);
        if (!info.text.trim()) throw new Error('EPUB 内没有可读正文');
        let chapters = await buildEpubChaptersFromToc(info.zip, info.order, info.toc);
        let tocNote = '';
        if (chapters) {
          tocNote = '按 EPUB 自带目录分章，共 ' + chapters.length + ' 章';
        } else {
          chapters = splitTextIntoChapters(info.text);
          tocNote = '这本 EPUB 没有可用目录，按文件顺序分章（' + chapters.length + ' 章）';
        }
        resolve({
          title: info.title || name.replace(/\.epub$/i, ''),
          author: info.author || '佚名',
          cover: 'imported', format: 'epub',
          lang: detectLang(info.text), chapters,
          note: tocNote
        });
      } catch (e) { reject(e); }
    } else if (ext === 'html' || ext === 'htm') {
      readTextFileSmart(file).then(raw => {
        const text = raw.replace(/<[^>]+>/g, '\n').replace(/\n{3,}/g,'\n\n');
        const chapters = splitTextIntoChapters(text);
        resolve({ title: name.replace(/\.html?$/i,''), author:'佚名', cover:'imported', lang:detectLang(text), chapters });
      }).catch(reject);
    } else if (ext === 'md' || ext === 'markdown') {
      readTextFileSmart(file).then(raw => {
        let text = raw;
        text = text.replace(/^#{1,6}\s+/gm, '').replace(/\*\*/g,'').replace(/\*/g,'').replace(/`/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
        const chapters = splitTextIntoChapters(text);
        resolve({ title: name.replace(/\.m?d$/i,''), author:'佚名', cover:'imported', lang:detectLang(text), chapters });
      }).catch(reject);
    } else if (ext === 'pdf') {
      parsePdfBook(file).then(resolve).catch(reject);
    } else if (IMAGE_EXTS.indexOf(ext) >= 0) {
      parseImageBook(file, name).then(resolve).catch(reject);
    } else if (ext === 'pptx' || ext === 'ppt') {
      parseOfficeXml(file, 'pptx').then(resolve).catch(reject);
    } else if (ext === 'docx' || ext === 'doc') {
      parseOfficeXml(file, 'docx').then(resolve).catch(reject);
    } else if (ext === 'xlsx' || ext === 'xls') {
      parseOfficeXml(file, 'xlsx').then(resolve).catch(reject);
    } else if (ext === 'odt') {
      parseOfficeXml(file, 'odt').then(resolve).catch(reject);
    } else if (ext === 'odp') {
      parseOfficeXml(file, 'odp').then(resolve).catch(reject);
    } else if (ext === 'ods') {
      parseOfficeXml(file, 'ods').then(resolve).catch(reject);
    } else if (ext === 'rtf') {
      readTextFileSmart(file).then(raw => {
        let text = stripRtf(raw);
        const chapters = splitTextIntoChapters(text);
        resolve({ title: name.replace(/\.rtf$/i,''), author:'佚名', cover:'imported', lang:detectLang(text), chapters });
      }).catch(reject);
    } else if (ext === 'fb2') {
      readTextFileSmart(file).then(xml => {
        const sections = [];
        const bodyMatch = xml.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        const body = bodyMatch ? bodyMatch[1] : xml;
        const sectionTitles = [];
        const stRe = /<section[^>]*>([\s\S]*?)<\/section>/gi;
        let sm;
        while ((sm = stRe.exec(body)) !== null) {
          const txt = extractXmlText(sm[1]);
          const titleMatch = sm[1].match(/<title[^>]*>([\s\S]*?)<\/title>/i);
          const t = titleMatch ? extractXmlText(titleMatch[1]).trim() : '';
          if (txt.trim()) sections.push({ title: t || `第 ${sections.length + 1} 节`, body: txt.trim() });
        }
        if (!sections.length) {
          const allText = extractXmlText(body);
          const chaps = splitTextIntoChapters(allText);
          sections.push(...chaps);
        }
        const fullText = sections.map(s => s.body).join('\n\n');
        const titleMatch = xml.match(/<book-title[^>]*>([\s\S]*?)<\/book-title>/i);
        const authorMatch = xml.match(/<author[^>]*>[\s\S]*?<first-name[^>]*>([\s\S]*?)<\/first-name>[\s\S]*?<last-name[^>]*>([\s\S]*?)<\/last-name>/i)
          || xml.match(/<author[^>]*>([\s\S]*?)<\/author>/i);
        resolve({
          title: (titleMatch ? extractXmlText(titleMatch[1]).trim() : name.replace(/\.fb2$/i,'')) || 'FB2 文档',
          author: authorMatch ? authorMatch.slice(1).join(' ').trim() : '佚名',
          cover:'imported', format:'fb2', lang:detectLang(fullText), chapters: sections
        });
      }).catch(reject);
    } else if (ext === 'mobi' || ext === 'azw3') {
      // MOBI/AZW3 are binary; extract what readable text we can
      const reader = new FileReader();
      reader.onload = () => {
        const bytes = new Uint8Array(reader.result);
        let text = '';
        try {
          text = new TextDecoder('utf-8', {fatal:false}).decode(bytes);
          // Remove binary garbage: keep only printable ranges
          text = text.replace(/[\x00-\x08\x0E-\x1F\x7F-\x9F]/g, ' ');
          text = text.replace(/[^\x20-\x7E\u00A0-\uD7FF\uE000-\uFFFD\n\r\t，。！？、；：""''（）【】《》—…·\u4e00-\u9fff]/g, ' ');
        } catch(e) { text = ''; }
        const lines = text.split('\n').filter(l => l.trim().length > 3 && !/^[^\u4e00-\u9fff\w]+$/.test(l.trim())).join('\n');
        const chapters = splitTextIntoChapters(lines || text);
        resolve({ title: name.replace(/\.(mobi|azw3)$/i,''), author:'佚名', cover:'imported', lang:detectLang(lines || text), chapters: chapters.length ? chapters : [{title:'', body:'该 MOBI/AZW3 文件为加密二进制格式，仅能提取部分文本，建议转换为 EPUB 或 TXT 后重新导入。'}] });
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    } else if (ext === 'cbz' || ext === 'cbr') {
      // CBZ/CBR are comic archives; extract image list
      parseComicArchive(file, ext).then(resolve).catch(reject);
    } else if (ext === 'epub' || ext === 'txt' || ext === 'html' || ext === 'htm' || ext === 'md' || ext === 'markdown' || ext === 'pdf') {
      // Already handled above; this is a safety fallback
      reject(new Error('格式处理异常: ' + ext));
    } else {
      reject(new Error('不支持的格式: ' + ext + '（支持 TXT/EPUB/HTML/MD/PDF/PPT/Word/Excel/RTF/FB2/MOBI/CBR/CBZ/ODT 等）'));
    }
  });
}

// ===== Lightweight ZIP decompressor (no external dependency) =====
// Uses CompressionStream (DecompressionStream) available in modern browsers
// ===== 内置 ZIP 读取（浏览器原生 DecompressionStream，零第三方依赖）=====
async function unzipEntries(buffer) {
  const bytes = new Uint8Array(buffer);
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  const minPos = Math.max(0, bytes.length - 65557);
  for (let i = bytes.length - 22; i >= minPos; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 ZIP 压缩包');

  let count = dv.getUint16(eocd + 10, true);
  let cdStart = dv.getUint32(eocd + 16, true);
  // ZIP64（超大文件）
  if (count === 0xFFFF || cdStart === 0xFFFFFFFF) {
    const loc = eocd - 20;
    if (loc >= 0 && dv.getUint32(loc, true) === 0x07064b50) {
      const z64 = Number(dv.getBigUint64(loc + 8, true));
      count = Number(dv.getBigUint64(z64 + 32, true));
      cdStart = Number(dv.getBigUint64(z64 + 48, true));
    }
  }

  const entries = {};
  let p = cdStart;
  for (let i = 0; i < count; i++) {
    if (p + 46 > bytes.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, compSize, localOff };
    p += 46 + nameLen + extraLen + commentLen;
  }

  async function readBytes(name) {
    const e = entries[name];
    if (!e) return null;
    const lhNameLen = dv.getUint16(e.localOff + 26, true);
    const lhExtraLen = dv.getUint16(e.localOff + 28, true);
    const start = e.localOff + 30 + lhNameLen + lhExtraLen;
    const raw = bytes.subarray(start, start + e.compSize);
    if (e.method === 0) return raw;
    if (e.method !== 8) throw new Error('不支持的 ZIP 压缩算法: ' + e.method);
    if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持解压，请升级浏览器');
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  return {
    source: 'native',
    names: Object.keys(entries),
    has: n => !!entries[n],
    readBytes,
    async readText(name) {
      const b = await readBytes(name);
      return b ? new TextDecoder('utf-8').decode(b) : null;
    },
    async readBlob(name, type) {
      const b = await readBytes(name);
      return b ? new Blob([b], { type: type || 'application/octet-stream' }) : null;
    }
  };
}

// HTML/XHTML/XML 转纯文本
function stripHtmlToText(html) {
  if (!html) return '';
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<head[\s\S]*?<\/head>/gi, '')
    .replace(/<title[\s\S]*?<\/title>/gi, '')
    .replace(/<\/(p|div|h[1-6]|li|tr|section|article)>/gi, '\n\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#39;/g, "'")
    .replace(/&amp;/g, '&')
    .replace(/&#x([0-9a-fA-F]+);/g, (m, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (m, d) => String.fromCodePoint(parseInt(d, 10)))
    .replace(/[ \t\u00a0]+/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// 读取 EPUB 目录：优先 NCX（EPUB2），退到 nav.xhtml（EPUB3）
async function readEpubToc(zip, dir, manifest) {
  const fileOf = p => decodeURIComponent(String(p || '')).replace(/^(\.\/)+/, '').replace(/^\/+/, '').split('#')[0];
  let ncxPath = '';
  for (const id in (manifest || {})) {
    const it = manifest[id] || {};
    if (/dtbncx/i.test(it.media || '') || /\.ncx$/i.test(it.href || '')) { ncxPath = it.href; break; }
  }
  if (!ncxPath) ncxPath = zip.names.find(n => /\.ncx$/i.test(n)) || '';
  if (ncxPath) {
    const xml = (await zip.readText(ncxPath)) || '';
    if (xml) {
      const out = [];
      let depth = 0, cur = null;
      const re = /<navPoint\b[^>]*>|<\/navPoint>|<text[^>]*>([\s\S]*?)<\/text>|<content[^>]*src="([^"']+)"/gi;
      let m;
      while ((m = re.exec(xml)) !== null) {
        const tag = m[0];
        if (/^<navPoint/i.test(tag)) { depth++; cur = { depth, title: '', file: '' }; continue; }
        if (/^<\/navPoint/i.test(tag)) { depth = Math.max(0, depth - 1); continue; }
        if (m[1] !== undefined) {
          if (cur && !cur.title) cur.title = stripHtmlToText(m[1]).replace(/\s+/g, ' ').trim();
          continue;
        }
        if (m[2] !== undefined && cur && !cur.file) {
          cur.file = dir + fileOf(m[2]);
          out.push(cur);
        }
      }
      if (out.length >= 2) return out;
    }
  }
  // EPUB3 nav.xhtml
  for (const p of zip.names.filter(n => /\.(xhtml|html|htm)$/i.test(n))) {
    const xml = (await zip.readText(p)) || '';
    if (!/<nav[^>]*(toc|epub:type\s*=\s*["']toc["'])/i.test(xml)) continue;
    const navStart = xml.search(/<nav[^>]*(toc|epub:type\s*=\s*["']toc["'])/i);
    const block = xml.slice(navStart);
    const out = [];
    let depth = 0, cur = null;
    const base = p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
    const re = /<ol\b|<\/ol>|<li\b[^>]*>|<a[^>]*href="([^"']+)"[^>]*>([\s\S]*?)<\/a>/gi;
    let m;
    while ((m = re.exec(block)) !== null) {
      const tag = m[0];
      if (/^<ol/i.test(tag)) { depth++; continue; }
      if (/^<\/ol/i.test(tag)) { depth = Math.max(0, depth - 1); continue; }
      if (/^<li/i.test(tag)) { cur = { depth: depth || 1, title: '', file: '' }; continue; }
      if (m[1] !== undefined && cur && !cur.file) {
        cur.file = base + fileOf(m[1]);
        cur.title = stripHtmlToText(m[2]).replace(/\s+/g, ' ').trim();
        out.push(cur);
      }
    }
    if (out.length >= 2) return out;
  }
  return [];
}

// 用目录把 spine 文件合并成真正的章节：同一条目录下的多个文件并进同一章
async function buildEpubChaptersFromToc(zip, order, toc) {
  if (!toc || !toc.length || !order || !order.length) return null;
  const norm = p => decodeURIComponent(String(p || '')).replace(/^(\.\/)+/, '').replace(/^\/+/, '').split('#')[0];
  const idxByFile = {};
  order.forEach((p, i) => { idxByFile[norm(p)] = i; });
  const entries = [];
  for (const t of toc) {
    const f = norm(t.file).toLowerCase();
    let idx = idxByFile[norm(t.file)];
    if (idx === undefined) {
      const hit = Object.keys(idxByFile).find(k => {
        const kk = k.toLowerCase();
        return kk === f || kk.endsWith('/' + f) || f.endsWith('/' + kk) || kk.endsWith(f);
      });
      if (hit !== undefined) idx = idxByFile[hit];
    }
    if (idx === undefined) continue;
    entries.push({ depth: t.depth || 1, title: String(t.title || '').trim(), idx });
  }
  if (entries.length < 2) return null;
  const minDepth = Math.min(...entries.map(e => e.depth));
  const tops = entries.filter(e => e.depth === minDepth);
  if (tops.length < 2) return null;
  const chapters = [];
  for (let i = 0; i < tops.length; i++) {
    const start = i === 0 ? 0 : tops[i].idx;
    let end = (i + 1 < tops.length) ? tops[i + 1].idx : order.length;
    if (end <= start) end = Math.min(order.length, start + 1);
    const parts = [];
    for (let k = start; k < end; k++) {
      const html = await zip.readText(order[k]);
      const txt = stripHtmlToText(html || '');
      if (txt) parts.push(txt);
    }
    chapters.push({
      title: tops[i].title || ('第 ' + (i + 1) + ' 章'),
      body: parts.join('\n\n').trim()
    });
  }
  const merged = [];
  for (const c of chapters) {
    const prev = merged[merged.length - 1];
    if (prev && c.title && prev.title === c.title) {
      prev.body = (prev.body + '\n\n' + c.body).trim();
      continue;
    }
    merged.push(c);
  }
  const kept = merged.filter(c => c.body && c.body.length);
  return kept.length ? kept : null;
}

// 解析 EPUB：按 OPF 的 spine 顺序读取正文
async function extractEpubFromZip(zip) {
  let opfPath = zip.names.find(n => /\.opf$/i.test(n));
  let order = [];
  let metaTitle = '', metaAuthor = '';
  let dir = '', manifest = {}, toc = [], spineFiles = [];

  if (opfPath) {
    const opf = (await zip.readText(opfPath)) || '';
    metaTitle = (opf.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i) || [])[1] || '';
    metaAuthor = (opf.match(/<dc:creator[^>]*>([\s\S]*?)<\/dc:creator>/i) || [])[1] || '';
    dir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
    const itemRe = /<item\b[^>]*>/gi;
    let im;
    while ((im = itemRe.exec(opf)) !== null) {
      const tag = im[0];
      const id = (tag.match(/id="([^"]+)"/i) || [])[1];
      const href = (tag.match(/href="([^"]+)"/i) || [])[1];
      const media = (tag.match(/media-type="([^"]+)"/i) || [])[1] || '';
      if (id && href) manifest[id] = { href: dir + href, media };
    }
    const spineRe = /<itemref\b[^>]*idref="([^"]+)"/gi;
    let sm;
    while ((sm = spineRe.exec(opf)) !== null) {
      const item = manifest[sm[1]];
      if (item && /(html|xml)/i.test(item.media || item.href)) {
        const hp = decodeURIComponent(item.href).replace(/^(\.\/)+/, '');
        order.push(hp);
        spineFiles.push({ path: hp, media: item.media || '' });
      }
    }
  }

  if (!order.length) {
    order = zip.names.filter(n => /\.(xhtml|html|htm)$/i.test(n)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  }

  const parts = [];
  for (const path of order) {
    const html = await zip.readText(path);
    if (!html) continue;
    const text = stripHtmlToText(html);
    if (text) parts.push(text);
  }
  toc = await readEpubToc(zip, dir, manifest);
  return {
    text: parts.join('\n\n'),
    title: stripHtmlToText(metaTitle).trim(),
    author: stripHtmlToText(metaAuthor).trim(),
    order, toc, zip, hasSpine: spineFiles.length > 0
  };
}

// 解析 Office Open XML / ODF 文本
// Extract plain text from XML by removing tags and decoding entities
function extractXmlText(xml) {
  if (!xml) return '';
  let text = String(xml);
  // Decode numeric entities first
  text = text.replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)));
  text = text.replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(parseInt(d, 10)));
  // Remove all tags
  text = text.replace(/<[^>]+>/g, ' ');
  // Decode named entities
  text = text.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&hellip;/g, '…')
    .replace(/&mdash;/g, '—').replace(/&ndash;/g, '–').replace(/&lsquo;/g, '‘').replace(/&rsquo;/g, '’')
    .replace(/&ldquo;/g, '“').replace(/&rdquo;/g, '”').replace(/&laquo;/g, '«').replace(/&raquo;/g, '»')
    .replace(/&bull;/g, '•').replace(/&middot;/g, '·');
  // Collapse whitespace while preserving paragraph breaks
  text = text.replace(/ \s+/g, ' ').replace(/\s{2,}/g, '\n\n').trim();
  return text;
}

// 解析 Office Open XML / ODF 文本（使用内置 ZIP 读取器）
async function parseOfficeXml(file, type) {
  const buf = await file.arrayBuffer();
  const baseName = file.name.replace(/\.(pptx|ppt|docx|doc|xlsx|xls|odt|odp|ods)$/i, '');
  let zip;
  try { zip = await unzipEntries(buf); } catch (e) { return parseOfficeFallback(buf, type, baseName); }

  const pick = re => zip.names.filter(n => re.test(n)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const sections = [];
  let title = baseName;

  try {
    if (type === 'docx') {
      const docPath = zip.has('word/document.xml') ? 'word/document.xml' : pick(/word\/document\.xml$/i)[0];
      if (docPath) {
        const xml = (await zip.readText(docPath)) || '';
        const core = (await zip.readText('docProps/core.xml')) || '';
        const t = (core.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i) || [])[1];
        if (t) title = stripHtmlToText(t).trim() || title;
        const paras = xml.split(/<\/w:p>/i).map(p => extractXmlText(p).trim()).filter(p => p.length > 0);
        const fullText = paras.join('\n\n');
        sections.push(...splitTextIntoChapters(fullText));
      }
    } else if (type === 'pptx') {
      const slides = pick(/ppt\/slides\/slide\d+\.xml$/i);
      for (let i = 0; i < slides.length; i++) {
        const xml = (await zip.readText(slides[i])) || '';
        const text = extractXmlText(xml);
        if (text.trim()) sections.push({ title: '第 ' + (i + 1) + ' 页', body: text.trim() });
      }
    } else if (type === 'xlsx') {
      let shared = [];
      if (zip.has('xl/sharedStrings.xml')) {
        const ss = (await zip.readText('xl/sharedStrings.xml')) || '';
        shared = [...ss.matchAll(/<si[^>]*>([\s\S]*?)<\/si>/gi)].map(m => extractXmlText(m[1]).trim());
      }
      const sheets = pick(/xl\/worksheets\/sheet\d+\.xml$/i);
      for (let i = 0; i < sheets.length; i++) {
        const xml = (await zip.readText(sheets[i])) || '';
        const rows = [...xml.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/gi)].map(rm => {
          const cells = [...rm[1].matchAll(/<c([^>]*)>([\s\S]*?)<\/c>/gi)];
          return cells.map(cm => {
            const attrs = cm[1] || '';
            const tM = attrs.match(/t="([^"]+)"/);
            const t = tM ? tM[1] : '';
            if (t === 'inlineStr') {
              const is = (cm[2].match(/<is>([\s\S]*?)<\/is>/) || [])[1];
              return is ? extractXmlText(is).trim() : '';
            }
            const v = (cm[2].match(/<v>([\s\S]*?)<\/v>/) || [])[1];
            if (v === undefined) return '';
            if (t === 's') return shared[parseInt(v, 10)] || '';
            return extractXmlText(v).trim();
          }).filter(x => x).join(' | ');
        }).filter(r => r.trim());
        if (rows.length) sections.push({ title: '工作表 ' + (i + 1), body: rows.join('\n') });
      }
    } else if (type === 'odt' || type === 'odp' || type === 'ods') {
      const xml = (await zip.readText('content.xml')) || '';
      const bodyMatch = xml.match(/<office:body[\s\S]*?>([\s\S]*)<\/office:body>/i);
      const body = bodyMatch ? bodyMatch[1] : xml;
      const text = extractXmlText(body);
      sections.push(...splitTextIntoChapters(text));
    }
  } catch (e) {
    return parseOfficeFallback(buf, type, baseName);
  }

  if (!sections.length) return parseOfficeFallback(buf, type, baseName);
  return {
    title, author: '佚名', cover: 'imported', format: type,
    lang: detectLang(sections.map(s => s.body).join(' ')), chapters: sections
  };
}

function parseOfficeFallback(buffer, type, baseName) {
  return new Promise((resolve) => {
    const bytes = new Uint8Array(buffer);
    let text = '';
    try {
      // Try decoding as UTF-8 and fishing out readable fragments
      const raw = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      // Remove control chars except newline/tab
      text = raw.replace(/[\x00-\x08\x0E-\x1F]/g, ' ');
      // Look for XML-ish content between tags
      const fragments = text.match(/>([^<>]{3,})</g) || [];
      text = fragments.map(f => f.slice(1, -1)).filter(f => /[\u4e00-\u9fff\w]/.test(f)).join('\n');
    } catch(e) {}
    const chapters = splitTextIntoChapters(text);
    resolve({
      title: baseName || '文档',
      author: '佚名',
      cover: 'imported',
      format: type || ext,
      lang: detectLang(text),
      chapters: chapters.length ? chapters : [{ title: '', body: text.trim() || '当前浏览器不支持解压该格式，建议转换为 TXT 或 EPUB 后重新导入。' }]
    });
  });
}

function extractAllXmlText(entries) {
  let text = '';
  Object.keys(entries).forEach(p => {
    if (/\.(xml|xhtml|html)$/i.test(p) && !/\[Content_Types\]/i.test(p)) {
      try {
        const str = entries[p].asText ? entries[p].asText() : '';
        text += extractXmlText(str) + '\n\n';
      } catch(e) {}
    }
  });
  return text;
}

// Strip RTF formatting, keep plain text
function stripRtf(rtf) {
  if (!rtf) return '';
  let text = String(rtf);
  // 码页（\ansicpg936 之类）决定 \'hh 十六进制转义怎么解码
  const cpM = text.match(/\\ansicpg(\d+)/);
  const cp = cpM ? parseInt(cpM[1], 10) : 936;
  const cpDecode = bytes => {
    try {
      if (cp === 950) return new TextDecoder('big5').decode(bytes);
      if (cp === 1252) return new TextDecoder('windows-1252').decode(bytes);
      if (cp === 936 || cp === 0) return new TextDecoder('gb18030').decode(bytes);
      return new TextDecoder('utf-8').decode(bytes);
    } catch (e) { return ''; }
  };

  // \uN? → 真正的字符（N 是 16 位有符号数，负数要 +65536）
  text = text.replace(/\\u(-?\d+)\s?(\?)?/g, (m, n) => {
    let v = parseInt(n, 10);
    if (v < 0) v += 65536;
    return String.fromCharCode(v & 0xFFFF);
  });
  // \'hh 十六进制转义：连续一段一起按码页解码
  text = text.replace(/(?:\\'[0-9a-fA-F]{2})+/g, seq => {
    const bytes = [];
    const re = /\\'([0-9a-fA-F]{2})/g;
    let m;
    while ((m = re.exec(seq)) !== null) bytes.push(parseInt(m[1], 16));
    return cpDecode(new Uint8Array(bytes));
  });
  // 声明组先整组丢掉，免得字体名混进正文
  text = text.replace(/\{\\fonttbl[\s\S]*?\}/gi, ' ');
  text = text.replace(/\{\\colortbl[\s\S]*?\}/gi, ' ');
  text = text.replace(/\{\\stylesheet[\s\S]*?\}/gi, ' ');
  text = text.replace(/\{\\info[\s\S]*?\}/gi, ' ');
  text = text.replace(/\{\\\*[\s\S]*?\}/g, ' ');
  // 换行类控制字
  text = text.replace(/\\par\b/g, '\n').replace(/\\line\b/g, '\n').replace(/\\tab\b/g, '\t');
  // 其余控制字（含 \fs24 \b 这类参数）去掉
  text = text.replace(/\\[a-zA-Z]+(-?\d+)?\s?/g, ' ');
  // 转义字符还原
  text = text.replace(/\\([\\{}])/g, '$1');
  // 去括号、压空白
  text = text.replace(/[{}]/g, '');
  return text.replace(/[ \t]{2,}/g, ' ').replace(/\n\s+/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

// Parse comic archive (CBZ/CBR) — extract image list for viewing
async function parseComicArchive(file, ext) {
  const baseName = file.name.replace(/\.(cbz|cbr)$/i, '');
  if (ext === 'cbz') {
    const buf = await file.arrayBuffer();
    let zip;
    try { zip = await unzipEntries(buf); } catch (e) {
      return { title: baseName, author: '佚名', cover: 'imported', format: 'cbz', lang: 'other', isComic: true,
        chapters: [{ title: '', body: '漫画解析失败，可能文件损坏或不被支持。' }] };
    }
    const imgFiles = zip.names
      .filter(n => /\.(jpe?g|png|gif|bmp|webp)$/i.test(n) && !n.startsWith('__MACOSX/'))
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

    if (imgFiles.length) {
      const mimeOf = p => /\.png$/i.test(p) ? 'image/png'
        : /\.gif$/i.test(p) ? 'image/gif'
        : /\.webp$/i.test(p) ? 'image/webp'
        : /\.bmp$/i.test(p) ? 'image/bmp' : 'image/jpeg';
      const chapters = [];
      for (let i = 0; i < imgFiles.length; i++) {
        try {
          const blob = await zip.readBlob(imgFiles[i], mimeOf(imgFiles[i]));
          const dataUrl = await blobToDataURL(blob);
          chapters.push({ title: '第 ' + (i + 1) + ' 页', body: '', imageUrl: dataUrl });
        } catch (e) {
          chapters.push({ title: '第 ' + (i + 1) + ' 页', body: '[图片加载失败]' });
        }
      }
      return { title: baseName, author: '佚名', cover: 'imported', format: 'cbz', lang: 'other', chapters, isComic: true };
    }
    return { title: baseName, author: '佚名', cover: 'imported', format: 'cbz', lang: 'other', isComic: true,
      chapters: [{ title: '', body: '压缩包里没有找到图片。' }] };
  }
  // CBR = RAR archive, not supported without a RAR library
  return {
    title: baseName, author: '佚名', cover: 'imported', format: 'cbr', lang: 'other',
    chapters: [{ title: '', body: 'CBR（RAR 压缩漫画）格式暂不支持，请转换为 CBZ 后重新导入。' }]
  };
}

// Override JSZip usage in EPUB parser: ensure JSZip global is referenced correctly
function ensureJSZip() {
  // JSZip is loaded from CDN; if not available, we use manual fallback
  return typeof JSZip !== 'undefined' ? JSZip : null;
}

function detectLang(text) {
  const sample = text.slice(0, 1000);
  const cnChars = (sample.match(/[\u4e00-\u9fff]/g) || []).length;
  return cnChars > sample.length * 0.2 ? 'zh' : 'en';
}

function splitTextIntoChapters(text) {
  const patterns = [
    /(?:^|\n)\s*第\s*[一二三四五六七八九十百千\d]+\s*章/g,
    /(?:^|\n)\s*Chapter\s+\d+/gi,
    /(?:^|\n)\s*CHAPTER\s+[IVXLCDM\d]+/gi,
  ];
  let splitPoints = [];
  patterns.forEach(pat => {
    let m;
    while ((m = pat.exec(text)) !== null) splitPoints.push(m.index);
  });
  splitPoints = [...new Set(splitPoints)].sort((a,b) => a-b);
  
  if (splitPoints.length < 2) {
    // No chapters found; split by empty lines into sections of ~3000 chars
    const sections = [];
    const parts = text.split(/\n\s*\n/).filter(p => p.trim());
    let acc = '', idx = 0;
    parts.forEach(p => {
      if ((acc + p).length > 3000 && acc) { sections.push({title:`第 ${sections.length+1} 部分`, body:acc.trim()}); acc=''; }
      acc += p.trim() + '\n\n';
    });
    if (acc.trim()) sections.push({title:`第 ${sections.length+1} 部分`, body:acc.trim()});
    if (sections.length === 0) sections.push({title:'正文', body:text.trim()});
    return sections;
  }
  
  const chapters = [];
  for (let i = 0; i < splitPoints.length; i++) {
    const start = splitPoints[i];
    const end = splitPoints[i+1] || text.length;
    let titleEnd = text.indexOf('\n', start);
    if (titleEnd === -1 || titleEnd - start > 120) titleEnd = Math.min(start + 80, end);
    let title = text.slice(start, titleEnd).trim();
    title = title.replace(/^\d+\s*/, '').slice(0, 60);
    if (!title) title = `第 ${i+1} 章`;
    const body = text.slice(start, end).trim();
    chapters.push({ title, body });
  }
  return chapters;
}

// URL fetch
async function fetchUrlContent(url, progressEl, progressText) {
  progressEl.classList.add('show');
  progressText.textContent = '正在抓取网页内容…';
  try {
    // Use a CORS proxy
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    const resp = await fetch(proxyUrl);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    let html = await resp.text();
    // Extract title
    let title = url;
    const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
    if (titleMatch) title = titleMatch[1].trim();
    // Extract body text
    let text = html.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '').replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');
    text = text.replace(/<[^>]+>/g, '\n').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{3,}/g,'\n\n');
    const chapters = splitTextIntoChapters(text);
    const imported = JSON.parse(localStorage.getItem('reader_imported_books_v2') || '[]');
    imported.push({ id:'imp_'+Date.now(), title, author:'网页抓取', cover:'imported', lang:detectLang(text), chapters, imported:true });
    localStorage.setItem('reader_imported_books_v2', JSON.stringify(imported));
    saveState(); initBooks();
    progressEl.classList.remove('show');
    toast('网页内容已导入', 'success');
    renderBookshelf();
    closeSidebar();
  } catch(e) {
    progressEl.classList.remove('show');
    toast('抓取失败，可能是跨域限制', 'error');
  }
}

// ===== Export / Import / Reset =====
function exportData() {

  a.download = 'reader_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);

function resetAll() {
  if (confirm('确定恢复默认设置？已导入的书籍和笔记将保留。')) {
    localStorage.removeItem('reader_settings_v2');
    localStorage.removeItem('reader_progress_v2');
    localStorage.removeItem('reader_bookmarks_v2');
    localStorage.removeItem('reader_notes_v2');
    localStorage.removeItem('reader_stats_v2');
    location.reload();
  }
}

// ===== Paged mode =====
let pageMeasurer = null;
// ===== 翻页模式：CSS 多列排版 + 整栏位移，保证每页排满、页数准确 =====
function buildChapterHTML(chIdx) {
  const ch = state.currentBook.chapters[chIdx];
  if (!ch) return '';
  const bodyText = chapterBodyText(ch);
  const paragraphs = bodyText.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  const list = paragraphs.length ? paragraphs : [bodyText];
  const body = list.map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
  return (ch.title ? `<h2>${escapeHtml(ch.title)}</h2>` : '') + body;
}

function applyPageLayout() {
  const canvas = document.getElementById('pageCanvas');
  const wrapper = document.getElementById('pageWrapper');
  const w = Math.max(1, wrapper.clientWidth || 1);
  // 多列排版必须让“一栏宽”等于可视页宽，且不能有内边距，否则每页会露出下一栏
  canvas.style.boxSizing = 'border-box';
  canvas.style.padding = '0';
  canvas.style.width = w + 'px';
  const bar = document.getElementById('readerBottomBar');
  const reserve = bar ? Math.ceil(bar.getBoundingClientRect().height) + 6 : 0;
  canvas.style.height = Math.max(160, wrapper.clientHeight - reserve) + 'px';
  canvas.style.columnWidth = w + 'px';
  canvas.style.columnGap = '0px';
  canvas.style.columnFill = 'auto';
  canvas.style.overflow = 'visible';
  canvas.style.transform = 'translateX(0px)';
  return w;
}

function calcTotalPages() {
  if (state.settings.mode !== 'paged') return 1;
  const canvas = document.getElementById('pageCanvas');
  const wrapper = document.getElementById('pageWrapper');
  if (!canvas || !wrapper || !canvas.firstChild) return 1;
  const w = Math.max(1, wrapper.clientWidth || 1);
  return Math.max(1, Math.round((canvas.scrollWidth || w) / w));
}

function renderPage(pageIdx, animate) {
  if (state.settings.mode !== 'paged') return;
  const ch = state.currentBook.chapters[state.currentChapter];
  if (!ch) return;

  const canvas = document.getElementById('pageCanvas');
  if (!pageMeasurer || pageMeasurer.chapter !== state.currentChapter || !canvas.firstChild) {
    pageMeasurer = { chapter: state.currentChapter, html: buildChapterHTML(state.currentChapter) };
    canvas.innerHTML = pageMeasurer.html;
  }

  const w = applyPageLayout();
  const total = Math.max(1, Math.round((canvas.scrollWidth || w) / w));
  state.totalPages = total;
  state.pageIndex = Math.max(0, Math.min(Math.round(pageIdx) || 0, total - 1));
  canvas.style.transform = 'translateX(' + (-state.pageIndex * w) + 'px)';

  updateProgress();
  updatePageShadow();
}

function trimElement(el, offset) {
  // Trim text content from offset
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let removed = 0;
  const toRemove = [];
  let node;
  while ((node = walker.nextNode())) {
    if (removed + node.nodeValue.length <= offset) {
      removed += node.nodeValue.length;
      toRemove.push(node);
    } else {
      const keep = offset - removed;
      node.nodeValue = node.nodeValue.slice(keep);
      break;
    }
  }
  toRemove.forEach(n => n.parentNode.removeChild(n));
}

function updatePageShadow() {
  const left = document.getElementById('pageShadowLeft');
  const right = document.getElementById('pageShadowRight');
  if (state.settings.pageShadow) {
    left.classList.add('show'); right.classList.add('show');
  } else {
    left.classList.remove('show'); right.classList.remove('show');
  }
}

function nextPage() {
  if (state.settings.mode !== 'paged') return;
  const total = state.totalPages || 1;
  if (state.pageIndex < total - 1) {
    goToPage(state.pageIndex + 1, 'next');
  } else if (state.currentChapter < state.currentBook.chapters.length - 1) {
    renderChapter(state.currentChapter + 1, false);
    setTimeout(() => renderPage(0, false), 100);
  }
  playFlipSound();
}
function prevPage() {
  if (state.settings.mode !== 'paged') return;
  if (state.pageIndex > 0) {
    goToPage(state.pageIndex - 1, 'prev');
  } else if (state.currentChapter > 0) {
    renderChapter(state.currentChapter - 1, false);
    setTimeout(() => renderPage((state.totalPages||1) - 1, false), 100);
  }
  playFlipSound();
}
function goToPage(idx, dir) {
  if (state.settings.mode !== 'paged') return;
  const canvas = document.getElementById('pageCanvas');
  const wrapper = document.getElementById('pageWrapper');
  const w = Math.max(1, wrapper.clientWidth || 1);
  const total = state.totalPages || 1;
  const target = Math.max(0, Math.min(idx, total - 1));

  if (state.settings.animType === 'none') { renderPage(target, false); return; }

  canvas.style.transition = 'transform .28s cubic-bezier(0.4, 0, 0.2, 1)';
  state.pageIndex = target;
  canvas.style.transform = 'translateX(' + (-target * w) + 'px)';
  updateProgress();
  setTimeout(() => { canvas.style.removeProperty('transition'); }, 300);
}

// Flip sound
let audioCtx = null;
function playFlipSound() {
  if (!state.settings.flipSound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 800 + Math.random() * 200;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.05);
  } catch(e) {}
}

// ===== TTS (Text-to-Speech) =====
function toggleTTS() {
  if (state.tts.active) { stopTTS(); return; }
  startTTS();
}
function startTTS() {
  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读', 'error'); return; }
  
  const ch = state.currentBook.chapters[state.currentChapter];
  const text = ch.body;
  // Split into sentences
  const sentences = text.split(/(?<=[。！？.!?\n])\s*/).filter(s => s.trim().length > 0);
  
  state.tts.active = true;
  state.tts.sentences = sentences;
  state.tts.currentIndex = 0;
  state.tts.paused = false;
  
  document.getElementById('ttsBar').classList.add('show');
  document.getElementById('ttsBook').textContent = state.currentBook.title;
  document.getElementById('ttsChapter').textContent = ch.title || '';
  
  speakSentence();
}
function speakSentence() {
  if (!state.tts.active) return;
  const idx = state.tts.currentIndex;
  if (idx >= state.tts.sentences.length) {
    // Next chapter
    if (state.currentChapter < state.currentBook.chapters.length - 1) {
      renderChapter(state.currentChapter + 1, false);
      setTimeout(() => { state.tts.sentences = state.currentBook.chapters[state.currentChapter].body.split(/(?<=[。！？.!?\n])\s*/).filter(s=>s.trim().length>0); state.tts.currentIndex=0; speakSentence(); }, 200);
    } else { stopTTS(); }
    return;
  }
  
  const u = new SpeechSynthesisUtterance(state.tts.sentences[idx]);
  const lang = state.currentBook.lang === 'zh' ? 'zh-CN' : 'en-US';
  u.lang = lang;
  u.rate = 1.0;
  u.pitch = 1.0;
  u.onend = () => { if (state.tts.active) { state.tts.currentIndex++; speakSentence(); } };
  u.onerror = () => { if (state.tts.active) { state.tts.currentIndex++; speakSentence(); } };
  state.tts.utter = u;
  speechSynthesis.speak(u);
}
function stopTTS() {
  state.tts.active = false;
  state.tts.paused = false;
  speechSynthesis.cancel();
  document.getElementById('ttsBar').classList.remove('show');
}

// 通用朗读函数（可朗读任意文本）
function speakText(text) {
  if (!text || !text.trim()) { toast('没有可朗读的内容', 'error'); return; }
  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读', 'error'); return; }

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.trim());
  u.lang = state.currentBook && state.currentBook.lang === 'zh' ? 'zh-CN' : 'en-US';
  u.rate = 1.0;
  u.pitch = 1.0;
  u.onend = () => { state.tts.active = false; };
  state.tts.active = true;
  state.tts.utter = u;
  speechSynthesis.speak(u);

  // 更新 TTS 栏显示
  document.getElementById('ttsBar').classList.add('show');
